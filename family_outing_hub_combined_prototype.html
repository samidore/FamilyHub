      &lt;div class=&quot;meta&quot;&gt;&lt;span class=&quot;badge&quot;&gt;${esc(p.category)}&lt;/span&gt;&lt;span class=&quot;badge status&quot;&gt;${esc(p.status)}&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;${p.drive_min}–${p.drive_max} 分钟&lt;/span&gt;&lt;/div&gt;
      &lt;h3&gt;${esc(p.name)}&lt;/h3&gt;
      &lt;div class=&quot;location&quot;&gt;${esc(p.location)}&lt;/div&gt;
      &lt;div class=&quot;ratings&quot;&gt;
        &lt;div class=&quot;rating&quot;&gt;&lt;span class=&quot;rating-label&quot;&gt;Toddler&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;${stars(p.toddler)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;rating&quot;&gt;&lt;span class=&quot;rating-label&quot;&gt;家长体验&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;${stars(p.parent)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;rating&quot;&gt;&lt;span class=&quot;rating-label&quot;&gt;普通推车&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;${stars(p.stroller,p.stroller_note)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;rating&quot;&gt;&lt;span class=&quot;rating-label&quot;&gt;天气容错&lt;/span&gt;&lt;span class=&quot;stars&quot;&gt;${stars(p.weather)}&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card-body&quot;&gt;
      &lt;div class=&quot;tags&quot;&gt;${p.tags.map(t=&gt;`&lt;span class=&quot;tag&quot;&gt;${esc(t)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;div class=&quot;block fact&quot;&gt;&lt;h4&gt;已核实事实&lt;/h4&gt;&lt;p&gt;${esc(p.fact)}&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;block&quot;&gt;&lt;h4&gt;适配判断&lt;/h4&gt;&lt;p&gt;${esc(p.fit)}&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;block risk&quot;&gt;&lt;h4&gt;限制 / 风险&lt;/h4&gt;&lt;p&gt;${esc(p.risk)}&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;before&quot;&gt;&lt;strong&gt;出发前：&lt;/strong&gt;${esc(p.before)}&lt;/div&gt;
      &lt;div class=&quot;actions&quot;&gt;
        &lt;a class=&quot;map&quot; href=&quot;${p.map}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Google Maps / 用户照片&lt;/a&gt;
        &lt;a class=&quot;official&quot; href=&quot;${p.official}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;官方网站&lt;/a&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/article&gt;`;
}

function matchesMin(v, selected){
  if(!selected) return true;
  if(selected===&#x27;unknown&#x27;) return v===null || v===undefined;
  return v!==null &amp;&amp; v&gt;=Number(selected);
}

function apply(){
  const q=els.search.value.trim().toLowerCase();
  let result=places.filter(p=&gt;{
    const hay=[p.name,p.short,p.location,p.category,p.status,p.fact,p.fit,p.risk,...p.tags,...p.conditions].join(&#x27; &#x27;).toLowerCase();
    return (!q || hay.includes(q))
      &amp;&amp; (!els.category.value || p.category===els.category.value)
      &amp;&amp; (!els.drive.value || p.drive_band===els.drive.value)
      &amp;&amp; (!els.condition.value || p.conditions.includes(els.condition.value))
      &amp;&amp; (!els.status.value || p.status===els.status.value)
      &amp;&amp; matchesMin(p.indoor,els.indoor.value)
      &amp;&amp; matchesMin(p.outdoor,els.outdoor.value)
      &amp;&amp; matchesMin(p.stroller,els.stroller.value)
      &amp;&amp; matchesMin(p.weather,els.weather.value);
  });

  const sort=els.sort.value;
  result.sort((a,b)=&gt;{
    if(sort===&#x27;distance&#x27;) return a.drive_min-b.drive_min || a.drive_max-b.drive_max;
    if(sort===&#x27;toddler&#x27;) return b.toddler-a.toddler || a.drive_min-b.drive_min;
    if(sort===&#x27;parent&#x27;) return b.parent-a.parent || a.drive_min-b.drive_min;
    if(sort===&#x27;name&#x27;) return a.name.localeCompare(b.name,&#x27;en&#x27;);
    return b.score-a.score || a.drive_min-b.drive_min;
  });

  els.grid.innerHTML=result.map(card).join(&#x27;&#x27;);
  els.count.textContent=`显示 ${result.length} / ${places.length} 个地点`;
  els.empty.style.display=result.length?&#x27;none&#x27;:&#x27;block&#x27;;
}

[&#x27;input&#x27;,&#x27;change&#x27;].forEach(evt=&gt;{
  [els.search,els.sort,els.category,els.drive,els.condition,els.status,els.indoor,els.outdoor,els.stroller,els.weather]
    .forEach(el=&gt;el.addEventListener(evt,apply));
});
els.clear.addEventListener(&#x27;click&#x27;,()=&gt;{
  els.search.value=&#x27;&#x27;; els.sort.value=&#x27;recommended&#x27;;
  [els.category,els.drive,els.condition,els.status,els.indoor,els.outdoor,els.stroller,els.weather].forEach(el=&gt;el.value=&#x27;&#x27;);
  apply();
});
els.filterToggle.addEventListener(&#x27;click&#x27;,()=&gt;{
  const open=els.filterPanel.classList.toggle(&#x27;open&#x27;);
  els.filterToggle.textContent=open?&#x27;隐藏筛选条件&#x27;:&#x27;显示筛选条件&#x27;;
});
apply();
&lt;/script&gt;
&lt;/body&gt;

steps:
  - 准备：虾擦干后拌虾仁调味；鸡蛋打散后加入蛋液调味。；葱花1–2 Tbsp可选。
  - 不粘锅中大火加2 tsp油，虾仁单层煎/炒到刚变粉红、不透明约七成熟，立即盛出。
  - 锅擦净或降到中火，再加2 tsp油；倒入蛋液。
  - 蛋液底部刚凝固就用锅铲从边缘向中心推，保持大块软蛋。
  - 蛋约七成熟时把虾仁回锅，轻折20–40秒。
  - 虾完全不透明、蛋液完全凝固但表面仍有湿润光泽时立刻关火。
  - 完成提示：虾刚熟有弹性；蛋块完全凝固但软嫩，不出现干碎颗粒。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 虾仁：300 g
  - 鸡蛋：5个
  - 虾仁预处理：盐 1/2 tsp；白胡椒 1/2 tsp；玉米淀粉 1 tsp
  - 蛋液：盐 1/2 tsp；糖 1/2 tsp；中性油 1 tsp

steps:
  - 准备：虾擦干；西兰花切小朵。；面水烧开并加适量盐；酱油和清酒量好，黄油单独放。
  - 面条按包装煮；最后2分钟把西兰花加入同锅，捞前保留1/3 cup面水。
  - 同时不粘锅中大火加1 tsp油，虾单层煎到约七成熟，盛出。
  - 锅中下蒜10秒，加入生抽、清酒和面水；煮开。
  - 沥干面和西兰花入锅，虾回锅；大火翻30–60秒。
  - 关火加入黄油拌到乳化；虾完全不透明即停止。
  - 孩子份剪短面条。
  - 完成提示：面条有咬劲、西兰花熟而不烂、虾刚熟；汁乳化薄挂面条。
  - 安全提示：虾/扇贝/鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。生蚝烤至边缘卷起且内部充分加热。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 虾仁：300 g
  - 西兰花：300 g，小朵
  - 面条/意面：300 g干重
  - 日式酱油黄油汁：生抽 1.5 Tbsp；清酒 1 Tbsp；无盐黄油 1 Tbsp；煮面水 1/3 cup；蒜末 1 tsp

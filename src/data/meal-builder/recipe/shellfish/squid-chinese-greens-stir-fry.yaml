steps:
  - 准备：鱿鱼彻底擦干，切成大小一致的片/圈；青菜切好并彻底沥干；所有调味必须先准备好。
  - 锅大火预热后加油；鱿鱼单层下锅，刚变不透明时立即翻动，第一轮做到约七八成熟并盛出。
  - 原锅先把青菜炒到刚断生；硬菜可预先焯30–60秒。
  - 鱿鱼回锅，加入轻盐汁，快速翻10–30秒；鱿鱼刚全部不透明且仍有弹性时立即关火。
  - 孩子份把鱿鱼剪小，青菜切成易夹取的小段。
  - 完成提示：鱿鱼刚熟、仍有弹性；酱汁薄薄附着，不靠长时间收浓。
  - 安全提示：鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。
child_serving: 如给孩子仅取非常小、嫩的部分；另配软蛋白。
adult_finish: 孩子份盛出后，成人可另加辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 鱿鱼：450 g
  - 青菜：300–450 g
  - 轻盐鱿鱼汁：水 2 Tbsp；生抽 2 tsp；蚝油 1 tsp；绍兴酒 1 Tbsp；糖 1/4 tsp

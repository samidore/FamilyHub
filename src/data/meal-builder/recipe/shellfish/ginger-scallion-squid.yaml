steps:
  - 鱿鱼清理后切一口大小并擦干；姜切丝、葱切段；调味汁预混。
  - 另锅水大开，鱿鱼下锅约30秒、刚开始卷曲就立即捞出彻底沥干。
  - 炒锅大火预热，加2 tsp油，下姜丝和葱白10秒；下鱿鱼大火快速翻炒，沿锅边淋绍兴酒和调味汁。
  - 汁一沸、鱿鱼全部不透明时立即关火，撒葱绿装盘；不要留在热锅中继续变韧。
  - 完成提示：鱿鱼刚熟、仍有弹性；酱汁薄薄附着。
  - 安全提示：鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。
child_serving: 本 Recipe 不计 Child Protein。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒、黑胡椒或孜然。
substitutions: []
cook_ingredients:
  - 鱿鱼：450 g
  - 姜：10 g；葱：3根；中性油 2 tsp
  - 调味汁：生抽 2 tsp；绍兴酒 1 Tbsp；糖 1/4 tsp；水 1 Tbsp

steps:
  - 锅中加4 cups水或低盐高汤和姜片，煮到微滚。
  - 用两把小勺把虾滑或鱼滑分成约2–3 cm小团逐个下锅；保持汤稳定微滚，不猛烈沸腾。
  - 全部浮起后继续煮；有包装加热说明时按包装执行，否则切开最大一团确认中心完全熟、无半透明生芯或冷芯。
  - 少量盐和白胡椒调味，关火撒葱花。
child_serving: 本 Recipe 不计 Child Protein。
adult_finish: 可加白胡椒、香油或辣椒油。
substitutions: []
cook_ingredients:
  - 虾滑或鱼滑：350–450 g；任选一种
  - 水或低盐高汤：4 cups；姜3片；葱1根；盐和白胡椒少量

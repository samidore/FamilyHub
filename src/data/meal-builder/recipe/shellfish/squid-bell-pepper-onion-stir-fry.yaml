steps:
  - 准备：鱿鱼彻底擦干并切成大小一致的片/圈；甜椒、洋葱切好并沥干；所有调味先准备好。
  - 锅大火预热后加油；鱿鱼单层下锅，刚变不透明时立即翻动，第一轮只做到约七八成熟并盛出。
  - 原锅先把甜椒和洋葱炒到刚断生；硬菜可预先焯30–60秒。
  - 鱿鱼回锅，加入轻盐汁，快速翻10–30秒；刚全部不透明、仍有弹性时立即关火。
  - 孩子份把鱿鱼剪小，蔬菜切成易夹取的小段。
  - 完成提示：海鲜刚熟、仍有弹性；酱汁薄薄附着，不靠长时间收浓。
  - 安全提示：鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。
child_serving: 如给孩子仅取非常小、嫩的部分；另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鱿鱼：450 g
  - 甜椒：300–450 g
  - 洋葱：300–450 g
  - 轻盐鱿鱼汁：水 2 Tbsp；生抽 2 tsp；蚝油 1 tsp；绍兴酒 1 Tbsp；糖 1/4 tsp

steps:
  - 准备：海鲜彻底擦干；虾去肠线，鱿鱼切成大小一致的片/圈，扇贝去侧筋。；配菜提前切好并彻底沥干；海鲜快炒时间很短，所有调味必须先准备好。
  - 锅大火预热后加油；海鲜单层下锅，不要堆叠。
  - 虾/鱿鱼/扇贝一面刚变不透明或形成焦色时立即翻动；第一轮只做到约七八成熟并盛出。
  - 若有蔬菜，原锅先把蔬菜炒到刚断生；硬菜可预先焯30–60秒。
  - 海鲜回锅，加入对应轻盐汁，快速翻10–30秒。
  - 海鲜刚全部不透明、质地变紧实但仍有弹性时立即关火；不要继续为了收汁久煮。
  - 孩子份虾去尾壳，鱿鱼剪小；扇贝按大小切。
  - 完成提示：海鲜刚熟、仍有弹性；酱汁薄薄附着，不靠长时间收浓。
  - 安全提示：虾/扇贝/鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。生蚝烤至边缘卷起且内部充分加热。
child_serving: 如给孩子仅取非常小、嫩的部分；另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鱿鱼：450 g
  - 甜椒：300–450 g
  - 洋葱：300–450 g
  - 轻盐鱿鱼汁：水 2 Tbsp；生抽 2 tsp；蚝油 1 tsp；绍兴酒 1 Tbsp；糖 1/4 tsp

steps:
  - 准备：虾仁用厨房纸彻底擦干；厚薄不一致时尽量整理成接近一致厚度。；下锅前均匀撒基础盐胡椒；不要提前长时间盐腌薄片海鲜。
  - 厚底不粘锅或铁锅中大火预热；加油并转动锅面，油流动变快时放入虾仁。
  - 虾仁放下后先不要移动，让接触面形成完整焦色；锅温过高冒浓烟则立即降一档。
  - 翻面后转中火；厚件可加盖短暂焖熟，但不要加大量水把煎变成煮。
  - 虾/扇贝中心由半透明转不透明、质地刚变紧实时立即离火；不要久煎。
  - 直接盛到冷盘/常温盘，停止热锅余温继续加热。
  - 完成提示：两面有均匀焦色；内部达到安全温度且没有因继续煎而明显出水变柴。
  - 安全提示：虾/扇贝/鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。生蚝烤至边缘卷起且内部充分加热。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - garlic finish
  - honey-soy finish
  - butter finish
cook_ingredients:
  - 虾仁：300 g
  - 基础调味：盐 1/2 tsp；黑胡椒 1/4 tsp；中性油 2 tsp

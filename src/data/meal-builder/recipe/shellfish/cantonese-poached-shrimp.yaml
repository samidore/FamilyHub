steps:
  - 清洗 shell-on shrimp；蘸汁单独准备，基础虾不做重口调味。
  - 水烧到适合白灼的状态后下虾，短时间煮至完全变色并达到合适熟度，立即捞出，避免久煮变韧。
  - 成人份可蘸酱；孩子若食用，由成人完全剥壳、去除硬壳碎片并剪小。

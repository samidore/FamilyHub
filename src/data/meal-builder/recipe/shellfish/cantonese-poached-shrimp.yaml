steps:
  - 准备：虾冲净并去肠线；带壳保留。；蘸汁另碗混匀。
  - 白灼水大火煮到充分沸腾。
  - 一次下虾，轻拨散；水重新沸腾后观察颜色。
  - 虾全部变粉红、肉由半透明变不透明且卷成松弯C形时立即捞出，通常只需数分钟。
  - 沥干后直接上桌或短暂过凉水停止余温；不要长泡。
  - 孩子份彻底去壳去尾并按大小切。
  - 完成提示：虾肉刚不透明、有弹性；不卷成紧硬O形、不久煮发柴。
  - 安全提示：虾/扇贝/鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。生蚝烤至边缘卷起且内部充分加热。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 带壳虾：450 g
  - 白灼水：水 2 L；姜 5片；葱 2根；绍兴酒 1 Tbsp，可省
  - 蘸汁：生抽 1 Tbsp；米醋 1 Tbsp；热水 1 Tbsp；姜末 1 tsp

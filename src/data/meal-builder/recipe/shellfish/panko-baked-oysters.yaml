steps:
  - 准备：烤箱预热450°F/230°C；生蚝检查碎壳并吸去表面多余水。；Panko topping混匀。
  - 生蚝排在铺盐/铝箔固定的烤盘上，每只薄铺一层Panko，不压厚。
  - 送入烤箱上层烤5–8分钟。
  - 当面包糠金黄、蚝边缘卷起、内部热透时取出；若Panko上色慢可最后上火1分钟并全程看守。
  - 不要继续烤到蚝明显缩小干硬。
  - 稍降温后上桌；孩子是否食用按原 child coverage 记录，不自动改变。
  - 完成提示：Panko金黄酥脆；蚝边缘卷起、内部充分热透但未干缩。
  - 安全提示：虾/扇贝/鱿鱼煮至肉体不透明、质地刚变紧实；避免继续久煮变老。生蚝烤至边缘卷起且内部充分加热。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 生蚝：12只，开壳留半壳或约450 g蚝肉
  - Panko topping：Panko 1/2 cup；橄榄油/融化黄油 1 Tbsp；蒜末 1 tsp；柠檬皮屑 1/2 tsp，可省；盐 1小撮

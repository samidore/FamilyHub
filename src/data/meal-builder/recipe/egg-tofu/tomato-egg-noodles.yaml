steps:
  - 处理 eggs 与 tomato；准备 tomato-egg topping / light broth or sauce。
  - 面条按种类煮至合适熟度并沥水；汤面则保留单独汤底。
  - 炒面在高输出灶口快速合炒；汤面则把主料/蔬菜在汤中依次煮熟。
  - 最后合并并调整清淡盐度；成人辣味另加。

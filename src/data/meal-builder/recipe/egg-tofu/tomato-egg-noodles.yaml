steps:
  - 准备：鸡蛋打匀；番茄切块。；另锅烧面水。
  - 炒锅中大火加2 tsp油，蛋炒到七成熟盛出。
  - 原锅加1 tsp油，下番茄炒2–3分钟到明显出汁。
  - 加入番茄面汁煮开，转中火2分钟；鸡蛋回锅，轻折到完全凝固。
  - 同时面条煮到刚熟，捞入3个碗。
  - 把番茄鸡蛋和足量汤汁浇在面上；汁应能湿润面条但不是大量清汤。
  - 孩子份剪短面条。
  - 完成提示：番茄软出汁、鸡蛋嫩而熟；面条刚熟，碗底有少量可拌开的番茄汁。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡蛋：4个
  - 番茄：450 g，切块
  - 面条：450 g鲜面或3人份干面
  - 蛋液：盐 1/4 tsp；水 1 Tbsp
  - 番茄面汁：生抽 1 Tbsp；糖 1 tsp；水或低盐高汤 1 cup；盐 1/4 tsp起

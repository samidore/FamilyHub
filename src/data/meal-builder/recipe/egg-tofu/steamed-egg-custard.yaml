steps:
  - 准备：鸡蛋充分打匀；加入温水和盐搅匀。；过筛入浅碗，撇掉表面大泡；盖耐热盘或保鲜膜留小缝防冷凝水滴入。
  - 蒸锅水先烧开后转小火，让水保持轻微沸腾而不是猛烈翻滚。
  - 放入蛋碗，盖锅；小火蒸8分钟后开始检查。
  - 轻晃碗：中心整体像果冻一样轻颤但没有水状液体时关火；若中心仍像水，每次继续1–2分钟。
  - 离火后盖着静置2分钟，让余温完成凝固。
  - 孩子份不必加酱油；成人份可滴1 tsp生抽和少量芝麻油。
  - 完成提示：表面平滑，中心凝固、整体轻颤；切开没有水状生蛋液。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡蛋：4个
  - 温水：1.5–2 cups
  - 蛋液：盐 1/2 tsp；温水 1.5 cups偏紧实；2 cups更嫩
  - 出锅调味：生抽 1 tsp，可选；芝麻油 几滴，可选

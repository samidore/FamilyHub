steps:
  - 准备：豆腐沥去包装水；嫩豆腐切2.5–3 cm块并尽量少搬动，硬豆腐可切1.5 cm厚片。；把豆腐汁搅匀；姜切丝5 g、葱切段备用。
  - 豆腐排在耐热盘中；蒸锅水先烧开，再把盘子上锅。
  - 中火蒸5–8分钟，目标是中心彻底热透而不是把豆腐蒸出大量水。
  - 取出后小心倒掉盘中多余水分；把生抽2 tsp与热水1 Tbsp混匀淋在豆腐周围。
  - 撒姜丝和葱；家庭版不做大量热油泼，最多用1 tsp芝麻油点香。
  - 孩子份取中心软嫩部分，确认温度降到可入口再上桌。
  - 完成提示：豆腐中心热透、形状完整；盘底只有少量清亮汁，不泡在大量水中。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 嫩豆腐：1盒，约400–450 g
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

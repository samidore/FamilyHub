steps:
  - 豆腐沥水，切1.5 cm厚片；调味汁混匀。
  - 不粘锅中火预热，加2 tsp油；豆腐单层排入，第一面浅金黄后翻面。
  - 第二面浅金黄后倒入调味汁，转中小火。
  - 轻轻晃锅，焖2–4分钟，让中心热透、汁薄薄挂住豆腐。
  - 孩子份可提前少煎、再多焖1–2分钟至叉子容易压开，先盛出切小。
  - 成人份若要更香，可最后转中火收汁30秒。
  - 完成提示：内部柔软热透；酱汁薄挂而不是厚糊。
child_serving: 取焖软的中心和较软边缘，切成小块；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 老豆腐 / 硬豆腐：1盒，约400–450 g
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

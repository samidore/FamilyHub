steps:
  - 准备：鸡蛋打散到蛋白蛋黄完全融合，加入盐和1 Tbsp水。；嫩豆腐洗净/处理后切成一口大小；含水多的瓜类或菌菇需要先单独炒到水汽明显减少。
  - 炒锅中大火预热，加2 tsp油；倒蛋液后用锅铲从外向内推，约七成熟、仍有湿润光泽时立即盛出。
  - 原锅补1 tsp油，加入嫩豆腐；中大火炒到刚熟并把多余水汽蒸掉。
  - 鸡蛋回锅，快速翻折而不是长时间铲碎。
  - 看到最后一层湿蛋液刚刚凝固即关火；余温会继续把蛋做熟。
  - 孩子份先盛出；成人需要胡椒/辣味再另加。
  - 完成提示：蛋块柔软、刚完全凝固；配菜熟而不水汪汪，锅底无大量游离汁。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 嫩豆腐：1盒，约400–450 g
  - 鸡蛋：4个
  - 蛋液：盐 1/4 tsp；水 1 Tbsp；中性油 1 tsp，拌入蛋液可省

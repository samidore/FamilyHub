steps:
  - 准备：鸡蛋打匀但不必打入大量空气。；薄芡提前搅匀；不喜欢勾芡可完全省略。
  - 加入汤底煮开，转中小火；若使用薄芡，边搅边倒入，煮到汤只略有稠度。
  - 把火调到只保持小泡，用筷子沿同一方向缓慢搅汤形成旋涡。
  - 蛋液细线状缓慢倒入；倒完后停止搅动10–15秒，让蛋花定型。
  - 轻轻推散大块蛋花，再煮到蛋完全凝固；不要持续猛搅成碎屑。
  - 最后尝味，孩子份先盛出降温；成人可加白胡椒。
  - 完成提示：蛋花成柔软丝带、完全凝固；汤只微稠或清汤状，不是厚羹。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡蛋：3个
  - 汤底：低盐鸡汤 4 cups；生抽 1 tsp；芝麻油 1/2 tsp；白胡椒 1小撮
  - 可选薄芡：玉米淀粉 1 Tbsp；水 2 Tbsp

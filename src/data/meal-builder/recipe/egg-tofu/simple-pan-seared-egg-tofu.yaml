steps:
  - 准备：豆腐沥去包装水；嫩豆腐切2.5–3 cm块并尽量少搬动，硬豆腐可切1.5 cm厚片。；把豆腐汁搅匀；姜切丝5 g、葱切段备用。
  - 不粘锅中火预热，加2 tsp油；硬豆腐/蛋豆腐擦干后单层排入。
  - 第一面煎到能轻松铲起且呈浅金黄再翻面；不要频繁移动导致破碎。
  - 豆腐回锅（无额外配料则留在锅中），把豆腐汁再次搅匀后沿锅边加入。
  - 轻轻晃锅让汁覆盖豆腐，煮30–60秒到汁刚变薄稠。
  - 汁能薄薄挂住豆腐、锅底只剩少量时关火。
  - 完成提示：豆腐外层浅金黄、内部柔软热透；汁薄挂而非厚糊。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 切成易入口的小块，保留清淡软嫩部分。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡蛋豆腐（日本豆腐）：2条/管，约300–350 g
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

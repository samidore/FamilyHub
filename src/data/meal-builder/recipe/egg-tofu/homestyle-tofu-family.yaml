steps:
  - 豆腐沥水切1.5 cm厚片；甜椒切一口大小；调味汁混匀。
  - 锅中火加1 tsp油，下姜丝炒10秒；加入甜椒炒到开始变软。
  - 加入豆腐，沿锅边倒入轻盐豆腐汁；少翻，用晃锅和锅铲背面轻推。
  - 煮开后转中小火3–5分钟，让豆腐中心热透、甜椒完全熟软。
  - 孩子份先盛出软豆腐和软甜椒并切小；成人份再中火收汁30–60秒。
  - 完成提示：豆腐内部柔软、酱汁薄挂勺，不是厚芡。
child_serving: 取焖软豆腐切小；本 Recipe 可计入 Child Protein，甜椒足够软时也计 Child Vegetable。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 老豆腐 / 硬豆腐：1盒，约400–450 g
  - 甜椒：300–450 g
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

steps:
  - 按菜式需要处理 firm-tofu；蔬菜为 bell-pepper。肉类需要嫩化/短腌时按引用来源执行。
  - 先把核心调味准备好：soy / garlic / mild savory sauce; chili removed from base and oil
    reduced；家庭版基底不放辣并降低盐油。
  - 热锅少油，先把主要蛋白炒至接近熟并视需要盛出；再处理蔬菜/香料。
  - 合回主料，加入调味快速翻匀，达到合适熟度即停火，避免为追求焦色延长烹调。
child_serving: 可少量提供；Meal Combo 另配孩子已接受的嫩豆腐/鸡蛋。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

steps:
  - 按选中的豆腐准备：嫩豆腐切约2.5 cm块并少搬动；老豆腐切约1.5 cm厚片；鸡蛋豆腐切厚段。调味汁混匀。
  - 不粘锅中火加1 tsp油；老豆腐或鸡蛋豆腐可先轻煎到表面定型，嫩豆腐直接轻轻滑入，不必煎。
  - 沿锅边倒入家庭轻盐豆腐汁，煮开后转中小火；少翻动，用晃锅和锅铲背面轻推。
  - 轻焖3–5分钟，到豆腐中心热透、汁薄薄挂住豆腐；嫩豆腐和鸡蛋豆腐以不碎为先，不追求收得很干。
  - 孩子份先盛出软嫩、清淡的豆腐并切小；成人份需要时再中火收汁30–60秒。
  - 完成提示：豆腐内部柔软热透、仍保持主要形状；酱汁薄挂勺，不是厚芡。
child_serving: 取焖软豆腐切小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 嫩豆腐 / 老豆腐 / 鸡蛋豆腐：任选一种；嫩豆腐或老豆腐约1盒（400–450 g），鸡蛋豆腐约2条/管（300–350 g）
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

steps:
  - 准备：豆腐沥去包装水；嫩豆腐切2.5–3 cm块并尽量少搬动，硬豆腐可切1.5 cm厚片。；把豆腐汁搅匀；姜切丝5 g、葱切段备用。 甜椒切成一口大小。
  - 锅中火加1 tsp油，下姜丝炒10秒；加入甜椒先炒到接近熟。
  - 轻轻滑入豆腐，沿锅边倒入家庭轻盐豆腐汁；用晃锅和锅铲背面轻推，少翻。
  - 煮开后转中小火2–4分钟，让豆腐中心热透；有配菜时同时煮到完全熟。
  - 若汁仍像水，用中火再煮30–60秒；不要猛烈翻炒把嫩豆腐搅碎。
  - 汁变成薄薄挂勺且豆腐仍完整时关火。
  - 完成提示：豆腐中心热透、块形完整；酱汁薄挂勺，不是厚芡。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 可少量提供；Meal Combo 另配孩子已接受的嫩豆腐/鸡蛋。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 老豆腐 / 硬豆腐：1盒，约400–450 g
  - 甜椒：300–450 g
  - 家庭轻盐豆腐汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp；玉米淀粉 1 tsp

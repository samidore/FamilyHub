steps:
  - 准备：豆腐切块尽量少搬动；番茄去硬蒂切2–3 cm块。；番茄豆腐汁搅匀。
  - 深不粘锅中火加1 tsp油，下番茄炒2–3分钟到边缘软并明显出汁。
  - 倒入番茄豆腐汁煮开，轻轻滑入豆腐。
  - 转中小火煮3–5分钟，用晃锅代替频繁翻动。
  - 豆腐中心热透后转中火30–60秒，让汁从水状变成薄挂勺。
  - 豆腐仍完整、番茄软但有块形时关火；孩子份可少带汁。
  - 完成提示：番茄自然出汁、豆腐完整热透；汁薄挂勺，不成厚芡。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 嫩豆腐：1盒，约400–450 g，切2.5 cm块
  - 番茄：450 g，切块
  - 番茄豆腐汁：水或低盐高汤 1/2 cup；生抽 2 tsp；糖 1/2 tsp；玉米淀粉 1 tsp

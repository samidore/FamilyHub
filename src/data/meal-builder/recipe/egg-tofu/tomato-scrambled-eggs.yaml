steps:
  - 准备：鸡蛋加盐和水打匀；所选蔬菜按质地切成适合快炒的大小，硬梗先焯。
  - 炒锅中大火加2 tsp油，倒蛋液；推成大块，约七成熟仍湿润时盛出。
  - 原锅加1 tsp油，下所选蔬菜和1/4 tsp盐，按质地炒到刚熟；硬梗材料可加2 Tbsp水短焖。
  - 鸡蛋回锅，轻轻翻折，让蔬菜的自然汁水薄薄裹住蛋块。
  - 蛋液完全凝固、蔬菜仍有形时关火；不要让锅底积水。
  - 完成提示：鸡蛋软嫩、完全凝固；所选蔬菜刚熟仍有形。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可另加辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 鸡蛋：4个
  - 所选蔬菜：300–450 g
  - 蛋液：盐 1/4 tsp；水 1 Tbsp
  - 蔬菜调味：盐 1/4 tsp；水 2 Tbsp，仅硬梗或较干蔬菜需要时

steps:
  - 准备：乌冬按包装焯散并沥水；牛肉片太长时切成8–10 cm。；洋葱薄切；两组调味分别量好。
  - 小锅中火加1 tsp油，下洋葱炒到边缘透明；加入牛肉片拨散。
  - 牛肉大部分变色时加入糖、味醂1 Tbsp和生抽1 Tbsp，煮到汁几乎被吸附，立即离火。
  - 另一汤锅把5 cups高汤、生抽3 Tbsp、味醂2 Tbsp煮开，尝后只补必要盐。
  - 乌冬分3碗，浇入滚热汤；把甜咸牛肉洋葱分在面上。
  - 牛肉需无冷生中心但不要在汤中继续长煮；孩子份剪短牛肉和乌冬。
  - 完成提示：乌冬热透有弹性；汤清而可直接喝；牛肉洋葱甜咸但不柴。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 洋葱：150 g，薄切
  - 乌冬面：3人份，约600 g熟面
  - 乌冬汤：日式高汤 5 cups；生抽 3 Tbsp；味醂 2 Tbsp；盐 1/4 tsp起
  - 牛肉甜咸汁：糖 1 tsp；味醂 1 Tbsp；生抽 1 Tbsp

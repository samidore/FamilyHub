steps:
  - 牛肉片若很长切短；洋葱薄切；牛丼汁混匀。
  - Instant Pot 加入洋葱、牛丼汁和火锅牛肉片，轻轻拨散；锁盖 High Pressure 1分钟，完成后立即快速泄压。
  - 检查牛肉无冷生中心；若未熟，用 Instant Pot Sauté 短煮并逐片复查。锅内保留可流动汁，不收浓。
  - 连软洋葱与丼汁分到熟饭上；孩子份把牛肉剪成短小段。
  - 完成提示：洋葱软甜、牛肉熟而湿润；锅内留足够丼汁。
  - 安全提示：牛肉无冷生中心；薄肉片用温度计时应从侧面测中心。
child_serving: 牛肉剪短、洋葱煮软；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加七味粉或更重调味。
substitutions: []
cook_ingredients:
  - 火锅牛肉片或牛胸肉薄片：340 g
  - 洋葱：约170 g，薄切
  - 米饭：3碗熟饭，另行烹好
  - 压力丼汁：日式高汤 3/4 cup；清酒 3 Tbsp；味醂 3 Tbsp；生抽 4.5 Tbsp；糖 1.5 Tbsp

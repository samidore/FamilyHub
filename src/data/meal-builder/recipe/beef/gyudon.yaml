steps:
  - 准备：牛肉片若很长切成8–10 cm；洋葱顺纹薄切。；牛丼汁全部放宽锅中。
  - 冷锅加入牛丼汁和洋葱，中火煮开后转中小火，煮到洋葱开始透明。
  - 把牛肉片逐片拨散加入，避免成团；轻轻翻动让肉全部接触汤汁。
  - 盖盖中小火3–4分钟；撇掉明显浮沫。
  - 打开检查牛肉无冷生中心，再煮约1分钟让汁味均匀。
  - 锅中应保留相当一部分可流动汁；直接分到3碗饭上，不收成浓酱。
  - 孩子份把牛肉片剪短。
  - 完成提示：洋葱软甜、牛肉熟而仍嫩；锅内保留足够丼汁湿润米饭。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片/牛腩片：340 g
  - 洋葱：约170 g，薄切
  - 米饭：3碗熟饭
  - 牛丼汁：日式高汤 3/4 cup；清酒 3 Tbsp；味醂 3 Tbsp；生抽 4.5 Tbsp；糖 1.5 Tbsp

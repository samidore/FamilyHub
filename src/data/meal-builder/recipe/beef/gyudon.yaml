    cook_ingredients: [面汤 3碗；葱花适量]
    steps: [将完成的牛肉和洋葱连汤分到熟面条上，保留流动汤汁。]
steps:
  - 牛肉片若很长切短；洋葱薄切；按所选 Finish 准备调味汁。
  - 冷锅加入所选 Finish 的调味汁和洋葱，中火煮开后转中小火，煮到洋葱透明柔软。
  - 若选择顺手焖配料，按硬度加入；根茎先下，豆制品和叶菜后下，煮到软而不散。
  - 牛肉片逐片拨散加入，轻轻翻动让肉全部接触汤汁；检查无冷生中心后立即停止加热。
  - 锅中保留可流动汁，按所选 Serving 分到熟饭或熟面上，不同时准备另一种主食，也不收成浓酱。
  - 孩子份把牛肉剪短、洋葱煮软；完成提示为牛肉熟而湿润、锅内保留足够汤汁。
  - 安全提示：牛肉片实际加热至无冷生中心。
child_serving: 牛肉剪短、洋葱煮软；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加七味粉或更重调味。
substitutions: []
cook_ingredients:
  - 火锅牛肉片/牛腩薄片：340 g，任选一种
  - 洋葱：约170 g，薄切
  - 所选 Serving：熟饭或熟面，按上桌选择准备
  - 具体调味汁按所选 Finish 准备

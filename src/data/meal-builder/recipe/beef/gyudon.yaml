steps:
  - 牛肉片若很长切短；洋葱薄切；牛丼汁全部放宽锅中。
  - 冷锅加入牛丼汁和洋葱，中火煮开后转中小火，煮到洋葱透明柔软。
  - 牛肉片逐片拨散加入，轻轻翻动让肉全部接触汤汁。
  - 盖盖中小火3–4分钟；打开检查无冷生中心，再煮约1分钟。
  - 锅中保留可流动汁，直接分到熟饭上，不收成浓酱。
  - 孩子份把牛肉剪成短小段，连软洋葱和汁一起提供。
  - 完成提示：洋葱软甜、牛肉熟而湿润；锅内保留足够丼汁。
child_serving: 牛肉剪短、洋葱煮软；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加七味粉或更重调味。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 洋葱：约170 g，薄切
  - 米饭：3碗熟饭
  - 牛丼汁：日式高汤 3/4 cup；清酒 3 Tbsp；味醂 3 Tbsp；生抽 4.5 Tbsp；糖 1.5 Tbsp

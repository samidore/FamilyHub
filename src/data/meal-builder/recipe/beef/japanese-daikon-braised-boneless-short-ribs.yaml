steps:
  - 准备：主料切成大小一致、适合炖煮的块；块根切约2.5–3 cm。；日式煮汁混匀。
  - 厚锅中火加1 tsp油；肉类有明显表面时先煎到浅褐，薄片类只需快速变色。
  - 加入较硬的洋葱/块根翻1分钟，再倒入日式煮汁。
  - 煮开后撇去浮沫，转小火盖盖留缝；保持轻微咕嘟。
  - 先炖肉到开始变软，再确保块根煮到筷子可穿透；若液体过少补热水，不补浓酱油。
  - 最后开盖中火减少到汁量约剩一半、仍能舀起；不是所有日式煮物都需要收干。
  - 关火静置5分钟让味道回吸。
  - 完成提示：肉软嫩、块根熟而不碎；锅内保留少量清亮甜咸煮汁。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 无骨牛小排：900 g
  - 白萝卜：300–450 g
  - 日式煮汁：日式高汤或水 2 cups；生抽 3 Tbsp；味醂 3 Tbsp；清酒 2 Tbsp；糖 1 Tbsp

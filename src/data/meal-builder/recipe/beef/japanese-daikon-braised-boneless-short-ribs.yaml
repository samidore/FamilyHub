steps:
  - 无骨牛小排切成大小一致的炖煮块；白萝卜切2.5–3 cm块。
  - Instant Pot Sauté 加1 tsp油，将肉块煎至浅褐后取出；加入日式高汤或水2 cups、生抽、味醂、清酒和糖，刮净锅底。
  - 放回牛肉，锁盖 High Pressure 38分钟，自然泄压15分钟；检查肉软嫩但仍成形，不够软时再加压5分钟并自然泄压10分钟。
  - 取出牛肉；加入白萝卜和约1 cup压力汁，High Pressure 3分钟后快速泄压。
  - 牛肉放回，用 Instant Pot Sauté 将汁减少到约剩一半且仍能舀起；静置5分钟回吸。
  - 完成提示：肉软嫩，萝卜熟而不碎；锅内保留少量清亮甜咸煮汁。
  - 安全提示：整块牛肉达到至少145°F/63°C并静置3分钟。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 无骨牛小排：900 g
  - 白萝卜：300–450 g
  - 压力日式煮汁：日式高汤或水 2 cups；生抽 3 Tbsp；味醂 3 Tbsp；清酒 2 Tbsp；糖 1 Tbsp

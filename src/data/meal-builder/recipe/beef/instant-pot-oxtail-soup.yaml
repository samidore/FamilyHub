steps:
  - 准备：牛尾检查骨屑；家庭若偏好清汤，可先沸水焯3–5分钟并冲净。；牛尾单层或尽量平铺放入内锅，加入低盐牛汤/水、姜和洋葱。
  - 锁盖，High Pressure 45分钟。
  - 程序结束后自然泄压10分钟，再按机器说明安全快速释放剩余压力。
  - 开盖后用叉子测试关节周围肉：应很软、接近能从骨上拉下；若仍明显紧韧，再High Pressure 5–10分钟。
  - 撇去表面明显浮油；若需要更清爽，可先把牛尾取出再撇油。
  - 切Sauté把汤重新煮开2–3分钟，最后从1 tsp盐开始分次调味；不在压力前重盐。
  - 孩子份把肉从骨上完全拆下，检查碎骨和硬筋后剪小。
  - 完成提示：牛尾肉非常软、接近脱骨；汤体清爽，油脂已撇去大部分。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛尾：900 g
  - 低盐牛汤/水：约3 cups，且不得超过9-qt Instant Pot max fill线
  - 姜：4片
  - 洋葱：1/3个，粗切，可省
  - 最后调味：盐 1 tsp起，压力后分次加；白胡椒 1小撮，可省

steps:
  - 先读包装，确认是否要求解冻以及推荐加热方式；包装步骤优先。
  - 若允许平底锅路线，不粘锅中火预热并薄刷油，肉饼单层放入；按包装提示翻面。
  - 表面已经上色而中心温度仍低时，转中小火并加盖，避免继续硬煎外层。
  - 从最厚中心测温达到160°F/71°C；不要靠颜色判断绞牛肉熟度。
  - 离火静置2分钟；孩子份切小，选仍湿润柔软的中心。
child_serving: 取完全熟且仍湿润柔软的中心切小；本 Recipe 计入 Child Protein。
adult_finish: 可另加黑胡椒、番茄酱或芥末。
substitutions: []
cook_ingredients:
  - 冷冻牛肉饼：3块；具体重量、是否解冻和时间以包装为准
  - 中性油：1 tsp，仅在包装允许平底锅路线时使用

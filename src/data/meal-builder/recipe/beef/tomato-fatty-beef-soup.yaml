steps:
  - 番茄切块；Instant Pot Sauté 加1 tsp油把番茄炒3–5分钟至出汁，盛出备用。
  - 锅中加入清汤底中的1 cup水或低盐高汤、姜和葱，放入火锅牛肉片并轻轻拨散；锁盖 High Pressure 1分钟，立即快速泄压。
  - 检查牛肉片无冷生中心；未熟的片用 Sauté 短煮并逐片复查。
  - 加入炒过的番茄和预留清汤，用 Sauté 小火煮至汤味融合；最后分次加盐和白胡椒，不让薄牛肉久滚。
  - 孩子份牛肉剪短，番茄压小。
  - 完成提示：番茄汤味融合但仍清爽；牛肉片熟嫩、不因久滚卷紧发柴。
  - 安全提示：牛肉片无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 番茄：300–450 g
  - 清汤底：水或低盐高汤 2.0 L；压力阶段先用1 cup；姜 5片；葱白 2段；盐 1–1.5 tsp最后分次加；白胡椒1小撮可省

steps:
  - 准备：牛小排冷水浸20–30分钟换水一次以去血水，冲净骨屑。；萝卜胡萝卜切大块，边角略削圆可减少久炖碎裂。
  - 牛小排冷水下锅煮开3分钟，捞出冲净；换干净锅。
  - 加入牛小排和煮汁，煮开后转小火盖盖炖45–60分钟，直到肉开始软。
  - 加入萝卜和胡萝卜，继续小火20–30分钟。
  - 肉达到软嫩、蔬菜筷子可穿透后开盖中火减少汤汁。
  - 汁量减少到约原来的1/3、能薄挂肉但仍可舀时关火；撇掉明显浮油。
  - 孩子份去骨、去硬筋，配软萝卜胡萝卜。
  - 完成提示：牛肉接近脱骨、蔬菜软而完整；汁浓但仍可流动。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 横切牛小排：900 g
  - 白萝卜：350 g，切大块
  - 胡萝卜：250 g，切大块
  - Galbijjim 煮汁：生抽 1/3 cup；水或低盐高汤 3 cups；梨/苹果泥 1/2 cup；糖 2 Tbsp；蒜末 1 Tbsp；姜末 1 tsp；芝麻油 1 tsp

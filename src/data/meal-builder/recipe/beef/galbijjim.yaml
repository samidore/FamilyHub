steps:
  - 牛小排冷水浸20–30分钟换水一次，冲净骨屑；萝卜和胡萝卜切大块、边角略削圆。
  - 牛小排冷水下锅煮3分钟后冲净；Instant Pot 加入牛小排、生抽1/3 cup、水或低盐高汤1.5 cups、梨/苹果泥、糖、蒜、姜和芝麻油。
  - 锁盖 High Pressure 35分钟，自然泄压15分钟。检查肉开始软化并仍能成形；不够软时再加压5分钟并自然泄压10分钟。
  - 取出牛小排暂放；将萝卜、胡萝卜和约1 cup压力汁放回内锅，High Pressure 2分钟后快速泄压。
  - 放回排骨，用 Instant Pot Sauté 减少汁液至薄挂肉但仍可舀；撇掉明显浮油。孩子份去骨、去硬筋，配软蔬菜。
  - 完成提示：牛肉接近脱骨，蔬菜软而完整；汁浓但仍可流动。
  - 安全提示：牛肉达到安全温度；带骨肉成人去骨并检查碎骨。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 横切牛小排：900 g
  - 白萝卜：350 g，切大块
  - 胡萝卜：250 g，切大块
  - 压力煮汁：生抽 1/3 cup；水或低盐高汤 1.5 cups；梨/苹果泥 1/2 cup；糖 2 Tbsp；蒜末 1 Tbsp；姜末 1 tsp；芝麻油 1 tsp；泄压后再按需补少量压力汁

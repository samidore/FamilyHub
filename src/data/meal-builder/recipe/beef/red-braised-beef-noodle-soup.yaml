steps:
  - 整块牛腩或牛肩肉切4–5 cm大块；若骨渣/血沫明显先焯2–3分钟并冲净。
  - Instant Pot Sauté 加1 tsp油，将肉块分批煎至浅褐后取出；炒糖至浅琥珀色，加入姜葱。
  - 加入绍兴酒、生抽、老抽和水或低盐高汤3 cups，刮净锅底；放回牛肉，锁盖 High Pressure 55分钟，自然泄压20分钟。检查筷子能较轻松插入；不够软时再加压8分钟、自然泄压10分钟。
  - 取出牛肉；用 Instant Pot Sauté 将卤汁减至薄亮挂肉但仍可流动。静置5分钟再盛。
  - 另锅把面条煮到刚熟；取约1份红烧卤汁兑2–3份低盐高汤/热水煮开尝味，将牛肉和清爽汤浇在面上。
  - 孩子份选瘦嫩无骨部分剪小。
  - 完成提示：牛肉软嫩；汤是可直接喝的咸度，面条刚熟，不把浓卤汁原液当汤。
  - 安全提示：整块牛肉达到至少145°F/63°C并静置3分钟。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整块牛腩或牛肩肉大块：900 g
  - 面条：450 g鲜/熟面或3人份干面，另锅煮
  - 压力红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；水或低盐高汤 3 cups；姜 6片；葱白 3段；八角1个、桂皮1小段可省；另用油1 tsp煎肉
  - 上桌汤底：低盐高汤/热水 3–4 cups，用红烧卤汁兑开

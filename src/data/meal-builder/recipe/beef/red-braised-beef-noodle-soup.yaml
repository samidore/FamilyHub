steps:
  - 准备：整块牛腩或牛肩肉切约4–5 cm大块；带骨件冲洗后沥干。若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净。；把液体调料量好放在手边；糖单独放，避免炒糖时手忙脚乱。
  - 厚底锅中火加1 tsp油；肉块分批把2–3个面煎到浅褐色，避免一次堆满出水。盛出。
  - 原锅转中小火，下糖；糖刚融化成浅琥珀色时立刻加入姜葱，再把肉回锅翻匀。不要把糖烧到深褐发苦。
  - 加入绍兴酒、生抽、老抽和水/高汤；液面应接近但不必完全淹没肉。煮开后撇沫，转小火盖盖。
  - 保持轻微咕嘟而不是猛烈沸腾，先以90–120分钟作为检查窗口；最终以筷子能较轻松插入、猪蹄则皮筋软糯为准。中途液体低于锅底1/3时补热水。
  - 肉已软嫩后开盖转中火；每2–3分钟翻一次，防止糖汁粘底。
  - 当汁量约剩最初的1/4、从水状变成能在肉表面形成薄亮膜，锅底仍有少量可流动汁时关火；不要收到发黏发咸。
  - 静置5分钟再盛；孩子份选瘦嫩、无骨部分剪小。
  - 另锅把面条煮到刚熟后分碗；不要直接在浓红烧汁中煮面。
  - 取约1份红烧卤汁兑2–3份低盐高汤/热水，煮开后尝味；把牛肉和汤浇在面上。
  - 完成提示：牛肉软嫩；汤是可直接喝的咸度，面条刚熟，不把浓卤汁原液当汤。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整块牛腩或牛肩肉大块：900 g
  - 面条：450 g 鲜/熟面或3人份干面
  - 家庭红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；水或低盐高汤 3 cups；姜 6片；葱白 3段；八角 1个，可省；桂皮 1小段，可省
  - 上桌汤底：低盐高汤/热水 3–4 cups，用红烧卤汁兑开；面条 3人份，另煮

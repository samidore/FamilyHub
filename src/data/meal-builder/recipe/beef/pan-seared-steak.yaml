    role: seasoning
    availability: assumed
steps:
  - 擦干并按菜式处理 beef-steak；准备 salt-light sear; butter/aromatics optional adult
    finish。
  - 锅中只用薄层油，分批煎/煎封，避免锅温因一次装太满而明显下降。
  - 主料达到合适熟度后离火或转小火；需要酱汁时在最后短时间挂汁。
  - 静置或稍降温后再为孩子剪小；不要把成人后加辣味放进基础锅。
child_serving: 若提供则逆纹切很小；Meal Combo 另配软蛋白。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.
substitutions:
  - flat-iron-steak
  - denver-steak
  - beef-steak
  - other compatible steak cuts already represented in Ingredient Library

steps:
  - 选中的牛肉切约4–5 cm大块；牛肋条较细时切成适合夹取的段。若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净并沥干。
  - 肉块放入 Instant Pot，加基础焖煮液；高压35–45分钟，按切块厚度自然泄压10–15分钟。打开后确认筷子或叉子能轻松穿入并分开；仍硬时再高压8–10分钟。
  - 将肉和少量汤汁转入宽锅；若选择了顺手焖配料，按硬度加入，先放土豆、芋头等硬料，后放豆制品和叶菜，焖到软而不散。
  - 按所选 Finish 选项完成晚段调味与收汁；锅底保留少量可流动汁。
  - 孩子份只取真正软烂、无硬筋的肉，剪小并少带汁。
  - 完成提示：肉块软嫩仍成形；汁薄挂肉而不黏硬。
  - 安全提示：整块牛肉至少达到安全熟度；本菜为了软烂会远高于最低安全温度。
child_serving: 取炖到可轻松分开的软肉，去硬筋并剪小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 牛腩 / 牛肩肉 / 牛肋条 / 无骨牛小排：900 g；任选一种
  - 基础焖煮液：水或低盐高汤 2 cups；姜 6片；葱白 3段
finish_options:
  - id: red-braise
    label_zh: 红烧
    default: true
    cook_ingredients:
      - 绍兴酒 1/4 cup；生抽 3 Tbsp；蚝油 1 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；八角 1个可省；桂皮 1小段可省；压力汤汁 1/2 cup
    steps:
      - 牛肉已在共享压力基底中软嫩。将绍兴酒、生抽、蚝油、老抽、糖、可选香料和少量压力汤汁加入宽锅，中大火翻动收至薄亮汁；锅底保留少量可流动汁。
  - id: thirteen-spice
    label_zh: 十三香
    default: false
    display_name_zh: 十三香牛肉
    cook_ingredients:
      - 十三香 1 tsp；生抽 1 Tbsp；糖 1 tsp；压力汤汁 1/2 cup
    steps:
      - 牛肉已在共享压力基底中软嫩。将十三香、生抽、糖和压力汤汁加入宽锅，翻动至香料融合、薄薄挂汁。
  - id: adobo
    label_zh: 醋香
    default: false
    display_name_zh: 醋香牛肉
    cook_ingredients:
      - 米醋 1/4 cup；生抽 1 Tbsp；月桂叶 2片；黑胡椒粒 1 tsp；蒜 3瓣；压力汤汁 1/4 cup
    steps:
      - 牛肉已在共享压力基底中软嫩。将米醋、生抽、月桂叶、黑胡椒、蒜和压力汤汁加入宽锅，轻煮3–5分钟使酸香柔和，再薄薄收汁。
  - id: black-pepper
    label_zh: 黑椒
    default: false
    display_name_zh: 黑椒牛肉
    cook_ingredients:
      - 粗磨黑胡椒 1 tsp；蚝油 1 tsp；生抽 1 Tbsp；高汤 1/2 cup；玉米淀粉 1 tsp 加水调匀
    steps:
      - 牛肉已在共享压力基底中软嫩。将粗磨黑胡椒、蚝油、生抽和高汤加入宽锅轻煮；淀粉水少量加入至汁薄薄挂肉，不收干。

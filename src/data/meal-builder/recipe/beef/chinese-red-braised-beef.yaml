steps:
  - 选中的牛肉切约4–5 cm大块；牛肋条较细时切成适合夹取的段。若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净并沥干。
  - 肉块放入 Instant Pot，加基础焖煮液；高压35–45分钟，按切块厚度自然泄压10–15分钟。打开后确认筷子或叉子能轻松穿入并分开；仍硬时再高压8–10分钟。
  - 将肉和少量汤汁转入宽锅；若选择了顺手焖配料，按硬度加入，先放土豆、芋头等硬料，后放豆制品和叶菜，焖到软而不散。
  - 加入家庭红烧汁，中大火翻动收汁；当汁量约剩最初1/4、能形成薄亮膜且锅底仍有少量流动汁时关火。
  - 孩子份只取真正软烂、无硬筋的肉，剪小并少带汁。
  - 完成提示：肉块软嫩仍成形；汁薄挂肉而不黏硬。
  - 安全提示：整块牛肉至少达到安全熟度；本菜为了软烂会远高于最低安全温度。
child_serving: 取炖到可轻松分开的软肉，去硬筋并剪小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 牛腩 / 牛肩肉 / 牛肋条 / 无骨牛小排：900 g；任选一种
  - 基础焖煮液：水或低盐高汤 2 cups；姜 6片；葱白 3段
  - 家庭红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；八角 1个可省；桂皮 1小段可省

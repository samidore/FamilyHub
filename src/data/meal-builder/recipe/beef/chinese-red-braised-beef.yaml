steps:
  - 选中的牛肉切约4–5 cm大块；牛肋条较细时切成适合夹取的段。若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净并沥干。
  - 厚底锅中火加1 tsp油；肉块分批把2–3个面煎到浅褐色，避免一次堆满出水，盛出。
  - 原锅转中小火，下糖；糖刚融化成浅琥珀色时加入姜葱，再把肉回锅翻匀。
  - 加绍兴酒、生抽、老抽和水/低盐高汤；液面接近肉面即可。煮开撇沫，转小火盖盖。
  - 保持轻微咕嘟，90分钟开始检查；不同切块继续炖到筷子或叉子能轻松穿入和分开。液体过低时只补热水。
  - 肉已软嫩后开盖转中火；每2–3分钟翻一次。当汁量约剩最初1/4、能形成薄亮膜且锅底仍有少量流动汁时关火。
  - 孩子份只取真正软烂、无硬筋的肉，剪小并少带汁。
  - 完成提示：肉块软嫩仍成形；汁薄挂肉而不黏硬。
  - 安全提示：整块牛肉至少达到安全熟度；本菜为了软烂会远高于最低安全温度。
child_serving: 取炖到可轻松分开的软肉，去硬筋并剪小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: []
cook_ingredients:
  - 牛腩 / 牛肩肉 / 牛肋条 / 无骨牛小排：900 g；任选一种
  - 家庭红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；水或低盐高汤 3 cups；姜 6片；葱白 3段；八角 1个可省；桂皮 1小段可省

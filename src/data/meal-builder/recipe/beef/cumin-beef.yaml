steps:
  - 准备：牛肉逆纹切2–3 mm薄片；加入腌料抓匀，静置10–15分钟。；蔬菜切到快炒大小；西兰花/芥兰粗梗若较硬，可先沸水焯30–60秒后彻底沥干。；把炒汁搅到没有淀粉结块；下锅前再次搅匀。
  - 炒锅大火预热，加1 Tbsp中性油；牛肉摊成单层，30秒内不要频繁翻动。
  - 快速翻炒至表面变色、中心仍略嫩，约七成熟时立即盛出，避免第一轮就炒老。
  - 原锅下姜5 g、蒜2瓣炒10–15秒；加入无额外配菜，大火翻炒至刚断生。
  - 牛肉回锅；炒汁重新搅匀后倒入，持续翻炒30–60秒。
  - 炒汁刚变薄稠时加入孜然粉和炒香孜然籽，再翻20秒；不要把辣椒放入基础锅。
  - 盛出后让肉静置约3分钟；孩子份选较嫩薄片并剪小。
  - 完成提示：牛肉表面完整上色但仍嫩；蔬菜保持形状；酱汁只薄薄挂料，不成厚芡。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛腩片：340 g
  - 牛肉腌料：水 1 Tbsp；玉米淀粉 1 tsp；中性油 1 tsp；蚝油 2 tsp
  - 家庭轻盐蚝油汁：低盐高汤或水 1/3 cup；生抽 2 tsp；蚝油 2 tsp；老抽 1/2 tsp；糖 1/2 tsp；白胡椒 1小撮；玉米淀粉 1.5 tsp
  - 孜然收尾：孜然粉 1 Tbsp；孜然籽 1 tsp，干锅炒香

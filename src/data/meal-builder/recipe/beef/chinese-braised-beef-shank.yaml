steps:
  - 牛腱保持整块或切成2大段；冷水焯3–5分钟并冲净。Instant Pot Sauté 加1 tsp油，将肉分批煎至浅褐后取出。
  - 加入糖并炒至浅琥珀色，放入姜葱；加入绍兴酒、生抽、老抽及水/低盐高汤3 cups，彻底刮净锅底。
  - 放回牛腱，锁盖 High Pressure 55分钟，自然泄压20分钟。检查竹签能穿入但牛腱仍紧实成形；不够软时再加压8分钟并自然泄压10分钟。
  - 取出牛腱；用 Instant Pot Sauté 将卤汁减少到能薄亮挂肉、仍可流动。牛腱在卤汁中降温30分钟，再冷藏彻底变冷后逆纹薄切。
  - 孩子份沿用原 child coverage；薄片炒菜实际炒至无冷生中心。
  - 完成提示：牛腱熟透、冷却后能薄切不散；卤汁有味但不收成糖浆。
  - 安全提示：整块牛肉达到至少145°F/63°C并静置3分钟。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛腱：900 g，保持整块或切2大段
  - 压力红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；水或低盐高汤 3 cups；姜 6片；葱白 3段；八角1个、桂皮1小段可省；另用油1 tsp煎肉

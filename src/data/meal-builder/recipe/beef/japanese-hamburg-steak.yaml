  - ingredient_id: ground-beef
    role: main-protein
steps:
  - 完整版本：洋葱用1 tsp油中火炒软后放凉；Panko与牛奶/水混合5分钟。只有牛绞肉时可全部省略，牛肉加盐后同方向搅到明显发黏再成饼。
  - 牛肉与可用的洋葱、Panko、鸡蛋和调味拌到有黏性，分3个肉饼，中间压浅凹。
  - 不粘锅中火加1 tsp油，肉饼下锅后第一面煎3–4分钟至褐色。
  - 翻面，加2 Tbsp水，盖盖中小火4–6分钟。
  - 最大肉饼中心达到160°F/71°C后盛出。
  - 原锅可倒入轻汁，刮起锅底焦香，煮30–60秒到薄挂勺；没有汁料则直接上桌。
  - 完成提示：肉饼中心160°F/71°C、内部仍湿润；孩子份切小。
child_serving: 取中心柔软部分切成小块；不需要另配软蛋白才能计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加黑胡椒或更重酱汁。
substitutions: []
cook_ingredients:
  - 牛绞肉：450 g
  - 洋葱：150 g，切细丁；推荐加入，可省略
  - 鸡蛋：1个；推荐 binder，可省略
  - Panko：1/3 cup；牛奶或水 3 Tbsp；推荐 binder，可省略
  - 肉饼调味：盐 3/4 tsp；黑胡椒 1/4 tsp；肉豆蔻 1/4 tsp，可省
  - 轻汁：番茄酱 2 Tbsp；伍斯特酱 1 Tbsp；水 3 Tbsp；糖 1/2 tsp，可省略

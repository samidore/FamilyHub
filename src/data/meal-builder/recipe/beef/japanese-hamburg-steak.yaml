id: japanese-hamburg-steak
type: recipe
status: candidate
name_zh: 日式汉堡排
name_en: Japanese Hambagu
tags: [light-seasoning, non-spicy-base, pan-seared, stovetop-nonstick, lunch-45, family-shared]
fit_score: 4
notes: |-
  Availability 只要求 ground beef。洋葱、鸡蛋和 panko 是推荐完整版本；缺少时仍可把充分搅出黏性的调味牛肉直接成饼煎熟。
primary_role: protein
main_protein_category: beef
main_protein_ingredient_ids: [ground-beef]
supporting_protein_ingredient_ids: []
vegetable_ingredient_ids: []
meal_contribution: { protein: 1, vegetable: 0, staple: 0 }
child_coverage: { protein: true, vegetable: false }
integral_staple_ingredient_ids: []
recommended_staple_ingredient_ids: [rice, bread]
active_minutes: 20–35
meal_window_minutes: 30–45
elapsed_minutes: 35–60
advance_start_required: false
equipment: [medium burner, nonstick pan or iron pan as appropriate]
burner_plan: Medium burner by default.
child_suitable: yes
child_texture: 绞肉饼盖盖焖熟可保持柔软；孩子份切成小块。
spicy_in_base: false
deep_fried: false

steps:
  - 准备：洋葱用1 tsp油中火炒软后放凉。Panko与牛奶/水混合5分钟。；牛肉、洋葱、Panko、鸡蛋和调味拌到刚有黏性，分3个肉饼，中间压浅凹。
  - 不粘锅中火加1 tsp油，肉饼下锅后第一面煎3–4分钟至褐色。
  - 翻面，加2 Tbsp水，盖盖中小火4–6分钟。
  - 最大肉饼中心达到160°F/71°C后先盛出。
  - 原锅倒入轻汁，刮起锅底焦香，煮30–60秒到薄挂勺。
  - 汁淋肉饼；孩子份切小并确认中心无生肉。
  - 完成提示：肉饼中心160°F/71°C、仍有肉汁；酱汁薄挂而不厚甜。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛绞肉：450 g
  - 洋葱：150 g，切细丁
  - 鸡蛋：1个
  - Panko：1/3 cup
  - 牛奶或水：3 Tbsp
  - 肉饼调味：盐 3/4 tsp；黑胡椒 1/4 tsp；肉豆蔻 1/4 tsp，可省
  - 轻汁：番茄酱 2 Tbsp；伍斯特酱 1 Tbsp；水 3 Tbsp；糖 1/2 tsp

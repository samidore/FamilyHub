steps:
  - 准备：土豆切4–5 cm块后用清水冲掉表面淀粉；胡萝卜与洋葱切块。；牛肉片解开成片。
  - 厚锅中火加1 Tbsp油，下洋葱炒到边缘透明；加入牛肉快速炒到大部分变色。
  - 加入土豆和胡萝卜翻1分钟，倒入全部煮汁。
  - 煮开撇沫，落盖/盖盖留缝，中小火煮15分钟。
  - 检查土豆：筷子能穿透但块形完整时即可；若仍硬再煮3–5分钟。
  - 开盖只把汁减少到能舀起、约剩锅底1–2 cm，不收干。
  - 关火静置10分钟后再上桌，味道会继续回吸。
  - 完成提示：土豆软而不碎、胡萝卜熟、牛肉不柴；保留甜咸煮汁。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：225 g
  - 土豆：550 g，切大块
  - 胡萝卜：125 g，滚刀块
  - 洋葱：250 g，粗切
  - 肉じゃが煮汁：日式高汤 2 cups；味醂 4 Tbsp；生抽 4 Tbsp；清酒 2 Tbsp；糖 1 Tbsp

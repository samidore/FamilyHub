steps:
  - 土豆切4–5 cm块并冲掉表面淀粉；胡萝卜与洋葱切块，牛肉片解开。
  - Instant Pot Sauté 加1 Tbsp油，将洋葱略炒软；加入火锅牛肉快速翻至大部分变色。加入约1 cup日式高汤并刮净锅底。
  - 锁盖 High Pressure 1分钟并立即快速泄压；取出牛肉与洋葱，暂放一旁。
  - 锅中加入土豆、胡萝卜、味醂、生抽、清酒、糖及剩余日式高汤；锁盖 High Pressure 3分钟并快速泄压。检查土豆可被筷子穿透但仍完整。
  - 将牛肉和洋葱放回，用 Instant Pot Sauté 小火加热1–2分钟至热透；保留可舀汁，不收干。关火静置10分钟。
  - 完成提示：土豆软而不碎、胡萝卜熟、牛肉不柴；保留甜咸煮汁。
  - 安全提示：牛肉片无冷生中心。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：225 g
  - 土豆：550 g，切大块
  - 胡萝卜：125 g，滚刀块
  - 洋葱：250 g，粗切
  - 压力煮汁：日式高汤 2 cups；味醂 4 Tbsp；生抽 4 Tbsp；清酒 2 Tbsp；糖 1 Tbsp

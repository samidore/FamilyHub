steps:
  - 准备：保持冷冻或按包装说明解冻；若包装已调味，不额外加盐。
  - 不粘锅中火预热，冷冻饼按包装是否需要油；一般只薄抹1 tsp油。
  - 单层下锅，第一面形成褐色焦面并能轻松铲起后翻面。
  - 转中小火继续煎；厚饼可盖盖1–2分钟帮助中心加热。
  - 中心达到160°F/71°C立即出锅。
  - 静置2分钟；孩子份切成小条/小块，原 recipe child coverage 保持不变。
  - 完成提示：两面上色、中心160°F/71°C，外层不焦黑。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 冷冻牛肉饼：3片
  - 基础调味：盐 按包装咸度，最多1/2 tsp总量；黑胡椒 1/4 tsp，可省

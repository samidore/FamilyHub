steps:
  - 准备：肉末提前从冰箱取出，只需解开大块，不需要腌；青菜切细/切小。；把炒汁全部混匀；若使用冷冻荠菜末，可直接从冷冻状态下锅，但先掰散。
  - 炒锅中大火预热，加2 tsp中性油；下姜末5 g炒10秒。
  - 下肉末，用锅铲压散成小粒，保持中大火炒到整体变色并开始出现少量褐色焦点。
  - 加入青菜；含水多的叶菜/冷冻荠菜先让水汽蒸出，炒到菜明显塌软但不发黄。
  - 沿锅边倒入炒汁，翻炒1–2分钟，让肉末和菜均匀吸味；若锅底水多，保持中大火让多余水汽蒸掉。
  - 锅底只留薄薄湿润汁、肉末松散不泡在水里时关火。
  - 完成提示：肉末完全变色并有少量焦香；蔬菜软而不烂；锅底无明显游离汤水。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛绞肉：300 g
  - 青菜：300–450 g
  - 家庭轻盐肉末炒汁：生抽 1 Tbsp；绍兴酒 1 Tbsp；蚝油 1 tsp；糖 1/2 tsp；水 2 Tbsp

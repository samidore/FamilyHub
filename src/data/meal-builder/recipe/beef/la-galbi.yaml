steps:
  - 准备：牛小排用冷水快速冲去骨屑，彻底擦干。；腌汁混匀；冷藏腌4–12小时，中途翻一次。
  - 煎前把肉取出，抖掉厚腌汁，避免糖在锅里先烧焦。
  - 铁锅/不粘锅中大火预热，薄薄抹油；牛小排单层放入。
  - 第一面出现焦色后翻面，第二面也煎上色；过早变黑时立刻降火。
  - 最厚肉处达到项目整块牛肉安全底线后离火，静置3分钟。
  - 锅中焦黑糖渣不要继续用于下一批，必要时擦锅再煎。
  - 孩子份剔除横切骨及骨边硬筋，只给无骨肉。
  - 完成提示：两面焦香但糖不焦黑；肉熟度达到安全底线；骨边肉仍有汁。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 横切牛小排：900 g
  - LA Galbi 腌汁：生抽 1/2 cup；水 1/2 cup；糖 3 Tbsp；梨或苹果泥 1/2 cup；蒜末 1 Tbsp；姜末 1 tsp；芝麻油 1 Tbsp；葱末 2 Tbsp

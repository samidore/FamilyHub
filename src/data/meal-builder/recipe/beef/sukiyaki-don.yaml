steps:
  - 准备：牛肉片解开；洋葱薄切；寿喜烧汁混匀。
  - 宽锅放寿喜烧汁和洋葱，中火煮开后转中小火2–3分钟，让洋葱开始变软。
  - 牛肉片逐片加入并拨散，避免叠成团。
  - 保持小沸2–4分钟，轻翻一次；撇去明显浮沫。
  - 牛肉无冷生中心后立即停火，锅内应保留可舀汁，不收浓。
  - 分到3碗热饭上；每碗带2–3 Tbsp汁湿润米饭。
  - 孩子份剪短牛肉片。
  - 完成提示：洋葱软甜、牛肉刚熟；寿喜烧汁仍可流动、足以湿润米饭。
  - 安全提示：整块牛肉可测处达到145°F/63°C并静置3分钟；薄片炒菜实际炒至无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 洋葱：200 g，薄切
  - 米饭：3碗熟饭
  - 寿喜烧汁：生抽 3 Tbsp；味醂 3 Tbsp；清酒 2 Tbsp；糖 1.5 Tbsp；水或日式高汤 1/2 cup

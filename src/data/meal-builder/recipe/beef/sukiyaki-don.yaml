steps:
  - 牛肉片解开；洋葱薄切；寿喜烧汁混匀。
  - Instant Pot 加入洋葱、寿喜烧汁和火锅牛肉片并拨散；锁盖 High Pressure 1分钟，完成后立即快速泄压。
  - 检查牛肉无冷生中心；未熟时用 Instant Pot Sauté 短煮并逐片复查。锅中保留可舀汁，不收浓。
  - 分到3碗热饭上，每碗带2–3 Tbsp汁湿润米饭；孩子份剪短牛肉片。
  - 完成提示：洋葱软甜、牛肉熟嫩；寿喜烧汁仍可流动、足以湿润米饭。
  - 安全提示：牛肉片无冷生中心。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 洋葱：200 g，薄切
  - 米饭：3碗熟饭，另行烹好
  - 压力寿喜烧汁：生抽3 Tbsp；味醂3 Tbsp；清酒2 Tbsp；糖1.5 Tbsp；水或日式高汤1/2 cup

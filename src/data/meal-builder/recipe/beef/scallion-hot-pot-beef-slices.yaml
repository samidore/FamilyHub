steps:
  - 牛肉片解冻到能逐片分开但仍偏冷；太长的片剪半。加入水1 Tbsp、玉米淀粉1 tsp、中性油1 tsp和蚝油2 tsp抓匀，静置10分钟。
  - 把低盐蚝油汁预先混匀；葱切段，葱白和葱绿分开。
  - 炒锅大火预热，加1 Tbsp油；牛肉摊成单层，约30秒内不要频繁翻动。
  - 快速翻炒至表面变色、约七成熟时立即盛出。
  - 原锅下葱白10–15秒；牛肉回锅，倒入重新搅匀的炒汁，持续翻炒到无生红且汁薄薄挂肉，立即关火。
  - 撒葱绿装盘；不要留在热锅中继续变韧。
child_serving: 本 Recipe 不计 Child Protein；另配软蛋白。
adult_finish: 可另加黑胡椒、孜然或辣椒。
substitutions: []
cook_ingredients:
  - 火锅牛肉片：340 g
  - 腌料：水 1 Tbsp；玉米淀粉 1 tsp；中性油 1 tsp；蚝油 2 tsp
  - 家庭轻盐蚝油汁：低盐高汤或水 1/3 cup；生抽 2 tsp；蚝油 2 tsp；老抽 1/2 tsp；糖 1/2 tsp；白胡椒 1小撮；玉米淀粉 1.5 tsp
  - 葱：3根，切段

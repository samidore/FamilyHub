steps:
  - 准备：米按家庭正常米水比入锅开始煮；牛肉与腌料抓匀15分钟。；鸡蛋备用。
  - 米饭煮到表面水基本被吸收、米粒已膨胀但尚未完全熟时打开盖。
  - 把牛肉薄薄铺在米饭表面，不堆厚；立即盖回，中小火/正常煮饭程序继续。
  - 约5分钟后打开，在两侧打入鸡蛋；立即盖回继续蒸。
  - 牛肉无冷生中心、鸡蛋完全凝固且米饭熟透后关火。
  - 焖5分钟，再从底部轻翻；孩子份牛肉剪短。
  - 完成提示：米饭熟透无硬芯；牛肉熟而不柴；鸡蛋完全凝固。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 牛肉片：300 g，切薄片
  - 米：1.5 cups
  - 鸡蛋：2个
  - 牛肉腌料：生抽 1 Tbsp；蚝油 1 tsp；绍兴酒 1 Tbsp；玉米淀粉 1 tsp；水 1 Tbsp

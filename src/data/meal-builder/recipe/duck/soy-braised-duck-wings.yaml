  - ingredient_id: duck-wings
    role: main-protein
cook_ingredients:
  - 鸭翅：约900–1100 g
  - 压力卤汁：水 1.5 cups；姜 4片；葱 2根；生抽 2 Tbsp；老抽 1 tsp；绍兴酒 1 Tbsp；冰糖或白糖 1 tsp
steps:
  - 鸭翅冷水下锅煮开2–3分钟，捞出冲净浮沫并沥干。
  - Instant Pot 加入鸭翅、姜、葱、生抽、老抽、绍兴酒、糖和水1.5 cups；锁盖 High Pressure 12分钟，自然泄压10分钟后快速泄压。
  - 检查关节附近最厚处；鸭肉应软且能从骨边松开。若仍紧实，再 High Pressure 4分钟并自然泄压8分钟。
  - 取出鸭翅；用 Instant Pot Sauté 将卤汁收至能薄薄挂在表面但不发咸，再放回轻轻翻裹。
  - 孩子份先盛出，成人彻底拆骨、去硬软骨并检查碎骨后再剪小。
  - 完成提示：鸭翅酱色均匀、肉软而不散，锅底仍留少量可流动酱汁。
child_serving: 彻底去骨并检查碎骨和硬软骨，只给软肉；少带浓汁。
adult_finish: 孩子份盛出后，成人可另加辣椒油或辣椒粉。
substitutions: []

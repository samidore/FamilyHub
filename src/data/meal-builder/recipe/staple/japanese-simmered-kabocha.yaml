steps:
  - 准备：南瓜保留皮帮助定型；去籽后切大小尽量一致，尖角可略修圆减少煮碎。；煮汁混匀。
  - 南瓜皮朝下单层排入较小锅中，倒入煮汁；液体不需要完全淹没。
  - 盖落盖/锅盖留缝，中火煮开后转小火。
  - 保持轻微咕嘟10分钟后开始用竹签从肉侧检查；能轻松插入即熟。
  - 关火让南瓜在煮汁中静置10分钟吸味；不要继续大火收干。
  - 盛出时从底部托起，避免把熟南瓜夹碎。
  - 完成提示：南瓜肉软、竹签易穿透，块形仍完整；锅底保留少量清亮煮汁。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 南瓜（Kabocha）：600 g去籽后，切4–5 cm块
  - 日式南瓜煮汁：日式高汤或水 1 cup；糖 1 Tbsp；味醂 1 Tbsp；生抽 1 Tbsp

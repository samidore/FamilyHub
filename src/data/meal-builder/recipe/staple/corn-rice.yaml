steps:
  - 准备：米淘洗后沥干5分钟；玉米切下玉米粒。；按家庭米种计量正常煮饭水量。
  - 米、正常米水量、盐、清酒、生抽加入锅中轻轻拌匀。
  - 玉米粒铺在米上，不再搅动；炉灶版煮开后立刻最小火盖盖。
  - 煮到米饭熟透、表面无水后关火，焖10分钟。
  - 开盖加入黄油（可省），从底部翻松，让玉米均匀分布。
  - 孩子份先确认玉米粒软熟。
  - 完成提示：米粒熟透不湿烂；玉米软甜；锅底无游离水。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1.5 cups
  - 玉米粒：约1.5 cups，来自1–2根玉米
  - 玉米饭调味：盐 1/2 tsp；清酒 1 Tbsp；生抽 1 tsp；无盐黄油 1 Tbsp，可选出锅拌

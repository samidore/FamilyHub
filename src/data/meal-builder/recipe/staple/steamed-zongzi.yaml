steps:
  - 蒸制设备加水并放好蒸架；把本餐需要的粽子放在蒸架上。
  - 使用 Instant Pot 时按家中惯用蒸法操作；未确认的压力和泄压参数不在此处补写。
  - 开始出蒸汽后计时15分钟。
  - 结束后取出一个，确认中心热透；若中心仍冷，继续蒸至热透。
  - 拆线和粽叶后再上桌，避免误食包材。
  - 完成提示：粽子中心热透，没有冷芯。

steps:
  - 芋头或土豆500 g去皮，切约2.5 cm均匀块；芋头处理时避免皮肤刺激，土豆切后用清水冲掉表面多余淀粉。
  - 锅中加入主料、水1 cup、盐1/2 tsp和蚝油1 Tbsp，煮开后转中小火盖盖。
  - 10分钟开始检查；中心仍硬则每3分钟继续检查并防止水烧干。
  - 筷子能轻松穿透但块仍完整时开盖，中火让水分减少。
  - 锅底只剩2–3 Tbsp薄汁时关火，拌入现成葱油1 Tbsp和少量白胡椒。
  - 完成提示：无硬芯、块形基本完整；葱油只薄薄附着。
child_serving: 作为主食使用；确认无硬芯并按需要压小。
adult_finish: 可另加白胡椒、辣椒油或更多葱油。
substitutions: []
cook_ingredients:
  - 芋头或土豆：500 g；任选一种
  - 水 1 cup；盐 1/2 tsp；蚝油 1 Tbsp；白胡椒少量；现成葱油 1 Tbsp

steps:
  - 准备：芋头去皮后切均匀块，处理时避免皮肤刺激；冲洗表面黏液并沥干。；葱油最后加入，不需要另炸葱。
  - 锅中加入芋头、水、盐和蚝油，煮开后转中小火盖盖。
  - 煮10分钟后开始检查；芋头中心仍硬则每3分钟继续检查。
  - 筷子能轻松穿透但块仍完整时开盖，中火让水分减少。
  - 锅底只剩2–3 Tbsp薄汁时关火，拌入1 Tbsp现成葱油和白胡椒。
  - 孩子份确认芋头完全软、无硬芯并降温。
  - 完成提示：芋头粉糯无硬芯、块形基本完整；葱油只薄薄附着，不油腻。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 芋头：500 g，切2.5 cm块
  - 葱油芋头汁：水 1 cup；盐 1/2 tsp；蚝油 1 Tbsp；白胡椒 1小撮；现成葱油 1 Tbsp

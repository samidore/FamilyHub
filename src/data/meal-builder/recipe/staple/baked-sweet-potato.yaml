steps:
  - 准备：红薯刷洗干净并彻底擦干；不削皮、不包紧铝箔。；烤箱预热325°F/165°C，烤架中层。
  - 红薯直接放烤架或铺纸烤盘，彼此留空。
  - 低温慢烤；45分钟后开始按大小检查，粗大的需要更久。
  - 用竹签/细刀从最厚处插入：几乎无阻力、外皮略皱并有少量糖汁渗出即熟。
  - 若中心仍硬，每次继续烤10–15分钟再检查。
  - 出炉静置5–10分钟再剥皮；孩子份取内部软肉并确认不过烫。
  - 完成提示：最厚处完全软、插签几乎无阻力；内部湿润甜软，无硬芯。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 红薯：3个中等，共约600–750 g

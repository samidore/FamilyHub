steps:
  - 处理 核心主食/蛋白，准备 whole sweet potato; no added seasoning required；需要腌制的菜提前完成。
  - 烤箱预热；食材单层放置，使用少量油或烘焙纸/烤架降低粘连。
  - 按引用来源的厚度与熟度逻辑烤制；家庭实际切法不同则以熟度为准。
  - 出炉后静置/拆骨/切小；成人酱汁或辣味在孩子份盛出后再加。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。

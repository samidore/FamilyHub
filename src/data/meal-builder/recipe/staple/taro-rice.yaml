steps:
  - 准备：米淘洗沥干；芋头、胡萝卜切小丁；香肠薄切。；按家庭米种准备正常米水量，配菜出水不多时无需大幅扣水。
  - 宽锅中火加1 tsp油，香肠先炒30秒出香；加香菇、胡萝卜和芋头再炒2分钟。
  - 加入生抽、蚝油、绍兴酒和糖翻匀，关火。
  - 米和正常水量入煮饭锅，把炒好的配料连同锅中少量汁铺在米上。
  - 正常煮饭；熟后关火焖10分钟。
  - 开盖从底部轻翻，确认芋头完全软、米无硬芯；白胡椒最后少量加入。
  - 孩子份减少香肠比例，芋头和米作为主食。
  - 完成提示：米饭熟透、芋头粉糯无硬芯；配料均匀但米不油腻湿烂。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1.5 cups
  - 芋头：350 g，切2 cm丁
  - 中式香肠：1根，约80–100 g，薄切
  - 鲜香菇：120 g，切片
  - 胡萝卜：100 g，切丁
  - 焖饭调味：生抽 1 Tbsp；蚝油 1 Tbsp；绍兴酒 1 Tbsp；糖 1/2 tsp；白胡椒 1小撮

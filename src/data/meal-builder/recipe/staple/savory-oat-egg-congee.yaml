steps:
  - 准备：鸡蛋打散；燕麦按原味rolled oats设计，若是quick/steel-cut需按包装时间调整而不是套用同一分钟。
  - 锅中加入3 cups水/高汤煮开，加入1 cup燕麦，转中小火。
  - rolled oats小火煮5–8分钟并持续搅底，直到燕麦完全吸水变软。
  - 火调到小沸，蛋液细线状倒入；停10秒后轻轻搅开。
  - 继续煮到蛋完全凝固，加入1/4 tsp盐。
  - 关火静置2分钟；太稠可补热水1–2 Tbsp，孩子份降温后上桌。
  - 完成提示：燕麦软熟无硬芯、蛋完全凝固；粥稠但能舀流。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 燕麦：1 cup
  - 鸡蛋：2个
  - 咸燕麦粥底：水或低盐高汤 3 cups；盐 1/4 tsp；葱花 1 Tbsp，可选

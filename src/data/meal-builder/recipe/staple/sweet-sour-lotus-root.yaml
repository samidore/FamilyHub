steps:
  - 莲藕约400 g去皮切2–3 mm薄片，立即泡清水并换水冲掉表面淀粉。
  - 锅中水煮开，下藕片焯到约八九成熟，约1–2分钟；捞出沥干。
  - 调糖醋汁：糖15 g、黑醋或米醋15 ml、生抽10 ml、盐2 g、清水20 ml；另调1 tsp玉米淀粉加1 Tbsp水。
  - 炒锅大火加2 tsp油和蒜末10秒，下藕片快速翻30秒。
  - 倒入糖醋汁翻匀；汁沸后细线加入淀粉水，继续翻到汁薄薄挂藕片即关火。
child_serving: 本 Recipe 不承担 Child Protein/Vegetable；若孩子吃，按实际咀嚼能力切小并单独判断。
adult_finish: 可另加葱花、辣椒或更多醋。

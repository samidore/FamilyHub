steps:
  - 面包6片两面薄薄抹软化黄油，共约1.5 Tbsp。
  - 平底锅中火预热，面包单层放入；一面出现浅金色后翻面。
  - 第二面也浅金色、中心仍柔软时立即取出；孩子份可更早取出，不追求干脆边缘。
  - 稍凉后孩子份切成长条或小块。
child_serving: 保留内部柔软，不烤硬，按需要切条/小块。
adult_finish: 可另加果酱、蜂蜜或蒜香黄油；不进入基础版。
substitutions: []
cook_ingredients:

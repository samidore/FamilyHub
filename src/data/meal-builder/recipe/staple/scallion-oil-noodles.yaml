steps:
  - 准备：葱油汁在大碗底完全混匀；家庭已有现成罐装葱油，不从头炸葱。；烧足量面水。
  - 面条下滚水后立刻拨散；按包装煮到刚熟、仍有咬劲。
  - 先舀2 Tbsp面汤进葱油汁搅匀，再把面彻底沥干。
  - 热面直接进大碗，快速拌30–60秒，让每根面均匀着色并裹油。
  - 尝一根：若太干可补1 Tbsp面汤；不要通过继续加生抽解决干。
  - 孩子份先盛出并剪短；成人可加额外葱油/辣椒。
  - 完成提示：面条均匀裹薄薄葱油汁、根根分开，不在碗底积一滩酱油。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 面条：450 g鲜面或3人份干面
  - 家庭葱油汁：现成罐装葱油 2 Tbsp；生抽 1.5 Tbsp；老抽 1/2 tsp，可省；糖 1 tsp；热面汤 2 Tbsp

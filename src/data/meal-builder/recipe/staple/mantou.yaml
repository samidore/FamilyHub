steps:
  - 准备：若冷冻馒头无需完全解冻；准备蒸锅和蒸布/烘焙纸。
  - 蒸锅加足水烧开；馒头之间留至少2 cm空隙放在蒸屉。
  - 冷藏馒头上锅后中火蒸约6–8分钟；冷冻馒头约10–12分钟起检查。
  - 掰开一个确认中心完全热透、没有冷硬芯；不足再蒸2分钟。
  - 关火后等1分钟再开盖，减少骤冷导致表皮回缩。
  - 孩子份撕成小块并降温后上桌。
  - 完成提示：中心完全热透、组织柔软有弹性，无冷硬芯或湿黏表面。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

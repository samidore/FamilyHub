steps:
  - 准备：米淘洗沥干；南瓜切均匀小块。；使用厚底锅，避免粥底长时间直接受强火。
  - 米和5 cups水大火煮开，立刻转最小火，盖盖留缝。
  - 保持轻微冒泡20分钟，每5–10分钟从锅底搅一次防粘。
  - 加入南瓜块，继续小火15–25分钟；南瓜变软后可用勺背压碎约1/3，让粥自然变稠。
  - 米粒完全开花、南瓜无硬芯后关火；若太稠只补热水，不补冷水。
  - 静置5分钟后判断最终稠度；孩子份可再压细并降温。
  - 完成提示：米粒完全开花、南瓜软烂无硬芯；粥能缓慢流动而非成干饭。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1/2 cup 生米
  - 南瓜（Kabocha）：450 g，去籽去硬皮后切2 cm块
  - 粥底：水 5 cups；盐 0–1/4 tsp，最后可不加

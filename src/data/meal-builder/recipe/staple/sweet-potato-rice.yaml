steps:
  - 准备：米淘洗沥干；红薯刷净，可留皮，切块后快速冲洗表面淀粉。；按家庭米种计量正常煮饭水量。
  - 米、正常水量、味醂和盐入锅轻拌。
  - 红薯块均匀铺在米上，不反复搅动。
  - 正常煮饭至水分吸收、米熟；关火焖10分钟。
  - 用饭勺从底部轻翻，尽量保留红薯块形。
  - 撒黑芝麻可选；孩子份确认红薯完全软无硬芯。
  - 完成提示：米熟而粒粒分明；红薯完全软、部分边缘自然碎开但不过度成泥。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1.5 cups
  - 红薯：350–400 g，切2 cm块
  - 红薯饭调味：味醂 1 Tbsp；盐 1/2 tsp；黑芝麻 1 tsp，出锅可选

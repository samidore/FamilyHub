steps:
  - 本记录按 old-fashioned rolled oats：锅中加入牛奶或水2.6 cups和一小撮盐，煮到刚沸。
  - 加入燕麦1.5 cups，转中小火保持轻微沸腾约5分钟，偶尔搅动，不持续猛搅。
  - 燕麦已经柔软、液体大部分被吸收但仍能流动时关火；静置2分钟会继续变稠。
  - 孩子份如果太稠，用少量温水或奶调到容易吞咽的稠度并充分降温。
child_serving: 煮软并按需要调稀、降温。
adult_finish: 可另加红糖、枫糖、肉桂或水果。

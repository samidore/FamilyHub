steps:
  - 准备：冷饭用手/饭勺打散大块；鸡蛋打匀。；所有材料放在灶边，炒饭全程快速。
  - 炒锅大火烧热，加2 tsp油；倒蛋液快速推到约七成熟。
  - 立刻加入米饭，用锅铲压散并翻炒，让湿蛋包住米粒。
  - 保持大火炒2–3分钟，直到米饭完全热透、米粒开始松散跳动。
  - 加盐、生抽和葱花，再翻30秒；生抽沿锅边少量加入，不把饭泡湿。
  - 蛋完全凝固、米饭热透且锅底干爽时关火。
  - 完成提示：米粒松散热透、不湿黏；蛋完全凝固且均匀分布。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 熟米饭：约600 g，最好冷饭/充分放凉
  - 鸡蛋：4个
  - 葱：2根，切花
  - 调味：盐 1/2 tsp；生抽 1 tsp，可选；白胡椒 1小撮，可省

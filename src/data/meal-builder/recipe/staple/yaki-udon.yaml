steps:
  - 准备：冷冻乌冬按包装解冻/焯散，彻底沥水。；卷心菜、洋葱切好；炒汁混匀。
  - 炒锅中大火加2 tsp油，下洋葱炒1分钟到边缘透明。
  - 下卷心菜大火炒1–2分钟到体积缩小但仍有脆感。
  - 加入乌冬，用夹子/锅铲拨散；若粘锅只补1 Tbsp水。
  - 沿锅边倒入炒汁，大火快速翻30–60秒。
  - 面条均匀着色、锅底无游离汁、卷心菜刚熟时立即关火。
  - 孩子份剪短面条。
  - 完成提示：乌冬热透有弹性、不糊；卷心菜刚熟；汁均匀附着且锅底干爽。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 乌冬面：3人份，约600 g熟面
  - 卷心菜：300 g，粗切
  - 洋葱：150 g，薄切
  - Yaki Udon 汁：日式高汤粉 1/2 tsp，可省；生抽 2 Tbsp；清酒 1 Tbsp；味醂 1 tsp；水 1 Tbsp

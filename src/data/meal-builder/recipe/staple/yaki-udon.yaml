steps:
  - 处理 核心主食/蛋白 与 green-cabbage, onion；准备 soy-based yaki-udon sauce; household
    base non-spicy and light。
  - 面条按种类煮至合适熟度并沥水；汤面则保留单独汤底。
  - 炒面在高输出灶口快速合炒；汤面则把主料/蔬菜在汤中依次煮熟。
  - 最后合并并调整清淡盐度；成人辣味另加。
child_serving: 作为主食/配菜使用，Meal Combo 必须另配软蛋白。

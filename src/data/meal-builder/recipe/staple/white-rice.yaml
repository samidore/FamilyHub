steps:
  - 饭锅路线：量取大米并淘洗，沥去大部分洗米水；按饭锅对应米量刻度加水，启动正常白米程序。
  - 炉灶路线：1.5 cups茉莉香米用足量水浸15–20分钟后彻底沥水，再加入等体积1.5 cups清水。
  - 加盖中大火煮到刚沸，立即转最低火；保持盖严约15分钟，直到水被吸收。
  - 关火后保持盖盖静置5–10分钟，再用饭勺轻轻翻松。
  - 完成提示：米粒熟透无硬芯，粒粒分明但能自然黏合。
child_serving: 正常熟饭即可；过干时拌少量温水或汤使其更湿润。
adult_finish: 无。
substitutions: []
cook_ingredients:

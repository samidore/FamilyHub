steps:
  - 玉米剥去外层叶和玉米须，必要时切成能平放进蒸锅的段。
  - 蒸锅水先烧开，把玉米放入蒸层并盖严。
  - 蒸约8分钟开始检查；较粗玉米继续到籽粒中心热透、用指甲/叉子能轻松压出汁。
  - 关火取出，静置2分钟后再切段上桌。
child_serving: 不以整根让孩子自行啃咬作为本 Recipe 的默认 child route；按家庭实际切取并看护。

steps:
  - 准备：菌菇表面清理干净并擦干；杏鲍菇切1 cm厚片，口蘑切半/厚片。；不要把湿菌菇堆进锅里。
  - 大平底锅中大火预热，加2 tsp油；菌菇单层铺开。
  - 先不动1–2分钟，让第一面真正上色；翻面继续煎。
  - 菌菇开始缩小并释放少量水后，保持中大火把水汽蒸掉。
  - 加盐和可选生抽，快速翻20秒。
  - 表面金黄、中心熟透且锅底重新干爽时关火。
  - 完成提示：菌菇表面金黄、内部多汁熟透；锅底无水，不是焖煮口感。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - 杏鲍菇切厚片/条；口蘑切片或对半。出水速度不同，但共享煎出焦香后轻调味的 structure。
cook_ingredients:
  - 杏鲍菇 / 口蘑 / Cremini：300–450 g；任选一种；实际选中项使用同一批量
  - 基础调味：中性油 2 tsp；盐 1/2 tsp；生抽 1 tsp，可选

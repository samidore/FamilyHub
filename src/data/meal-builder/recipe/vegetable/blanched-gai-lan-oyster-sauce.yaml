steps:
  - 准备：粗芥兰梗纵切一刀，叶和粗梗分开；酱汁混匀。；准备大锅沸水。
  - 沸水中加1 tsp油（可省）和一小撮盐；先下粗梗30秒。
  - 加入叶片再焯45–90秒；粗梗能咬断、叶片刚软时立即捞出彻底沥水。
  - 酱汁小锅/原锅煮到刚冒泡，搅匀。
  - 芥兰装盘，酱汁均匀淋在表面而不是倒到盘底泡菜。
  - 孩子份选较嫩梗尖和叶，必要时剪短。
  - 完成提示：芥兰鲜绿、梗熟而仍有轻脆感；盘底不积大量水。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 芥兰：450 g
  - 蚝油汁：蚝油 1 Tbsp；生抽 1 tsp；热水 2 Tbsp；糖 1/4 tsp

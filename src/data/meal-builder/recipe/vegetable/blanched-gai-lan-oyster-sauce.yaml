steps:
  - 芥兰450 g洗净；粗梗纵切一刀，叶与粗梗分开；蚝油汁混匀。
  - 大锅水充分沸腾，先下粗梗30秒，再下叶片45–90秒。
  - 成人份达到梗熟而仍有轻脆感时先捞出；孩子份继续煮到粗梗能被叉子较容易穿透。
  - 孩子份剪成短段；成人份淋蚝油汁，孩子份只少量淋汁。
  - 完成提示：孩子份没有硬粗梗，能正常咬断。
child_serving: 粗梗纵切并延长焯煮至软，剪短；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加更多蚝油汁或辣椒。
substitutions: []
cook_ingredients:
  - 芥兰：450 g
  - 蚝油汁：蚝油 1 Tbsp；生抽 1 tsp；热水 2 Tbsp；糖 1/4 tsp

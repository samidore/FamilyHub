steps:
  - 准备：茄子切约1.5 cm粗长条，切后立即上锅避免久放褐变。；酱汁混匀。
  - 蒸锅水先烧开；茄子单层/疏松铺盘上锅。
  - 中大火蒸8分钟后用筷子检查最厚处；能轻易穿透即熟。
  - 立即取出，盘中水太多先倒掉。
  - 趁热淋蒜香酱油汁，轻轻翻匀；不再淋大量热油。
  - 孩子份可先取未拌或少拌酱汁的软茄子。
  - 完成提示：茄子软到筷子无阻力穿透但条形仍在；不油腻、不泡水。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 茄子：450–500 g，切长条
  - 蒜香酱油汁：生抽 1 Tbsp；米醋 1 tsp；糖 1/2 tsp；热水 1 Tbsp；蒜末 1 tsp；芝麻油 1/2 tsp

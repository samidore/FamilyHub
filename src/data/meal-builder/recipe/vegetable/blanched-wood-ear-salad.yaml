steps:
  - 新鲜黑木耳300–400 g彻底洗净，切掉硬根和厚硬连接处，大朵撕小。
  - 锅中水大开，下黑木耳煮3–4分钟；孩子份继续煮到更软，再捞出沥干并切成小片。
  - 黑醋1.5 Tbsp、生抽1 Tbsp、糖1 tsp、芝麻油1 tsp和蒜末拌到糖溶解；成人份拌汁静置约30分钟更入味。
  - 孩子份少带汁，确认没有大韧片或硬根。
child_serving: 完全煮熟、去硬根、延长煮软并切小；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加辣椒、香菜或花椒油。

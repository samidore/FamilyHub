steps:
  - 苦瓜2根纵剖，刮净籽和白瓤，切约5 mm片；撒1/2 tsp盐抓匀10分钟后冲洗沥干。
  - 沸水下苦瓜焯约30–60秒，捞出沥干；孩子份可多焯到片明显变软。
  - 炒锅大火加2 tsp油和蒜末10秒，下苦瓜翻1分钟。
  - 加生抽1 tsp、糖1/2 tsp和水1 Tbsp，翻到水基本蒸发、苦瓜熟透。
  - 孩子份选最软的片剪小；成人可保持略脆。
child_serving: 选焯炒到明显柔软的薄片剪小；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加豆豉、辣椒或黑胡椒。

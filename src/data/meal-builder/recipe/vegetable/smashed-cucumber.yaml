steps:
  - 黄瓜约600 g洗净，纵向拍裂后切一口块；拌1 tsp盐静置20分钟。
  - 倒掉析出的水并轻轻沥干，不用挤碎黄瓜。
  - 加黑醋1.5 Tbsp、生抽1 Tbsp、糖1 tsp、芝麻油1 tsp和蒜末2瓣拌匀。
  - 静置10分钟后再拌一次；孩子若尝只少量提供，但本 Recipe 不承担 Child Vegetable。

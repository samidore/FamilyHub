steps:
  - 准备：菌菇去硬根，大朵撕/切成一口大小；混合菌菇尽量尺寸相近。；味噌、清酒、味醂和水调匀，黄油切小块。
  - 菌菇放深盘/带盖小锅，淋味噌汁，黄油点在表面。
  - 盖严，中小火焖/蒸5分钟。
  - 开盖翻匀，再盖2–4分钟，直到菌菇明显缩水、完全热透并释放汁。
  - 开盖中火30秒让汁略集中；不要收干，菌菇应仍湿润。
  - 关火拌匀；孩子份按原 child coverage 记录，不自动推断。
  - 完成提示：菌菇完全软熟、释放鲜汁；酱汁乳化湿润而不是油水分离。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鲜香菇 / 平菇 / 蟹味菇（Shimeji） / 金针菇 / 舞茸：300–450 g；任选一种；实际选中项使用同一批量
  - 味噌黄油汁：味噌 1 Tbsp；清酒 1 Tbsp；味醂 1 Tbsp；无盐黄油 1 Tbsp；水 1 Tbsp

steps:
  - 菌菇去硬根，大朵切/撕成小块；金针菇去根后横切成约2–3 cm短段；味噌、清酒、味醂和水调匀。
  - 菌菇放深盘或带盖小锅，淋味噌汁，黄油点在表面。
  - 盖严，中小火焖/蒸5分钟。
  - 开盖翻匀，再盖2–5分钟，直到菌菇明显缩水、完全热透并柔软。
  - 孩子份检查没有长丝或大韧片，必要时再剪小，先盛出。
  - 开盖中火30秒让成人份汁略集中；不要收干。
  - 完成提示：菌菇完全软熟、湿润而不是焦韧。
child_serving: 彻底焖软并切小；金针菇必须切短；本 Recipe 计入 Child Vegetable。
adult_finish: 孩子份盛出后，成人可另加七味粉、辣油或更重味噌。
substitutions: []
cook_ingredients:
  - 鲜香菇 / 平菇 / 蟹味菇 / 金针菇 / 舞茸：300–450 g；任选一种
  - 味噌黄油汁：味噌 1 Tbsp；清酒 1 Tbsp；味醂 1 Tbsp；无盐黄油 1 Tbsp；水 1 Tbsp

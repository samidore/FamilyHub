steps:
  - 马蹄去皮洗净，切约3–4 mm片，300–400 g；蒜2瓣切末。
  - 炒锅大火加2 tsp油，下蒜末10秒；加马蹄片大火翻约1分钟。
  - 沿锅边加1–2 Tbsp水，盖20–30秒；开盖倒入轻盐蔬菜汁。
  - 再翻20–30秒到汁薄薄挂片、马蹄完全热透，立即关火保持脆度。
child_serving: 本 Recipe 不计 Child Vegetable。
adult_finish: 可另加黑胡椒、辣椒或葱花。
substitutions: []
cook_ingredients:
  - 马蹄：300–400 g，切薄片
  - 家庭轻盐蔬菜汁：水1 Tbsp；生抽2 tsp；蚝油1 tsp；糖1/4 tsp
  - 蒜2瓣；中性油2 tsp

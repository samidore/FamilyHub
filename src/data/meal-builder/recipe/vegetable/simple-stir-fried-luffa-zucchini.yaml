steps:
  - 丝瓜去硬皮并去掉明显老籽；西葫芦洗净。任选一种切约1 cm斜片，300–450 g。
  - 炒锅大火加2 tsp油，下蒜末10秒；加入蔬菜翻20–30秒。
  - 加水或低盐高汤1/3 cup、生抽2 tsp、蚝油1 tsp、糖1/4 tsp，煮开后盖盖。
  - 中火焖2分钟开始检查；丝瓜应柔嫩但保持形状，西葫芦通常更快。孩子份继续到叉子容易压开后先盛出。
  - 开盖大火把汁收成薄薄挂菜的状态，立即关火。
child_serving: 选完全柔软的片切小；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加白胡椒、辣椒或葱油。
substitutions: []
cook_ingredients:
  - 丝瓜或西葫芦：300–450 g；任选一种
  - 轻汁：水或低盐高汤 1/3 cup；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp
  - 蒜：2瓣；中性油 2 tsp

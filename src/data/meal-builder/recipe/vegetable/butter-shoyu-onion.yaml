steps:
  - 洋葱300 g去皮，纵向切半后逆纤维切约5 mm条。
  - 不粘锅中火融化15 g黄油，下洋葱持续翻炒到明显塌软、半透明。
  - 加生抽3 tsp和剩余15 g黄油，转中小火翻匀。
  - 孩子份继续低火软化，只以叉子轻压即断为终点；若锅太干可加少量水防焦，不写死额外时间。
  - 孩子份先盛出切短；成人份再按需加黑胡椒。
child_serving: 炒到完全软、叉子轻压即断并切短；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加黑胡椒或七味粉。
substitutions: []
cook_ingredients:

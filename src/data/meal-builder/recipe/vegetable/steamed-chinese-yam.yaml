steps:
  - 戴手套处理山药；取2根或足够全家一餐的量，去皮后切成长条段或粗细接近的段。
  - 蒸锅水先充分烧开，再把山药单层放入耐热盘上并盖严。
  - 按来源先蒸约15分钟；用筷子/叉子检查最粗一段中心，能轻松穿透、没有白硬芯才完成。
  - 若仍有硬芯，继续蒸并用同一质地终点复查；孩子份趁热压成小块。
  - 成人可淋少量生抽和现成葱油；孩子份保持清淡。
child_serving: 蒸到中心完全软并压小；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加葱油或生抽。

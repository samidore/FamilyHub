steps:
  - 准备：菠菜洗净；准备沸水和冷水。鸡蛋打散加盐水。
  - 菠菜入大量沸水焯30–45秒，立即捞出过冷水；挤干并切4–5 cm段，焯水弃掉。
  - 炒锅中大火加2 tsp油，倒蛋液推成大块，七成熟时盛出。
  - 原锅加1 tsp油和蒜10秒，下挤干菠菜大火翻20–30秒。
  - 鸡蛋回锅，轻折并补1/4 tsp盐；再炒到蛋完全凝固。
  - 立即关火，避免菠菜继续大量出水。
  - 完成提示：蛋软嫩完全凝固；菠菜熟软不滴水，锅底无大量绿汁。
  - 安全提示：含蛋菜按家庭安全底线做到蛋液完全凝固；蛋类菜中心达到160°F/71°C。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:

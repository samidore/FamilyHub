steps:
  - 空心菜450 g洗净；老硬梗去掉，剩余梗切2–3 cm短段并与叶分开；腐乳汁混匀。
  - 炒锅大火加2 tsp油，下蒜2瓣约10秒；先下梗30秒，再下叶。
  - 倒入腐乳汁快速翻30–60秒。
  - 孩子份取到锅的一侧，加1–2 Tbsp水盖焖1–3分钟到梗明显柔软，少带腐乳汁先盛出。
  - 成人份再大火翻到叶刚软、锅底只剩少量汁时关火。
child_serving: 切短并额外焖软，少带腐乳汁；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加辣椒油或更多腐乳。
substitutions: []
cook_ingredients:
  - 空心菜：450 g
  - 腐乳汁：腐乳 3小块；糖 1 tsp；绍兴酒 1 Tbsp；白胡椒 1/4 tsp；水 1 Tbsp

steps:
  - 准备：空心菜洗净，粗梗切5 cm段并和叶分开。；腐乳用水压散，再与糖、绍兴酒、白胡椒混匀。
  - 炒锅大火烧热，加2 tsp油；下蒜2瓣炒10秒。
  - 先下粗梗大火翻30秒，再下叶片。
  - 倒入腐乳汁，持续大火翻炒30–60秒。
  - 叶片全部塌下、梗刚断生且锅底只剩少量汁时立即关火。
  - 不要再加盐，先尝腐乳咸度；孩子若吃，取腐乳汁较少的嫩叶。
  - 完成提示：叶片刚软、梗仍脆嫩；腐乳汁薄薄包菜，不咸湿积汁。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 空心菜：450 g
  - 腐乳汁：腐乳 3小块；糖 1 tsp；绍兴酒 1 Tbsp；白胡椒 1/4 tsp；水 1 Tbsp

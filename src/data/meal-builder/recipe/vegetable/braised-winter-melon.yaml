steps:
  - 准备：冬瓜切均匀大块；姜5 g切片。；焖汁混匀。
  - 宽锅中火加2 tsp油，下姜炒20秒；加入冬瓜翻1分钟。
  - 倒入焖汁，煮开后转中小火盖盖10分钟。
  - 开盖用筷子检查；冬瓜应开始半透明、能穿透但不散。
  - 若仍硬继续盖2–3分钟；熟后开盖转中火。
  - 汁减少到约锅底2–3 Tbsp并能薄挂冬瓜时关火；不要把冬瓜炒碎。
  - 完成提示：冬瓜半透明软嫩、块形完整；汁薄挂而非汤水或厚酱。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 冬瓜：700 g，去皮去瓤切3 cm块
  - 焖汁：水或低盐高汤 1 cup；蚝油 1 Tbsp；老抽 1/2 tsp；糖 1/4 tsp；白胡椒 1小撮

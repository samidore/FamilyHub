steps:
  - 准备：西兰花或花菜300–450 g切成大小接近的小朵，粗梗削皮切薄片；蒜2瓣切末；调味汁混匀。
  - 炒锅大火预热，加2 tsp中性油，下蒜末炒10秒。
  - 下蔬菜翻炒约1分钟，沿锅边加2–3 Tbsp水，盖盖焖2分钟。
  - 开盖翻匀；花菜或较厚的梗还硬时再补1 Tbsp水、盖盖1–2分钟。
  - 倒入轻盐蔬菜汁，翻20–30秒；孩子份继续焖到叉子容易穿透，再先盛出。
  - 成人份可保留一点脆度；锅底没有明显积水时关火。
  - 完成提示：成人份熟而不烂；孩子份明显更软但仍保持形状。
child_serving: 取较软的小朵和梗，必要时剪小；本 Recipe 计入 Child Vegetable。
adult_finish: 孩子份盛出后，成人可另加辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 西兰花或花菜：300–450 g；任选一种
  - 蒜：2瓣，切末
  - 家庭轻盐蔬菜汁：水 1 Tbsp；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp

steps:
  - 芹菜300–400 g去老筋和硬根；香芹切2–3 cm段，西芹斜切约5 mm薄片。
  - 炒锅大火加2 tsp油，下蒜末10秒；加入芹菜翻约1分钟。
  - 沿锅边加1 Tbsp水，翻到颜色鲜亮、能咬断但仍脆。
  - 加生抽2 tsp、蚝油1 tsp、糖1/4 tsp，翻20–30秒到汁薄挂表面关火。
child_serving: 本 Recipe 不计 Child Vegetable。
adult_finish: 成人可另加辣椒、黑胡椒或花椒油。

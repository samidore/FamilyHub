steps:
  - 准备：白萝卜去皮；厚块边缘可略修圆，表面浅划十字帮助入味。
  - 白萝卜先放清水中小火煮10分钟，倒掉预煮水；这一步减轻生萝卜辛味。
  - 换锅/洗锅，加入日式煮汁和萝卜，煮开后转小火。
  - 盖落盖或盖盖留缝煮15–25分钟。
  - 竹签能从中心无明显阻力穿过时关火；不要为了入味把萝卜煮碎。
  - 在煮汁中静置10–20分钟再上桌，味道更均匀。
  - 完成提示：萝卜中心透明感增加、竹签轻松穿透，块形完整；保留清亮煮汁。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 白萝卜：600 g，切2.5–3 cm厚半月/圆块
  - 日式煮汁：日式高汤 3 cups；生抽 1.5 Tbsp；味醂 1.5 Tbsp；清酒 1 Tbsp；糖 1 tsp

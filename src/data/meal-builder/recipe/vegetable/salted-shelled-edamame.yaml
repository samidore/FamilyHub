steps:
  - 先读包装，确认冷冻毛豆仁是生制、部分熟制还是熟制；包装时间优先。
  - 锅中水煮开，加少量盐，下冷冻毛豆仁。
  - 按包装范围煮；没有明确时间时从2分钟开始检查，目标是中心完全热透且豆仁能被叉子压扁，不追求硬脆。
  - 捞出沥水；孩子份趁软用叉子压裂/压扁，再少量提供。
child_serving: 煮软并压裂/压扁；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加盐、芝麻油或七味粉。
substitutions: []
cook_ingredients:
  - 冷冻去壳毛豆：300–400 g；熟制状态和时间以包装为准
  - 水：足量；盐：少量

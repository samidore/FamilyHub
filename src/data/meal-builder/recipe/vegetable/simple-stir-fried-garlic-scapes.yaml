steps:
  - 蒜苔约300 g洗净；从基部逐段弯折，明显木质、不能自然折断的部分丢弃；嫩段切约5 cm。
  - 炒锅中大火加2 tsp油，下姜丝10秒；加蒜苔翻1分钟让表面受热。
  - 加绍兴酒2 tsp和水1/3 cup，转大火后把菜推到中间，盖盖30秒。
  - 开盖加生抽2 tsp、糖1/4 tsp、芝麻油1/2 tsp，继续大火翻20–30秒，汁基本收住后关火。

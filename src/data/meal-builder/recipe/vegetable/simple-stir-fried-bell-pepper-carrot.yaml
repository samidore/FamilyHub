steps:
  - 甜椒去籽切约1 cm条，或胡萝卜去皮切约3 mm薄片；总量300–450 g。
  - 炒锅大火加2 tsp油，下蒜末10秒；加入蔬菜翻1分钟。
  - 沿锅边加2–3 Tbsp水，盖盖1–2分钟；胡萝卜通常需要更久，按叉子穿透程度判断。
  - 孩子份继续补1 Tbsp水、盖焖到明显柔软，先盛出。
  - 成人份倒入轻盐蔬菜汁，快速翻20–30秒到汁薄挂表面关火。
child_serving: 额外盖焖至叉子容易穿透并切小；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加辣椒油或黑胡椒。
substitutions: []
cook_ingredients:
  - 甜椒或胡萝卜：300–450 g；任选一种
  - 家庭轻盐蔬菜汁：水 1 Tbsp；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp
  - 蒜 2瓣；中性油 2 tsp

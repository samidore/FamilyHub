steps:
  - 所选蔬菜300–450 g洗净并彻底沥干；按质地切成适合快炒的大小，粗梗、花菜、豆荚或块茎先处理，叶片和嫩梗分开；蒜2瓣切末；轻盐蔬菜汁混匀。
  - 炒锅大火预热，加2 tsp中性油，下蒜末约10秒。
  - 若选择了加点油水，按所选肉类的大小切片或分段；整块或厚件可另锅先煎熟，再在蔬菜快熟时合锅。
  - 先下较硬的梗、花菜、豆荚或块状蔬菜30–90秒，再下嫩梗和叶片；芥菜苦味较明显时同时加1/4–1/2 tsp糖。
  - 沿锅边加1 tsp绍兴酒（可省），翻匀；成人份接近断生时倒入轻盐蔬菜汁。
  - 孩子份在这一步分到锅的一侧或小锅，加1–2 Tbsp水盖焖1–3分钟，直到梗能轻松压断、叶片完全柔软，先盛出。
  - 成人份再快速翻20–30秒，保持鲜亮；锅底没有明显积水时关火。
  - 完成提示：成人份熟而不水；孩子份明显软、无大块硬梗或长纤维。
child_serving: 切短并额外盖焖至明显柔软；本 Recipe 计入 Child Vegetable。
adult_finish: 孩子份盛出后，成人可另加辣椒油、辣椒粉或更重调味。
substitutions: [蒜蓉属于同一 cooking structure，不另建 Recipe。]
cook_ingredients:

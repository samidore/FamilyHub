steps:
  - 准备：菠菜切去老根，彻底洗净；准备一大盆冷水。；芝麻磨碎后与生抽、糖、水混匀。
  - 大锅水充分沸腾；先抓住叶片把茎部入水约20秒，再整把放入。
  - 继续焯约30–45秒，叶片全部塌下但仍鲜绿时立即捞入冷水。
  - 冷却后彻底挤掉水分，切成4–5 cm段；焯菠菜的水弃掉，不作为汤底。
  - 上桌前与芝麻酱汁拌匀；若拌后碗底明显出水，再轻挤一次菠菜而不是继续加酱油。
  - 孩子份可少放酱汁并把菠菜切更短。
  - 完成提示：菠菜熟软、仍鲜绿且不滴水；芝麻汁均匀附着，碗底不积稀汁。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

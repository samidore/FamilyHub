steps:
  - 准备：蔬菜洗净后彻底沥干；叶菜把较粗的梗和叶分开，硬菜切成约一口大小。；蒜2瓣切末；把蔬菜汁混匀。
  - 炒锅大火预热到明显热但不冒浓烟，加2 tsp中性油；下蒜末炒10秒。
  - 先下较硬的梗/厚片，大火翻炒30–60秒；再下叶片或易熟部分。
  - 沿锅边加1 tsp绍兴酒（可省略），立刻翻炒；若锅太干，只沿锅边补1 Tbsp水，不要把菜煮在水里。
  - 蔬菜接近断生时倒入家庭轻盐蔬菜汁，快速翻匀20–30秒。
  - 看到菜颜色鲜亮、体积刚缩、梗部能咬断但仍有轻微脆感时立即关火。
  - 完成提示：叶片刚塌、梗能咬断但不软烂；锅底没有一滩水，菜表面只薄薄有味汁。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鲜香菇：300–450 g
  - 青菜 / 菜心 / 芥兰：300–450 g；任选一种；实际选中项使用同一批量
  - 家庭轻盐蔬菜汁：水 1 Tbsp；生抽 2 tsp；蚝油 1 tsp；糖 1/4 tsp

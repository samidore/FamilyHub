steps:
  - 韭黄或韭菜300–350 g洗净彻底沥干，切约3 cm段；粗白梗和叶段分开。
  - 炒锅大火加2 tsp油，先下粗白梗约20秒。
  - 加叶段大火翻约40–60秒，到整体刚塌下。
  - 加生抽1 tsp、盐少量和芝麻油1/2 tsp，翻10秒立即关火，不久炒出水。

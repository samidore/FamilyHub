steps:
  - 先读冷冻青豆包装；若包装要求解冻或给出更严格加热方式，按包装执行。
  - 按来源量取约1 lb / 450 g青豆。锅中水充分沸腾后下青豆；成人份煮到完全热透且熟嫩即可。
  - 孩子份留在锅中继续煮，只以“叉子能轻松压扁”为终点；达到后捞出并逐粒压裂/压扁。
  - 全部沥水；成人份拌无盐黄油1 Tbsp并按需少量加盐。孩子份可少带或不带额外盐。
child_serving: 煮到叉子能轻松压扁，并压裂/压扁；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加黑胡椒或香草。

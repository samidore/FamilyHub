steps:
  - 准备：白菜梗斜切薄片，叶切大块；完全沥干。；醋溜汁搅匀；基础锅不放辣椒。
  - 炒锅大火加2 tsp油，下蒜2瓣10秒。
  - 先下白菜梗，大火翻炒60–90秒到边缘开始透明。
  - 下白菜叶，再翻30–60秒到叶片刚塌。
  - 醋溜汁重新搅匀沿锅边倒入，快速翻20–30秒。
  - 汁刚发亮、白菜熟但梗仍有脆感时立即关火；醋香应明显但不呛生。
  - 完成提示：白菜梗熟脆、叶片刚软；酸甜汁薄挂、不成厚芡。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 大白菜：600 g，梗叶分开切
  - 醋溜汁：陈醋/镇江醋 1.5 Tbsp；生抽 1 Tbsp；糖 1 tsp；水 1 Tbsp；玉米淀粉 1/2 tsp

steps:
  - 成熟番茄3个洗净，切去硬蒂；成人份切片，孩子份直接切成更小软块。
  - 均匀撒糖1–2 tsp，轻拌后静置5分钟，让番茄自身汁水把糖化开。
  - 尝味；只在番茄很酸时再少量补糖，不做成甜点浓度。
  - 孩子份确认没有硬蒂或大块厚皮后直接提供。

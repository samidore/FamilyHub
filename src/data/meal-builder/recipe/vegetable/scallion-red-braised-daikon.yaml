cook_ingredients:
  - 白萝卜：600 g，去皮切约1.5–2 cm厚半月块
  - 小葱：4根，葱白切段、葱绿切葱花；姜2片
  - 淡口红烧汁：清水240 mL、生抽2 tsp、老抽1/4 tsp，糖可选1/4 tsp
  - 食用油：2 tsp
steps:
  - 白萝卜洗净去皮，切1.5–2 cm厚半月块；小葱分开葱白和葱绿，调匀红烧汁。
  - 深不粘锅中火加2 tsp油，先下葱白和姜片煸约40秒至闻到葱香，不要炒焦。
  - 加入白萝卜翻炒约2分钟，让表面沾上葱油；倒入红烧汁烧开。
  - 盖盖转中小火焖18–22分钟，中途翻一次并检查水量，锅底将干时少量补水。
  - 用筷子从萝卜中心轻松穿透才算好；如果仍硬，继续盖盖焖3–5分钟。
  - 开盖中火收汁约3分钟至锅底剩少量薄汁，轻翻使萝卜均匀上色，不要烧干。
  - 先盛出孩子份并切小，再撒葱绿翻匀关火；成人份可按口味补生抽。
  - 完成提示：萝卜软透但不散，浅酱色，葱香明显，盘底只有薄薄红烧汁。
child_serving: 取筷子轻松穿透的萝卜，剪成适合入口的小块；孩子份先盛出，口味保持清淡。
adult_finish: 孩子份盛出后，可单独补一点生抽或黑胡椒；需辣味时另加。

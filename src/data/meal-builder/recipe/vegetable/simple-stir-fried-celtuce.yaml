cook_ingredients:
  - 莴笋：1大根，削皮后约300–400 g
  - 水或低盐高汤 1/3 cup；盐 1/4 tsp；糖 1/4 tsp；绍兴酒 1 Tbsp
  - 姜2片；蒜2瓣；中性油2 tsp；玉米淀粉1 tsp+水1 Tbsp

steps:
  - 莴笋1大根削去全部硬外皮，露出嫩绿色内芯；斜切约3 mm薄片。
  - 把1/3 cup水或低盐高汤、1/4 tsp盐、1/4 tsp糖、1 Tbsp绍兴酒混匀；另调1 tsp玉米淀粉加1 Tbsp水。
  - 炒锅大火烧热，加2 tsp油和姜片15秒；加蒜片，再下莴笋大火翻1分钟。
  - 倒入预混汤汁翻匀；莴笋刚熟仍轻脆时细线加入淀粉水，翻约30秒到薄汁挂片，立即关火。
child_serving: 本 Recipe 不计 Child Vegetable。
adult_finish: 可另加辣椒或花椒油。

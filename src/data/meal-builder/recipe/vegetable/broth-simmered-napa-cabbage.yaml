steps:
  - 准备：娃娃菜纵切成4–6瓣或大白菜切宽条，洗净沥干。
  - 深锅把鸡汤和姜煮开，转中火。
  - 先下粗梗部分煮2分钟，再把叶片压入汤中。
  - 盖盖中小火再煮3–5分钟，直到菜梗能轻松咬断。
  - 打开盖尝汤，只补必要的盐；汤量不需要收干。
  - 连少量汤一起盛盘；孩子份把长菜梗剪短。
  - 完成提示：菜梗软而不烂、叶片柔软；汤清、不过咸。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 娃娃菜 / 大白菜：300–450 g；任选一种；实际选中项使用同一批量
  - 上汤底：低盐鸡汤 3 cups；姜 3片；盐 1/4 tsp起；白胡椒 1小撮，可省

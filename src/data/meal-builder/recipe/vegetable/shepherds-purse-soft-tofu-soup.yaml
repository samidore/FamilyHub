steps:
  - 准备：豆腐切2.5 cm块；尽量少搬动。；冷冻荠菜可直接下锅掰散；若用青菜切短。
  - 汤锅把清汤煮开；若用冷冻荠菜，先下锅煮到完全散开并重新沸腾。
  - 轻轻滑入豆腐，转中小火煮3–4分钟让中心热透。
  - 若用其他青菜，最后2–3分钟加入。
  - 想做‘羹’才把薄芡搅匀后细线倒入，边轻推边煮到汤略稠；普通嫩豆腐汤可完全不勾芡。
  - 最后分次加盐，避免沸腾太猛把豆腐冲碎。
  - 完成提示：豆腐完整且中心热透；菜软；汤清或仅轻微挂勺，不厚糊。
  - 安全提示：无肉类安全温度要求；按步骤做到指定软硬度，并避免长时间室温放置。
child_serving: 优先取较软、较淡、易剪小的部分；若该 record 的 Child coverage 为 ingredient-dependent/false/unknown，不因此自动计入 Meal completion。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 嫩豆腐：1盒，约400–450 g，切块
  - 冷冻荠菜末：200–250 g
  - 清汤：低盐高汤或水 4 cups；生抽 1 tsp；盐 1/2 tsp起；白胡椒 1小撮，可省
  - 可选薄羹：玉米淀粉 1 Tbsp；水 2 Tbsp

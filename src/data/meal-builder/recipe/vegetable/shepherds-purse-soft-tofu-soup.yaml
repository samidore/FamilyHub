steps:
  - 汤锅加4 cups低盐高汤或水煮开；冷冻荠菜末200–250 g可直接下锅掰散。
  - 煮到荠菜完全散开并重新沸腾；有嫩豆腐时把1盒豆腐切块轻轻滑入，再中小火3–4分钟。
  - 想做羹时，把1 Tbsp玉米淀粉与2 Tbsp水调匀，细线倒入并轻推到汤略挂勺；普通汤可不勾芡。
  - 最后分次加盐；孩子份保持清淡并确认没有成团的长纤维。
child_serving: 荠菜末煮散、保持清淡；本 Recipe 计入 Child Vegetable。
adult_finish: 成人可另加白胡椒、香油或辣椒油。
substitutions: []
cook_ingredients:
  - 冷冻荠菜末：200–250 g
  - 清汤：低盐高汤或水 4 cups；生抽 1 tsp；盐 1/2 tsp起；白胡椒可省
  - 嫩豆腐：1盒约400–450 g，可选；有货时加入
  - 可选薄羹：玉米淀粉 1 Tbsp；水 2 Tbsp

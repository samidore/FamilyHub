steps:
  - 准备：香干切成与肉末颗粒接近的小丁；姜5 g切末。；酱丁汁全部混匀；基础锅不加辣。
  - 炒锅中大火加2 tsp油，下姜末10秒。
  - 加入猪绞肉，用锅铲压散，炒到完全变色并出现少量褐色焦点。
  - 加入香干丁，大火翻炒1–2分钟，让香干表面热透略干。
  - 倒入酱丁汁，保持中大火持续翻炒1–2分钟。
  - 汁从水状变成薄亮层、肉末和香干丁都均匀着色且锅底基本干爽时关火。
  - 孩子份可少带浓酱；成人可用作拌饭/拌面浇头。
  - 完成提示：肉末松散熟透、香干丁有嚼感但不干硬；酱汁薄裹、不积水。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：300 g
  - 香干：200 g，切约7–8 mm丁
  - 酱丁汁：甜面酱 1.5 Tbsp；生抽 1 Tbsp；绍兴酒 1 Tbsp；糖 1/2 tsp；水 3 Tbsp

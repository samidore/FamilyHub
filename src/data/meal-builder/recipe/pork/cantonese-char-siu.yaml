steps:
  - 准备：猪肉切成约5–7 cm厚的长条；腌汁混匀。；在腌汁接触生肉前先舀出约1 Tbsp + 1 tsp作为后段刷汁；其余腌汁与猪肉拌匀，冷藏至少8小时，最好隔夜。
  - 烤箱上层架预热475°F/246°C；烤盘铺铝箔并架金属烤架，盘底加入约1 cup水防滴汁焦糊。
  - 猪肉沥去多余腌汁后单层放烤架；475°F烤10分钟，然后把烤箱降到375°F/190°C，继续烤15分钟。
  - 总计烤25分钟时翻面；若盘底已干，再补约2/3 cup水，并把烤盘前后转180°；375°F再烤15分钟。
  - 把预留的干净腌汁与麦芽糖/蜂蜜、热水混匀。总计40分钟时两面都刷汁，翻面后再烤10分钟；每10分钟观察一次，糖分过快变黑就降温。
  - 中心达到145°F/63°C后取出；若表面颜色不足，可最后短时间broil，但必须全程看守。
  - 出炉后可再薄刷一次剩余干净刷汁，静置至少10分钟再切片；孩子份选瘦嫩、不过焦部分。
  - 完成提示：表面深红褐发亮、有焦糖化边缘但不焦黑；内部仍多汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 梅花肉/猪肩：900 g，切成长条，厚约5–7 cm
  - 叉烧腌汁（The Woks of Life 原方约2/3量）：白糖 2 Tbsp + 2 tsp；盐 1 1/3 tsp；五香粉 1/3 tsp；白胡椒 1/8 tsp + 1小撮；芝麻油 1/3 tsp；绍兴酒 2 tsp；生抽 2 tsp；海鲜酱 2 tsp；糖蜜 molasses 1 1/3 tsp；蒜末 2瓣
  - 后段刷汁：从腌汁中预先留出的干净腌汁 约1 Tbsp + 1 tsp（必须在接触生肉前留出）；麦芽糖或蜂蜜 1 Tbsp + 1 tsp；热水 2 tsp

  - pantry_core: char-siu sweet-savory glaze; household version lighter and not
      aggressively salty
    role: seasoning
    availability: assumed
steps:
  - 处理 pork-shoulder-chunks，准备 char-siu sweet-savory glaze; household version
    lighter and not aggressively salty；需要腌制的菜提前完成。
  - 烤箱预热；食材单层放置，使用少量油或烘焙纸/烤架降低粘连。
  - 按引用来源的厚度与熟度逻辑烤制；家庭实际切法不同则以熟度为准。
  - 出炉后静置/拆骨/切小；成人酱汁或辣味在孩子份盛出后再加。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

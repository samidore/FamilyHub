steps:
  - 准备：鸡蛋煮熟剥壳；猪肉擦干；鱼露、椰子水和水分别量好，糖焦化时不要离锅。
  - 厚锅中小火把1 Tbsp糖与1 Tbsp水煮到浅琥珀色，立即加入猪肉翻匀上色。
  - 加入鱼露和其余糖翻1分钟，再加入椰子水与水；煮开撇沫，转小火盖盖炖约20分钟后加入鸡蛋。
  - 继续小火炖到猪肉软嫩；若汁过多，最后开盖中火减少，每几分钟轻翻鸡蛋使上色均匀。
  - 汁仍能流动、猪肉筷子可轻松插入且鸡蛋表面上色时关火；不要把鱼露汁收到咸稠。
  - 孩子份优先猪肉瘦嫩部分和蛋黄/蛋白，少带浓汁。
  - 完成提示：猪肉软嫩；鸡蛋均匀着色；汤汁浓香但仍是可舀的卤汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；大块猪肉实际做至软嫩熟透。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 梅花肉块：900–1000 g，切4–5 cm块
  - 鸡蛋：6个，煮熟剥壳
  - Thịt Kho卤汁：鱼露 5 Tbsp；糖 4 tsp；椰子水 4 cups；水 3/4 cup
  - 焦糖：糖 1 Tbsp；水 1 Tbsp

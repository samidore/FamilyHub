steps:
  - 准备：鸡蛋煮熟剥壳；猪肉擦干并切4–5 cm块；椰子水、水、鱼露和糖量好。
  - Instant Pot 选 Sauté，中火把糖和1 Tbsp水煮至浅琥珀色，立刻加入猪肉翻匀；按批次煎，不堆满。
  - 倒入鱼露、其余糖、2 cups椰子水和3/4 cup水；刮净锅底焦糖，液体不足时仅补至压力锅最低液量。
  - 锁盖 High Pressure 25分钟，自然泄压10分钟。开盖检查最大肉块：筷子可较轻松插入且肉已软嫩；仍硬时再 High Pressure 5分钟并自然泄压5分钟。
  - 把肉和汁转入宽锅或用 Instant Pot Sauté；加入熟鸡蛋，小火浸煮10–15分钟上色。若汁过多，只略微收浓，仍保持可舀。
  - 孩子份先取软嫩瘦肉和蛋，剪小并少带浓汁。
  - 完成提示：猪肉软嫩、鸡蛋均匀着色；鱼露汁浓香但仍能流动，不收成咸稠糖浆。
  - 安全提示：大块猪肉实际做至软嫩熟透。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 梅花肉块：900–1000 g，切4–5 cm块
  - 鸡蛋：6个，煮熟剥壳
  - Thịt Kho卤汁：鱼露 5 Tbsp；糖 4 tsp；椰子水 4 cups；水 3/4 cup
  - 焦糖：糖 1 Tbsp；水 1 Tbsp
  - 压力阶段液体：椰子水 2 cups + 水 3/4 cup（从所列卤汁总量取）；熟鸡蛋泄压后加入。

steps:
  - 准备：肉丝腌15–20分钟；鸡蛋打散加蛋液调味。；黄瓜切薄片；新鲜黑木耳不泡发，直接洗净切小。
  - 炒锅中大火加2 tsp油，鸡蛋炒到七成熟、仍湿润时盛出。
  - 锅重新烧热加2 tsp油，下肉丝大火炒到表面变色、约八成熟，盛出。
  - 原锅下黄瓜和新鲜木耳，大火翻炒60–90秒，让木耳彻底热透、黄瓜刚失去生味。
  - 肉丝回锅，倒入木须汁，翻炒30秒。
  - 鸡蛋最后回锅，用锅铲轻折10–20秒；汁刚被食材吸附、锅底不积水时关火。
  - 完成提示：鸡蛋软、肉丝嫩；木耳热透、黄瓜仍有形；锅底无明显汁水。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：225 g，切细丝
  - 鸡蛋：3个
  - 黄瓜：1根，约200 g，切片/条
  - 新鲜黑木耳：150 g，洗净切小片
  - 肉丝腌料：生抽 2 tsp；绍兴酒 1 tsp；玉米淀粉 2 tsp；芝麻油 1/2 tsp；姜末 1 tsp
  - 木须汁：绍兴酒 1 Tbsp；生抽 1 Tbsp；蚝油 1 tsp；水 2 Tbsp；糖 1/4 tsp
  - 蛋液：盐 1/4 tsp；绍兴酒 1 tsp

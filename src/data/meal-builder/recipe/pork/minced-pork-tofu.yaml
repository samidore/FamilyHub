steps:
  - 准备：豆腐切块后尽量少搬动；姜5 g、蒜1瓣切末。；酱汁混匀；本菜不是麻婆豆腐，基础锅不放豆瓣酱/辣椒。
  - 深不粘锅中火加2 tsp油，下姜蒜10秒；加入猪绞肉压散。
  - 炒到肉末全部变色并出现少量褐色点。
  - 倒入酱汁并煮开，再轻轻滑入豆腐；用晃锅代替频繁翻动。
  - 中小火煮3–5分钟，让豆腐中心热透；如果汁太稀，再中火煮30–60秒。
  - 汁薄薄挂勺、肉末完全熟、豆腐仍成块时关火。
  - 完成提示：豆腐完整、中心热透；肉末完全熟；汁薄挂勺，不成厚芡。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：300 g
  - 嫩豆腐：1盒，约400–450 g，切2.5 cm块
  - 轻口肉末豆腐汁：水或低盐高汤 1/2 cup；生抽 1 Tbsp；蚝油 2 tsp；糖 1/2 tsp；玉米淀粉 1.5 tsp

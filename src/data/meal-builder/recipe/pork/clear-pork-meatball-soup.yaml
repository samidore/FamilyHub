steps:
  - 锅中加4 cups水或低盐高汤和姜片，煮开。
  - 下贡丸，转中小火稳定小滚；若包装给出加热时间，以包装为准。
  - 无更具体包装说明时，煮到全部中心滚热；切开最大一颗确认没有冷芯。
  - 少量盐和白胡椒调味，关火撒葱花。

steps:
  - 准备：肉丝与全部腌料抓匀，静置15分钟；香干切与肉丝近似粗细。；姜5 g、蒜2瓣切末；收尾调味预先混匀。
  - 炒锅大火加1 Tbsp油；肉丝炒到完全变色、约八成熟，立即盛出。
  - 原锅下姜蒜15秒；加入香干，大火翻炒1–2分钟让表面热透。
  - 肉丝回锅，倒入收尾调味。
  - 快速翻炒30–60秒，直到香干和肉丝都均匀着色、锅底没有多余水。
  - 关火后再淋芝麻油（若已混入调味可省此步）；孩子份剪短肉丝。
  - 完成提示：香干热透但不干硬；肉丝嫩；锅底基本干爽、表面只有薄薄调味。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：225 g，切细丝
  - 香干：225 g，切细丝
  - 肉丝腌料：玉米淀粉 1.5 tsp；水 3 Tbsp；糖 1/8 tsp；绍兴酒 2 tsp；生抽 1 Tbsp
  - 收尾调味：老抽 1/2 tsp；糖 1/4 tsp；芝麻油 1 tsp；水 1 Tbsp

steps:
  - 准备：里脊切成大小一致的条；加入绍兴酒、盐、水抓到吸收，再加淀粉和1 tsp油抓匀，静置15分钟。；糖醋汁全部搅匀；下锅前再搅一次，防止淀粉沉底。
  - 不粘锅中大火预热，加1 Tbsp中性油；猪肉分两批摊成单层，避免挤在一起出水。
  - 每批先煎到第一面定型上色，再翻动；炒到肉刚熟、表面有浅焦色后立即盛出。
  - 擦去锅中明显焦黑淀粉屑；转中火，把糖醋汁再次搅匀后倒入。
  - 持续搅拌到汁从浑浊水状变成透明发亮、气泡变大，约30–60秒。
  - 猪肉回锅，大火快速翻15–30秒；每条肉都裹上薄亮汁、锅底只剩极少可流动汁时立刻关火。
  - 静置3分钟；孩子份先盛出，若酸味偏强可配米饭而不是继续加糖进整锅。
  - 完成提示：汁只薄薄包住肉条，不形成厚胶层；肉条有浅焦色但内部仍嫩。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：450 g，切约1 cm粗条
  - 短腌/薄浆：绍兴酒 1 Tbsp；盐 1/2 tsp；水 2 Tbsp；玉米淀粉 2 Tbsp；中性油 1 tsp
  - 糖醋汁（一次混匀）：番茄酱 4 Tbsp；红糖或白糖 4 Tbsp；米醋/陈醋 3 Tbsp；水 2 Tbsp；玉米淀粉 1 tsp；盐 1/4 tsp

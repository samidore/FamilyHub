steps:
  - 准备：猪排较厚时轻拍到约1–1.5 cm；加短腌15分钟。；蛋打散；猪排先蘸蛋再薄拍淀粉，抖掉厚粉。
  - 不粘锅中大火加1 Tbsp油，猪排分批煎到两面蛋衣浅金黄；不需要像来源传统路线那样大量浅炸。
  - 全部猪排回锅，倒入焖汁；煮开后转中小火。
  - 盖盖焖5–8分钟，中途翻一次；厚排按温度判断而非死守时间。
  - 中心达到145°F/63°C后开盖中火，让汁减少。
  - 汁能薄薄挂在猪排表面、锅底仍有2–3 Tbsp流动汁时关火，静置3分钟。
  - 孩子份去骨并剪小。
  - 完成提示：蛋衣软而不脱落；猪排内部熟而不柴；汁薄挂表面。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪排：3块，共约700–900 g
  - 短腌：绍兴酒 2 Tbsp；盐 1/2 tsp；生抽 1 Tbsp；水 3 Tbsp
  - 薄衣：鸡蛋 2个；玉米淀粉 1/3 cup
  - 上海式焖汁：水或低盐高汤 1 cup；生抽 1.5 Tbsp；糖 1 Tbsp；绍兴酒 1 Tbsp

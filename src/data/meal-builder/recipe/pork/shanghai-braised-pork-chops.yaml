steps:
  - 准备：猪排较厚时轻拍到约1–1.5 cm；短腌15分钟。鸡蛋打散，猪排薄拍玉米淀粉后裹蛋衣。
  - Instant Pot 选 Sauté，加1 Tbsp油将猪排分批煎至两面蛋衣浅金黄；盛出。
  - 加入1 cup上海式焖汁并刮净锅底；放入猪排，锁盖 High Pressure 8分钟，自然泄压5分钟。
  - 测最厚处达到145°F/63°C；未达时用 Sauté 短煮并继续测温，不长时间压力烹调。
  - 取出猪排；把压力汤汁倒入宽锅，中火减少到薄薄挂表面、仍留2–3 Tbsp流动汁。
  - 孩子份去骨并剪小。
  - 完成提示：蛋衣软而不脱落；猪排内部熟而不柴；汁薄挂表面。
  - 安全提示：整块猪肉达到145°F/63°C并静置3分钟；给孩子的份量去骨。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪排：3块，共约700–900 g
  - 短腌：绍兴酒 2 Tbsp；盐 1/2 tsp；生抽 1 Tbsp；水 3 Tbsp
  - 薄衣：鸡蛋 2个；玉米淀粉 1/3 cup
  - 上海式焖汁：水或低盐高汤 1 cup；生抽 1.5 Tbsp；糖 1 Tbsp；绍兴酒 1 Tbsp
  - 上海式焖汁中的水或低盐高汤 1 cup 为压力液体；其余原料照列。

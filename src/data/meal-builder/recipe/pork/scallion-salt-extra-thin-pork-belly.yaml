steps:
  - 五花肉分开摊平并擦去表面水；葱切末。
  - 干锅中大火预热，五花肉单层下锅；肉一侧出现褐色焦点、脂肪转透明后翻面。
  - 第二面也上色且肉完全不再呈生粉红后立即盛出；量大时分批，不把锅塞满。
  - 倒掉明显多余油，全部肉回锅，加入葱末、1/2 tsp盐和少量白胡椒快速翻匀即关火。

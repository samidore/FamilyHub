steps:
  - 处理 soft-pork-ribs；蔬菜/主食配料为 daikon。骨肉汤按来源需要先焯洗。
  - 加水与 ginger / clear broth / light salt 中的基础香料，先把肉类煮/炖至接近软嫩。
  - 按食材耐煮程度加入蔬菜或主食类块根；避免全部从一开始同煮导致过烂。
  - 最后用轻盐调味；孩子份取软肉、软菜并去骨。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。

steps:
  - 准备：猪里脊逆纹切约3 mm薄片或细丝；若是整条里脊，先冷冻15–20分钟至略硬更容易切匀。；把腌料加入猪肉，抓到水分基本被吸收，再静置10–15分钟。；所有蔬菜/香干先切到能在2–4分钟内熟的大小；炒汁下锅前再次搅匀，避免淀粉沉底。
  - 铁锅/炒锅大火预热至滴水快速滚动蒸发，转中大火，加1 Tbsp中性油。
  - 猪肉摊成单层，先不要频繁翻动；约30–45秒底面变白后快速翻炒，炒到约七八成熟、中心刚失去大部分粉红色，立即盛出。
  - 原锅补1 tsp油（若锅仍有油可不补），下姜末5 g和蒜末2瓣炒约15秒；加入香干、韭黄，按硬度先后炒到刚断生。
  - 猪肉回锅；把炒汁重新搅匀后沿锅边倒入，持续翻炒30–60秒。
  - 当汁从水状变成薄薄发亮、能均匀挂在肉和菜上且锅底不积一滩水时立刻关火；不要继续把汁收成咸稠浆。
  - 离火静置约3分钟再盛孩子份；孩子份剪短肉丝/肉片，成人辣味另加。
  - 完成提示：肉片嫩、无生中心；蔬菜刚熟仍有形；锅底只剩薄薄亮汁，不积水。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：340 g
  - 香干：200 g
  - 韭黄：300–450 g
  - 肉片腌料（先混匀）：水 2 Tbsp；生抽 2 tsp；绍兴酒 2 tsp；玉米淀粉 2 tsp；中性油 1 tsp
  - 家庭轻盐炒汁（下锅前搅匀）：水或低盐高汤 3 Tbsp；生抽 2 tsp；蚝油 2 tsp；糖 1/2 tsp；玉米淀粉 1 tsp

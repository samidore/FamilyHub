steps:
  - 准备：猪里脊逆纹切约3 mm薄片或细丝；腌料抓到水分基本被吸收，静置10–15分钟；香干切丝，韭黄切段，炒汁下锅前搅匀。
  - 炒锅大火预热，加1 Tbsp中性油；猪肉摊成单层，约30–45秒底面变白后快速翻炒，炒到约七八成熟立即盛出。
  - 原锅补1 tsp油，下姜末5 g和蒜末2瓣炒约15秒；加入香干、韭黄，炒到刚断生。
  - 猪肉回锅，沿锅边倒入炒汁，持续翻炒30–60秒；汁变薄亮且不积水时关火。
  - 离火静置约3分钟再盛孩子份；孩子份剪短肉丝，成人辣味另加。
  - 完成提示：肉片嫩、无生中心；蔬菜刚熟仍有形；锅底只剩薄薄亮汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；薄肉丝实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：340 g
  - 香干：200 g
  - 韭黄：300–450 g
  - 肉片腌料：水 2 Tbsp；生抽 2 tsp；绍兴酒 2 tsp；玉米淀粉 2 tsp；中性油 1 tsp
  - 家庭轻盐炒汁：水或低盐高汤 3 Tbsp；生抽 2 tsp；蚝油 2 tsp；糖 1/2 tsp；玉米淀粉 1 tsp

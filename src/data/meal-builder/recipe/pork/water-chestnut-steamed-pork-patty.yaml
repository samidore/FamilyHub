steps:
  - 准备：猪肉加全部调味同一方向搅2–3分钟至略发黏，再拌入马蹄。；铺入20–23 cm浅盘，压成约1.5–2 cm均匀厚度；中心不要堆高。
  - 蒸锅水先大开；肉饼上锅后立即盖盖，保持中大火稳定蒸汽。
  - 蒸10分钟后从中心测温；若未达到160°F/71°C，继续每2分钟检查一次。
  - 达到安全温度后关火，等30秒再开盖。
  - 盘中肉汁可保留；如果表面浮油较多，用勺撇去明显油层。
  - 孩子份切成小块，确认马蹄丁大小适合咀嚼。
  - 完成提示：肉饼中心完全熟、按压有弹性但不干硬；盘汁清亮。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 马蹄：100 g，切细丁
  - 肉饼调味：生抽 1 Tbsp；绍兴酒 1 Tbsp；蚝油 2 tsp；玉米淀粉 2 tsp；水 3 Tbsp；芝麻油 1 tsp；白胡椒 1小撮

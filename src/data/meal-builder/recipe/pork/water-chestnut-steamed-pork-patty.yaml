    seasoning 做短腌或铺料。
  - 水开后上锅蒸；厚度/骨量变化时以实际熟度为准，不把来源分钟机械套用到不同切法。
  - 出锅后按需要加入葱姜等清淡收尾；避免额外淋大量热油。
  - 孩子份先去骨/剪小/确认没有硬壳或筋膜，再加成人后味。

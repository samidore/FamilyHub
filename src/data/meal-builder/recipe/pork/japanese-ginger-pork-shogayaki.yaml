steps:
  - 准备：猪肉加1 Tbsp清酒抓匀，静置5分钟后擦去表面多余水分；薄薄拍面粉。；姜烧汁全部混匀。
  - 不粘锅中大火加2 tsp油；猪肉分批单层煎，第一面变白并有浅焦边后翻面。
  - 猪肉约八九成熟时全部回锅；若使用洋葱，先在空处炒到变透明。
  - 倒入姜烧汁，保持中大火让汁持续冒泡。
  - 一边翻肉一边让汁快速浓缩；从水状变成亮亮的薄层、能挂住肉片时立刻关火。
  - 盛盘静置3分钟；孩子份剪短，成人可再加现磨姜或七味粉。
  - 完成提示：肉片嫩、边缘有轻微焦香；姜烧汁呈薄亮膜，不留大量汤汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：340 g，切2–3 mm薄片
  - 洋葱：1/2个，约100 g，可选
  - 姜烧汁：生抽 2 Tbsp；味醂 2 Tbsp；清酒 2 Tbsp；糖 1 tsp；姜汁 1 Tbsp；洋葱磨泥/汁 1 Tbsp，可选
  - 预处理：清酒 1 Tbsp；面粉 1 Tbsp，薄薄拍粉

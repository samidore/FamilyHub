steps:
  - 准备：肉块擦干；来源允许以 pork shoulder 替代五花肉，项目使用梅花肉。；调味液全部量好。
  - 厚锅中火加1 tsp油，把肉块各面煎2–3分钟至浅金黄。
  - 加入足量清水和姜，煮开后转小火，先慢炖到肉明显变软；中途撇油。
  - 把肉转入较干净的锅，加入角煮汁；液面接近肉高度，煮开后转小火。
  - 落盖/盖盖留缝，小火继续煮到筷子能轻松插入、肉块仍保持形状。
  - 最后开盖中火，让汁减少到约一半并能薄薄挂肉；不要收到糖浆状。
  - 静置后盛出；孩子份选瘦嫩部分剪小。
  - 完成提示：肉块非常软嫩但不散；汁有光泽、能挂肉且仍可流动。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 梅花肉块：790–900 g，切4–5 cm块
  - 角煮汁：日式高汤 2.5 cups；清酒 1/4 cup；味醂 1/4 cup；糖 1/4 cup；生抽 1/4 cup；姜 6片

steps:
  - 准备：猪脚切4–5 cm块，冲去碎骨；骨渣/血沫明显时先焯2–3分钟并冲净。
  - Instant Pot 选 Sauté，加1 tsp油把肉块分批煎至多面浅褐；盛出。
  - 原锅加入3 cups水或低盐高汤、姜和葱白，彻底刮净锅底；不在压力阶段加入 Finish 调味料。
  - 猪脚放回，锁盖 High Pressure 45分钟，自然泄压15分钟。检查皮筋软糯且筷子可较轻松插入；仍硬时再 High Pressure 8分钟并自然泄压5分钟。
  - 把猪脚夹出；如选择顺手焖配料，先在中性压力汤汁中按硬度煮到所需软度。
  - 按所选 Finish 选项加入晚段调味料并收汁；锅底保留少量流动汁，不要收到发黏发咸。
  - 静置5分钟；孩子份选无骨瘦嫩部分剪小。
  - 完成提示：猪脚软糯但仍成形；汁薄亮且可流动。
  - 安全提示：给孩子只取无骨部分；成人检查骨渣和硬软骨。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪脚：900 g
  - 共享压力液：水或低盐高汤 3 cups；姜 6片；葱白 3段
finish_options:
  - id: red-braise
    label_zh: 红烧
    default: true
    cook_ingredients:
      - 绍兴酒 1/4 cup；生抽 3 Tbsp；蚝油 1 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；八角 1个可省；桂皮 1小段可省；压力汤汁 1/2 cup
    steps:
      - 猪脚已在共享 Instant Pot 基底中软糯。将绍兴酒、生抽、蚝油、老抽、糖、可选香料和少量压力汤汁加入宽锅，中火收至薄亮汁并包裹猪脚；保留少量可流动汁。
  - id: ginger-vinegar
    label_zh: 姜醋
    default: false
    display_name_zh: 姜醋猪脚
    cook_ingredients:
      - 老姜 40 g，切厚片；黑醋 1/3 cup；红糖 1 Tbsp；压力汤汁 1/2 cup
    steps:
      - 猪脚已在共享 Instant Pot 基底中软糯。宽锅中将老姜略煎出香，加入黑醋、红糖和压力汤汁轻煮3–5分钟；猪脚放回翻裹，保留可流动酸甜汁。
  - id: thirteen-spice
    label_zh: 十三香
    default: false
    display_name_zh: 十三香猪蹄
    cook_ingredients:
      - 十三香 1 tsp；生抽 1 Tbsp；糖 1 tsp；压力汤汁 1/2 cup
    steps:
      - 猪脚已在共享 Instant Pot 基底中软糯。将十三香、生抽、糖和压力汤汁加入宽锅，翻动至香料融合、薄薄挂汁。
  - id: adobo
    label_zh: 醋香
    default: false
    display_name_zh: 醋香猪蹄
    cook_ingredients:
      - 米醋 1/4 cup；生抽 1 Tbsp；月桂叶 2片；黑胡椒粒 1 tsp；蒜 3瓣；压力汤汁 1/4 cup
    steps:
      - 猪脚已在共享 Instant Pot 基底中软糯。将米醋、生抽、月桂叶、黑胡椒、蒜和压力汤汁加入宽锅，轻煮3–5分钟让酸香柔和，再薄薄收汁。

steps:
  - 准备：白菜叶与猪肉片交替叠成4–5层；切成约5 cm段。；把叠好的段切面朝上紧密排入锅中；中间到外圈都尽量塞紧。
  - 从锅边倒入日式清汤，不要直接冲散层次；盖盖中大火煮到明显沸腾。
  - 转中小火保持稳定小沸约15分钟；白菜会明显塌下并释放水分。
  - 从中心夹开一组检查，猪肉应全部变色且达到安全温度，白菜梗能轻松咬断。
  - 若锅内汤太多不需要收干；本菜以清汤锅状态上桌。
  - 孩子份先取完全熟的猪肉与软白菜，剪小；成人蘸汁另配。
  - 完成提示：白菜软甜、层次仍可夹起；猪肉完全熟；锅内保留清汤，不收汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 薄切五花肉：680 g
  - 大白菜：1颗，约1.8 kg
  - 日式清汤：日式高汤 5 cups；清酒 2 Tbsp；生抽 1 Tbsp；盐 1/2 tsp；姜 3片

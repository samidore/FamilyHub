steps:
  - 准备：白菜叶与薄切猪肉交替叠成4–5层，切成约5 cm段；将切面朝上紧密排入 Instant Pot 内胆。
  - 从锅边加入2 cups日式清汤，不冲散层次；保留剩余清汤供开盖后调整。
  - 锁盖 High Pressure 1分钟；压力结束立即快速泄压，避免白菜过软。
  - 开盖从中心夹开一组，确认猪肉完全熟、白菜梗能轻松咬断；如肉未熟，使用 Sauté 小火短煮并逐片检查，不再次长时间加压。
  - 若锅内汤量不足或盐味偏浓，加入预留清汤调整；本菜保留清汤锅状态，不收汁。
  - 孩子份先取完全熟的猪肉与软白菜并剪小；成人蘸汁另配。
  - 完成提示：白菜软甜、层次仍可夹起；猪肉完全熟；锅内保留清汤。
  - 安全提示：猪肉片实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 薄切五花肉：680 g
  - 大白菜：1颗，约1.8 kg
  - 日式清汤：日式高汤 5 cups；清酒 2 Tbsp；生抽 1 Tbsp；盐 1/2 tsp；姜 3片
  - 日式清汤 5 cups；压力阶段使用其中 2 cups，开盖后按需补回余下清汤。

cook_ingredients:
  - 软排骨：900 g，切段
  - 短腌：生抽 1 Tbsp；绍兴酒 1 Tbsp
  - 糖醋焖汁：绍兴酒 1 Tbsp；糖 2 Tbsp；老抽 2 tsp；黑醋 1 Tbsp；水 2 cups；姜 8片；葱白 4段

steps:
  - 准备：排骨用短腌抓匀15分钟；表面擦去明显多余水分。；糖、醋、酱油和水量好。
  - 厚锅中大火加1 Tbsp油，排骨分批煎到多面浅褐，盛出。
  - 转中火，下姜葱炒香；加入糖，看到糖开始融化后立刻把排骨回锅翻匀。
  - 加入其余焖汁，煮开后转小火盖盖约30分钟；中途翻一次。
  - 排骨已软嫩后开盖转中大火，持续翻动让水分蒸发。
  - 当汁量剩很少、气泡变大、汁能形成薄亮层紧贴排骨，但锅底仍有少量可流动汁时加入黑醋最后翻匀。
  - 立即关火；孩子份剔骨后剪小。
  - 完成提示：排骨肉能较容易从骨上咬下；糖醋汁薄亮包裹、不成硬糖壳。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

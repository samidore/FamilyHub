    availability: assumed
steps:
  - 处理 soft-pork-ribs；按来源决定是否需要焯水或轻煎。
  - 加入 vinegar / sugar / soy sweet-sour braise; no deep-frying
    和足以完成焖煮的液体；家庭版轻盐、不放辣。
  - 盖锅低火焖至主料达到该菜式要求的软嫩程度；大块肉以质地而不是死守分钟数判断。
  - 临近上桌再调整浓度与盐度；需要收汁时只收至能挂住食材，不做过咸浓缩。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

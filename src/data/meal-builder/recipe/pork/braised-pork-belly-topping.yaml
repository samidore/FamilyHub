steps:
  - 薄切五花肉横切成约1.5 cm宽短条；沸水快速焯1分钟，捞出冲净。
  - 锅中小火加2 tsp油和25 g冰糖，糖开始融化后可加入切碎洋葱/红葱头，炒约1分钟；没有则直接继续。
  - 加五花肉、绍兴酒60 ml、生抽45 ml、老抽30 ml和水475 ml；有香菇或卤蛋可加入，没有不影响成菜。
  - 煮开后转最低火盖盖，按来源路线卤约90分钟，中途偶尔翻动并防止烧干。
  - 肉达到一夹即断、脂肪软糯后，开盖中大火约5分钟收汁；收至能挂勺但仍留足可流动卤汁。
  - 孩子份先取较瘦软肉剪小；成人份再按需加辣椒或白胡椒。
child_serving: 取炖到一夹即断的较瘦部分剪小；本 Recipe 计 Child Protein。
adult_finish: 可另加辣椒油、白胡椒或卤蛋。
substitutions: []
cook_ingredients:
  - 薄切五花肉：450 g，横切短条
  - 来源基础卤汁：绍兴酒 60 ml；生抽 45 ml；老抽 30 ml；冰糖 25 g；水 475 ml
  - 洋葱/红葱头、香菇、卤蛋、八角等：按手头情况可选，不影响 availability

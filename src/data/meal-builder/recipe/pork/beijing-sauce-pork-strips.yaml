steps:
  - 准备：猪里脊逆纹切细丝，加入全部腌料抓匀，静置15分钟。；京酱汁搅匀；葱白丝铺在盘底或另放，孩子若不吃生葱可不配。
  - 炒锅大火预热，加2 tsp油；肉丝迅速摊开并翻炒，颜色由粉转白、约八成熟时盛出。
  - 原锅保持中大火，倒入京酱汁；不断搅拌至开始连续冒泡。
  - 肉丝回锅，快速翻炒30–60秒，让汁均匀包裹。
  - 当酱汁从流动液体变成薄亮层、锅底没有一滩汁时立即关火；不要继续收浓。
  - 盛在葱丝上；孩子份先取肉丝并剪短，成人可再配更多葱丝。
  - 完成提示：肉丝根根分明、嫩而不柴；甜面酱汁均匀挂肉且不成厚浆。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：225 g，切细丝
  - 葱白：3–4根，切5 cm细丝，用于垫底/同食
  - 肉丝腌料：盐 1/4 tsp；绍兴酒 1 tsp；白胡椒 1小撮；玉米淀粉 2 tsp；中性油 1 tsp
  - 京酱汁：水 1/4 cup；甜面酱 / sweet bean sauce 2.5 Tbsp；老抽 1/2 tsp；黑醋 1/4 tsp；糖 1 tsp；生抽 1 Tbsp

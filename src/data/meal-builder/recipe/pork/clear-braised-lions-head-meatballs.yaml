name_zh: 清炖狮子头
name_en: Clear-Braised Lion’s Head Meatballs
tags: [light-seasoning, non-spicy-base, braised, stovetop-nonstick, advance-start, family-shared]
fit:
  hard_rules: pass
  score: 4
  strengths:
    - 与现有家庭食材/厨具兼容，重复使用价值较高。

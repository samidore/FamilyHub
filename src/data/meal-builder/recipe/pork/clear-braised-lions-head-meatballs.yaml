steps:
  - 准备：猪肉与除马蹄外的肉馅调料同一方向搅8–10分钟至明显发黏；有马蹄时加入细丁再搅1–2分钟；没有马蹄也可直接成团。湿手分成4个大丸子；有青菜时洗净备用。
  - 宽锅加入清炖汤底煮到接近沸腾后转小火，液面只保持轻微小泡。
  - 逐个放入丸子；不要让汤猛烈翻滚。盖盖小火炖25–35分钟。
  - 从最大丸子中心测温，达到160°F/71°C；继续小火到丸子明显柔软、多汁。
  - 有青菜时最后加入，按叶菜厚度再煮2–5分钟至软；没有则省略。
  - 最后尝汤，只补必要的盐；孩子份把丸子切开并压成小块。
  - 完成提示：丸子中心熟透、柔软多汁；汤清爽；有青菜时菜已软。
  - 安全提示：绞肉中心达到160°F/71°C。
child_serving: 把炖软的狮子头切开、压成小块再给孩子；不以整颗圆形形状提供。
adult_finish: 孩子份盛出后，成人可另加白胡椒、辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 马蹄：100 g，切细丁；推荐加入，可省略
  - 青菜：300 g；推荐搭配，可省略
  - 狮子头肉馅：鸡蛋 1个；面包糠 25 g；绍兴酒 1 Tbsp；生抽 1 Tbsp；蚝油 1 Tbsp；白胡椒 1/2 tsp；玉米淀粉 1.5 tsp；水 1/4 cup
  - 清炖汤底：水或低盐高汤 4 cups；姜 4片；葱 2段；盐 1/2 tsp，最后调整

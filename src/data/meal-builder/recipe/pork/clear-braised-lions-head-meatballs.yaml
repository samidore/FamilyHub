steps:
  - 准备：猪肉与除马蹄外的肉馅调料同一方向搅8–10分钟至明显发黏；有马蹄时拌入后再搅1–2分钟。湿手分成4个大丸子；青菜洗净备用。
  - 把4 cups清炖汤底和姜葱放入 Instant Pot；小心放入肉丸，保持完整并确认未超过锅内安全装载线。
  - 锁盖 High Pressure 9分钟，自然泄压10分钟。测最大肉丸中心达到160°F/71°C且肉丸柔软多汁；未达温时再 High Pressure 2分钟并快速泄压。
  - 取出肉丸暂放一旁；用 Instant Pot Sauté 将汤恢复轻沸。加入青菜煮2–5分钟至软，最后调盐；无青菜则省略。
  - 肉丸放回热汤中，不再长时间煮；孩子份切开并压成小块。
  - 完成提示：肉丸中心熟透、柔软多汁；汤清爽；青菜柔软但不烂。
  - 安全提示：绞肉中心达到160°F/71°C。
child_serving: 把炖软的狮子头切开、压成小块再给孩子；不以整颗圆形形状提供。
adult_finish: 孩子份盛出后，成人可另加白胡椒、辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 马蹄：100 g，切细丁；推荐加入，可省略
  - 青菜：300 g；推荐搭配，可省略
  - 狮子头肉馅：鸡蛋 1个；面包糠 25 g；绍兴酒 1 Tbsp；生抽 1 Tbsp；蚝油 1 Tbsp；白胡椒 1/2 tsp；玉米淀粉 1.5 tsp；水 1/4 cup
  - 清炖汤底：水或低盐高汤 4 cups；姜 4片；葱 2段；盐 1/2 tsp，最后调整
  - 压力阶段液体：清炖汤底 4 cups；马蹄和青菜均在泄压后处理。

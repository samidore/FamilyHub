steps:
  - 准备：猪肉与除马蹄外的肉馅调料同一方向搅8–10分钟至明显发黏；加入马蹄再搅1–2分钟。；湿手分成4个大丸子；青菜洗净。
  - 宽锅加入清炖汤底煮到接近沸腾后转小火，液面只保持轻微小泡。
  - 逐个放入丸子；不要让汤猛烈翻滚，否则丸子容易散。盖盖小火炖25–35分钟。
  - 丸子明显变紧实并浮起后，从最大丸子中心测温；达到160°F/71°C再继续下一步。
  - 加入青菜，按叶菜厚度再煮2–5分钟至软而仍有形。
  - 最后尝汤，只补必要的盐；孩子份把丸子切成小块并配软菜。
  - 完成提示：丸子定型、中心熟透且仍多汁；汤保持清爽；青菜软而不黄烂。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 马蹄：100 g，切细丁
  - 青菜：300 g，可用当前 recipe 对应叶菜
  - 狮子头肉馅：鸡蛋 1个；面包糠 25 g；绍兴酒 1 Tbsp；生抽 1 Tbsp；蚝油 1 Tbsp；白胡椒 1/2 tsp；玉米淀粉 1.5 tsp；水 1/4 cup
  - 清炖汤底：水或低盐高汤 4 cups；姜 4片；葱 2段；盐 1/2 tsp，最后调整

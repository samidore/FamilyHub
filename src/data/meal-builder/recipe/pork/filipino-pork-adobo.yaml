steps:
  - 准备：猪肩切4–5 cm块并彻底擦干；所有卤汁量好。
  - 厚底锅大火加油，猪肉分批煎，每面约1–2分钟形成浅褐色外壳；不要把锅挤满。
  - 全部猪肉回锅，加入生抽、米醋、椰奶、月桂叶和蒜；煮开后立即转到极小火。
  - 盖盖保持bare simmer，炖约2–2.5小时；每30分钟检查一次液体和软嫩度。
  - 猪肉很软但仍能保持块状时盛出；酱汁撇去明显浮油。
  - 酱汁中火浓缩到约2/3 cup、能薄挂勺；加入预留2 tsp米醋，尝味后再决定是否需要更多，避免再加盐。
  - 猪肉回锅裹汁1–2分钟即关火；孩子份少带浓汁。
  - 完成提示：猪肩叉子可轻松插入但仍保持块状；酱汁浓缩后薄挂勺，醋味明显但不生冲。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 梅花肉/猪肩：900 g，切4–5 cm块
  - Adobo 卤汁（Serious Eats 原方约2/3量）：中性油 2 tsp；生抽 1/3 cup；米醋 1/3 cup，另备2 tsp最后校酸；椰奶 2/3 cup；月桂叶 3片；蒜 5–6瓣，拍裂

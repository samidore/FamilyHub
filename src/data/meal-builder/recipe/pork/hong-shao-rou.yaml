    role: main-protein
finish_options:
  - id: red-braise
    label_zh: 红烧
    default: true
    cook_ingredients:
      - 绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp
    steps:
      - 用绍兴酒、生抽、老抽和糖调成红烧汁，肉软后加入宽锅中收成薄亮汁。
  - id: kakuni
    label_zh: 角煮
    default: false
    display_name_zh: 日式角煮
    cook_ingredients:
      - 清酒 1/4 cup；味醂 1/4 cup；生抽 1/4 cup
    steps:
      - 用清酒、味醂和生抽替换部分红烧汁，最后保留薄亮汤汁。
  - id: thit-kho
    label_zh: 越式
    default: false
    display_name_zh: 越式卤肉
    cook_ingredients:
      - 椰糖 2 Tbsp；椰水 2 cups；鱼露 1 Tbsp
    steps:
      - 先炒糖上色，再用椰水焖至软嫩；鱼露最后少量调味。
  - id: adobo
    label_zh: 醋香
    default: false
    display_name_zh: 醋香卤肉
    cook_ingredients:
      - 米醋 1/4 cup；月桂叶 2片；黑胡椒粒 1 tsp
    steps:
      - 以醋和酱油同煮，开盖收汁前确认酸香柔和、肉已软透。
steps:
  - 准备：猪肩肉块切约4–5 cm大块；薄切五花肉按现有厚度整理。若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净；把所选 Finish 的调味液量好放在手边。
  - 猪肩肉块放入 Instant Pot，加基础焖煮液；高压25–30分钟，自然泄压10分钟。薄切五花肉不需高压，宽锅煎出脂香后加基础焖煮液，盖盖小火焖20–30分钟至软嫩。
  - 将肉和少量汤汁转入宽锅；若选择了顺手焖配料，按硬度加入，焖到软而不散。
  - 肉已软嫩后加入所选 Finish 的调味液，中大火翻动收汁；每2–3分钟翻一次，防止粘底。
  - 当汁量约剩最初的1/4、从水状变成能在肉表面形成薄亮膜，锅底仍有少量可流动汁时关火；不要收到发黏发咸。
  - 静置5分钟再盛；孩子份选瘦嫩、无骨部分剪小。
  - 完成提示：肉块软嫩但仍成形；汁能薄薄挂肉且锅底仍有少量流动汁。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪肩肉块 / 薄切五花肉：900 g；任选一种
  - 基础焖煮液：水或低盐高汤 2 cups；姜 6片；葱白 3段；八角 1个，可省

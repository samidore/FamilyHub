steps:
  - 猪肝切约4–5 mm薄片，快速冲洗后彻底沥干；加1 Tbsp生抽、1 Tbsp绍兴酒和2 tsp玉米淀粉抓匀10分钟。
  - 炒锅大火烧到很热，加2 tsp油；先下姜片和葱白约10秒。
  - 猪肝单层下锅，快速翻炒；量大时分两批。
  - 表面全部变色后继续短炒，切开最厚一片确认中心完全熟、无生红或冷生部分；不要为了焦色继续久炒。
  - 加葱绿和少量盐，翻10–15秒立即关火。
child_serving: 本 Recipe 不计 Child Protein。
adult_finish: 成人可另加黑胡椒、辣椒或更多葱姜。
substitutions: []
cook_ingredients:
  - 猪肝：400–450 g，切4–5 mm薄片
  - 腌料：生抽 1 Tbsp；绍兴酒 1 Tbsp；玉米淀粉 2 tsp
  - 姜：6片；葱：3根；中性油 2 tsp；盐少量

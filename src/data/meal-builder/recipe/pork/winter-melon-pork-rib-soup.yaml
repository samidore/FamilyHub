steps:
  - 准备：排骨焯水2–4分钟，温水冲去浮沫和碎骨；所选汤料切成适合汤煮的一口大小，易熟材料后下。
  - 排骨放入 Instant Pot，加入6 cups清水/低盐高汤、姜和葱；锁盖 High Pressure 22分钟，自然泄压15分钟。检查肉明显软化、仍能成形；不够软时再加压5分钟。
  - 开盖撇去浮沫和明显浮油；按汤料需要补入预留热水/高汤。先放根茎或玉米，用 Sauté 小火煮至筷子可穿透；叶菜、番茄等最后10–15分钟再放。
  - 所有材料达到各自软度后再分次加盐；白胡椒可省。
  - 孩子份先取无骨肉和软配料，再加少量清汤。
  - 完成提示：汤保持清亮；排骨软嫩；配料能用筷子穿透但仍保持完整。
  - 安全提示：孩子份去骨并检查碎骨。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 软排骨：900 g
  - 所选汤料（可省略或按 Option 添加）：300–450 g
  - 清汤底：水 2.0 L；姜 5片；葱白 2段；盐 1–1.5 tsp，最后分次加；白胡椒 1小撮，可省
  - 压力阶段使用清汤底中的水 6 cups、姜和葱；预留其余水及所选汤料供泄压后调整。

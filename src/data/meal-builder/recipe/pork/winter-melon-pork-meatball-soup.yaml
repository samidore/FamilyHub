steps:
  - 准备：肉馅与全部丸子调味同一方向搅8–10分钟至发黏，冷藏10–15分钟；冬瓜切2.5 cm块。
  - 将4 cups高汤和2 cups水放入 Instant Pot。湿手挤出约3 cm肉丸，逐个放入热液体中。
  - 锁盖 High Pressure 4分钟，自然泄压5分钟；从最大肉丸中心确认160°F/71°C，未达温时用 Sauté 轻煮并复测。
  - 用 Instant Pot Sauté 加入冬瓜，保持轻沸8–12分钟至半透明且筷子可穿透；不要把冬瓜长时间加压煮烂。
  - 尝汤后再决定是否补盐；撇去明显浮油，孩子份先取肉丸和软冬瓜。
  - 完成提示：肉丸熟透仍多汁；冬瓜半透明软嫩但不碎；汤清爽不过咸。
  - 安全提示：绞肉中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 冬瓜：450 g，去皮切2.5 cm块
  - 低盐高汤：4 cups
  - 水：2 cups
  - 丸子调味：水 2 Tbsp；生抽 2.5 Tbsp；绍兴酒 2 Tbsp；芝麻油 1 tsp；白胡椒 1/2 tsp；糖 1/2 tsp；蛋白 1个；姜末 1 Tbsp；葱末 1根；盐 1/4 tsp
  - 压力阶段使用低盐高汤 4 cups + 水 2 cups；冬瓜泄压后加入。

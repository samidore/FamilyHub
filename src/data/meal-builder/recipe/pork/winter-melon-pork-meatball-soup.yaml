steps:
  - 准备：肉馅与全部丸子调味同一方向搅8–10分钟至明显发黏；冷藏10–15分钟更好成形。；冬瓜切均匀块。
  - 汤锅加入高汤和水煮开，转中小火保持轻沸。
  - 湿手或用勺挤出直径约3 cm丸子，逐个下锅；下完后不要立刻大力搅动。
  - 丸子浮起后再煮3–4分钟；从最大的一个中心确认160°F/71°C。
  - 加入冬瓜，中火煮到冬瓜从白色变半透明、筷子能穿透，约8–12分钟。
  - 尝汤后再决定是否补盐；撇去明显浮油，孩子份先取丸子和软冬瓜。
  - 完成提示：丸子熟透仍多汁；冬瓜半透明软嫩但不碎；汤清爽不过咸。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 冬瓜：450 g，去皮切2.5 cm块
  - 低盐高汤：4 cups
  - 水：2 cups
  - 丸子调味：水 2 Tbsp；生抽 2.5 Tbsp；绍兴酒 2 Tbsp；芝麻油 1 tsp；白胡椒 1/2 tsp；糖 1/2 tsp；蛋白 1个；姜末 1 Tbsp；葱末 1根；盐 1/4 tsp

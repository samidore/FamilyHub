steps:
  - 准备：茄子切条后立即烹调；不预油炸。；轻蒜香汁完全混匀。
  - 不粘锅中大火加2 tsp油，下茄子单层/分批煎1–2分钟，让切面出现浅色焦点。
  - 全部茄子回锅，加3 Tbsp水，立即盖盖转中火焖3–5分钟；开盖时茄子应明显变软。
  - 把茄子推到一侧或暂盛出；空处加1 tsp油，下猪绞肉压散炒到完全变色。
  - 肉和茄子合锅，倒入轻蒜香汁；中大火轻翻1–2分钟。
  - 茄子软到筷子可轻松穿透、汁薄挂表面且锅底不积水时关火。
  - 孩子份取最软茄子和完全熟肉末。
  - 完成提示：茄子软润无硬芯但未吸满油；肉末熟透；蒜香汁薄挂。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：300 g
  - 茄子：450 g，切约1.5×5 cm条
  - 轻蒜香汁：生抽 1 Tbsp；蚝油 1 tsp；糖 1/2 tsp；水 1/3 cup；玉米淀粉 1 tsp；蒜末 2瓣

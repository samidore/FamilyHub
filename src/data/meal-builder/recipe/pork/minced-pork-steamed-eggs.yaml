steps:
  - 准备：肉末与腌料拌匀；铺在浅盘底部。；鸡蛋打匀，与1.5 cups温水先混匀；追求更嫩可增加到2 cups。过筛一次可减少气泡。
  - 蒸锅水先烧开；肉末盘上锅大火蒸3–5分钟，直到肉末约八成熟。
  - 转小火，让锅内只保持稳定蒸汽；把蛋液轻轻倒在肉末上。
  - 盖盘/留小缝防滴水，低火蒸8–10分钟；中心仍像水一样晃动则继续1–2分钟。
  - 从肉末最厚处确认达到160°F/71°C；蛋羹中心应凝固但仍轻微颤动。
  - 离火静置2分钟；孩子份直接取软蛋羹与肉末，成人可滴少量生抽。
  - 完成提示：蛋羹表面平、中心凝固但轻颤；肉末完全熟，没有水状生蛋液。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：140 g
  - 鸡蛋：4个
  - 温水：1.5–2 cups，根据想要的嫩度
  - 肉末腌料：玉米淀粉 1 Tbsp；蚝油 1 Tbsp；盐 1/4 tsp；白胡椒 1小撮；水 2 Tbsp；中性油 1 tsp
  - 蛋液调味：盐 1/2 tsp；生抽 1 tsp，出锅后可选

steps:
  - 准备：肉片与短腌料抓匀15分钟；蛋衣搅匀。；塌汁预先混匀。
  - 肉片逐片薄裹蛋衣；不粘锅中火加1 Tbsp油，单层排入。
  - 第一面蛋衣凝固并浅金黄后翻面；第二面也定型，分批完成。
  - 把全部肉片平铺回锅，沿锅边倒入塌汁，转中小火。
  - 盖盖焖2–3分钟，让肉片熟透并吸汁；开盖轻晃锅。
  - 汁量剩薄薄一层、蛋衣软嫩而不泡烂时关火，静置3分钟。
  - 完成提示：蛋衣完整软嫩；肉片熟透；锅底只留薄薄鲜汁，不是汤。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪里脊：340 g，切约5 mm片
  - 鸡蛋：2个
  - 肉片短腌：生抽 2 tsp；绍兴酒 1 tsp；盐 1/4 tsp；玉米淀粉 1 Tbsp
  - 蛋衣：鸡蛋 2个；玉米淀粉 1 Tbsp
  - 塌汁：水或低盐高汤 1/3 cup；生抽 1 Tbsp；绍兴酒 1 Tbsp；糖 1/2 tsp；芝麻油 1/2 tsp

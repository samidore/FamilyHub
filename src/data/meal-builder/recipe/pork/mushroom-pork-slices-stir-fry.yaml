  - id: light-sauce
    label_zh: 清炒
    default: true
    cook_ingredients: [蚝油 2 tsp；白胡椒少许]
    steps: [用轻盐炒汁快速裹匀肉片和所选蔬菜，保留薄亮汁后关火。]
steps:
  - 准备：猪肉逆纹切约3 mm薄片并腌10–15分钟；所选蔬菜切成能在数分钟内熟的大小，炒汁先搅匀。
  - 炒锅大火预热，加1 Tbsp油；肉片摊成单层，炒到约七八成熟立即盛出。
  - 原锅下蔬菜炒到刚断生，肉片回锅，倒入炒汁快速翻炒30–60秒。
  - 汁变薄亮且锅底不积水时关火；孩子份剪短肉片。
  - 完成提示：肉片嫩、无生中心；蔬菜刚熟仍有形。
  - 安全提示：整块猪肉可测处达到145°F/63°C并静置3分钟；薄肉片实际做至无生肉色。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可另加辣椒油或更重调味。
substitutions: []
cook_ingredients:
  - 猪里脊/薄切猪肉：340 g，任选一种
  - 所选蔬菜：300–450 g
  - 肉片腌料：水 2 Tbsp；生抽 2 tsp；绍兴酒 2 tsp；玉米淀粉 2 tsp；中性油 1 tsp
  - 家庭轻盐炒汁：水或低盐高汤 3 Tbsp；生抽 2 tsp；糖 1/2 tsp；玉米淀粉 1 tsp

steps:
  - 准备：鲜香菇切小丁；姜末、葱/红葱头碎备好；卤汁量好。
  - Instant Pot 选 Sauté，加1 Tbsp油把葱/红葱头炒软、边缘金黄；加入猪绞肉压散炒至完全变色，再加入鲜香菇炒2分钟。
  - 加入肉燥卤汁中1 1/2 cups水并刮净锅底；锁盖 High Pressure 12分钟，自然泄压10分钟。
  - 开盖检查绞肉中心达到160°F/71°C；切换 Sauté，不盖盖翻动10–20分钟至肉燥汁浓而仍可流动。需要时少量加入预留卤汁调味，勿收至油肉分离或过咸。
  - 每碗熟饭只浇足够湿润米饭的肉燥和汁；孩子份先剪碎香菇块。
  - 完成提示：肉末柔软、香菇熟透；卤汁浓而仍可流动，能渗入米饭而不是胶状。
  - 安全提示：绞肉中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 鲜香菇：150 g，切小丁
  - 米饭：3碗熟饭
  - 肉燥卤汁：绍兴酒 3 Tbsp；糖 1 Tbsp；生抽 2 Tbsp；老抽 1 Tbsp；蚝油 1 Tbsp；白胡椒 1/2 tsp；五香粉 1/4 tsp；水 2 cups
  - 肉燥卤汁水 1 1/2 cups 用于压力阶段；预留其余卤汁供泄压后调浓淡。

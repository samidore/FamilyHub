steps:
  - 先准备米饭；处理 ground-pork 与 fresh-shiitake。
  - 用小锅/不粘锅按 soy / shallot-or-scallion / five-spice style braising profile,
    light household salt 做成浇头，保持清淡并控制汁量。
  - 把浇头连同适量汁放在米饭上；含蛋的版本保持适合家庭的熟度。
  - 孩子份优先选择软嫩主料并剪小，成人后味分开。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

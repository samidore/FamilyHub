steps:
  - 准备：鲜香菇切小丁；本家庭不用干香菇，因此不保留泡发步骤。；姜末1 Tbsp、葱/红葱头碎约1 cup；卤汁量好。
  - 小锅中火加1 Tbsp油，下葱/红葱头炒到软、边缘开始金黄。
  - 加入猪绞肉，压散炒到完全变色并有少量褐色点；加入鲜香菇再炒2分钟。
  - 加入全部卤汁，煮开后转小火，盖盖留缝炖30–45分钟。
  - 开盖转中火，让水分缓慢减少；每几分钟搅一次防粘底。
  - 当肉燥汁由稀汤变成能舀起、仍有流动性但不水汪汪时关火；不要收到油肉分离且过咸。
  - 每碗饭只浇足够湿润米饭的肉燥和汁；孩子份先剪碎香菇块。
  - 完成提示：肉末柔软、香菇熟透；卤汁浓而仍可流动，能渗入米饭而不是胶状。
  - 安全提示：绞肉或含绞肉馅中心达到160°F/71°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪绞肉：450 g
  - 鲜香菇：150 g，切小丁
  - 米饭：3碗熟饭
  - 肉燥卤汁：绍兴酒 3 Tbsp；糖 1 Tbsp；生抽 2 Tbsp；老抽 1 Tbsp；蚝油 1 Tbsp；白胡椒 1/2 tsp；五香粉 1/4 tsp；水 2 cups

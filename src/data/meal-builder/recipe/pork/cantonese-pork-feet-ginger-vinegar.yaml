steps:
  - 准备：猪脚冷水下锅煮开3–5分钟，捞出冲净；尽量去除骨渣。；姜拍裂后干锅或极少油炒到表面略干；鸡蛋煮熟剥壳。
  - 厚锅加入姜、甜醋和黑醋，煮开后转小火10分钟，让姜味进入醋汁。
  - 加入焯洗猪脚和绍兴酒；液体应基本覆盖，必要时换更小的锅而不是大量加水。
  - 小火盖盖炖到猪脚皮和筋开始变软；中途每20–30分钟翻动一次。
  - 加入熟鸡蛋继续小火煮，让鸡蛋上色；猪脚最终应筷子能轻易穿透皮肉连接处。
  - 尝汁后再决定是否需要盐；本菜以酸甜姜醋汁为主，不额外收成浓稠糖浆。
  - 孩子若食用，只取去骨软肉；姜醋浓汁少量。
  - 完成提示：猪脚皮筋软糯、肉易脱骨；姜醋汁仍为可舀液体、酸甜明显但不焦糖化。
  - 安全提示：整块/整肌猪肉可测处达到145°F/63°C并静置3分钟；给孩子的薄片/绞碎菜实际做至无生肉色。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪脚：约1 kg，斩块
  - 鸡蛋：6个，煮熟剥壳
  - 姜：450 g，去皮拍裂
  - 姜醋汁：甜醋 1200 mL；黑醋 120 mL；绍兴酒 2 Tbsp；盐 少量，最后再判断

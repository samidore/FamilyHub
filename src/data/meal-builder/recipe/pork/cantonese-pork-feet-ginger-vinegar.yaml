steps:
  - 准备：猪脚焯水3–5分钟并冲净骨渣；姜拍裂后干锅或极少油炒至表面略干；鸡蛋煮熟剥壳。
  - 猪脚放入 Instant Pot，加入1 1/2 cups水和绍兴酒；锁盖 High Pressure 45分钟，自然泄压15分钟。检查皮筋已软糯、筷子能轻易穿透皮肉连接处；不够软时再 High Pressure 8分钟并自然泄压5分钟。
  - 同时在厚锅中把姜、甜醋和黑醋煮开，转小火浸煮10分钟；不要把大量醋液倒入压力锅。
  - 将已软的猪脚及少量压力汁加入姜醋锅；加入熟鸡蛋，小火浸煮15–20分钟上色入味，不再长时间炖软肉。
  - 尝汁后再决定是否需要盐；保留可舀液体，不收成浓稠糖浆。
  - 孩子若食用，只取去骨软肉并少带姜醋浓汁。
  - 完成提示：猪脚皮筋软糯、肉易脱骨；姜醋汁仍为可舀液体，酸甜明显。
  - 安全提示：给孩子的份量去骨并检查碎骨。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 猪脚：约1 kg，斩块
  - 鸡蛋：6个，煮熟剥壳
  - 姜：450 g，去皮拍裂
  - 姜醋汁：甜醋 1200 mL；黑醋 120 mL；绍兴酒 2 Tbsp；盐 少量，最后再判断
  - 压力阶段另用水 1 1/2 cups；甜醋 1200 mL、黑醋 120 mL 和姜 450 g 留作泄压后的姜醋浸煮。

steps:
  - 洗米并处理 carrot, onion 及配料；准备 cumin / onion / carrot / lamb-fat-aroma profile
    with restrained added oil。
  - 需要先煸香/轻煎的配料用少量油处理，然后与米同锅。
  - 按引用来源的锅具路线把米饭焖熟；家庭版若改变米量/锅具，不写死未经测试的水比。
  - 关火后按需要焖放，再轻轻拌匀上桌。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

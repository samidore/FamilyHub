steps:
  - 米洗净沥干；羊肉切2.5 cm块；胡萝卜、洋葱切好。Instant Pot Sauté 加油将羊肉分批煎至多面褐色。
  - 加入水或低盐高汤1 cup、盐、生抽和孜然，刮净锅底；锁盖 High Pressure 18分钟，自然泄压10分钟。检查羊肉软熟；不够软时再加压5分钟并自然泄压8分钟。
  - 取出羊肉及压力汁暂放；内锅加入洋葱炒软，再加胡萝卜炒2分钟。加入米和预留压力汁，再补水/高汤至原方总量2 cups。
  - 把羊肉铺回米面，不搅到底；锁盖 High Pressure 4分钟，自然泄压10分钟。开盖翻松，确认米无硬芯、胡萝卜软甜、羊肉软熟；若米仍硬，盖上焖5分钟。
  - 完成提示：米饭熟而松、无游离水；羊肉软熟；胡萝卜软甜。
  - 安全提示：整块羊肉达到至少145°F/63°C并静置3分钟；炖至所需软度。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1 cup
  - 羊肩肉块：450 g，切2.5 cm块
  - 胡萝卜：225 g，粗丝/条
  - 洋葱：1/2个，约100 g，切丝
  - 抓饭调味：水或低盐高汤总量2 cups；盐1 tsp；生抽1 tsp；孜然粉1/2 tsp；中性油1.5 Tbsp；先以1 cup液体压力煮羊肉，余量供米饭阶段

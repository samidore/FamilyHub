steps:
  - 准备：米洗净沥干；羊肉切块；胡萝卜洋葱切好。；水量按来源半份起始值，若家庭米种吸水不同以后再校准。
  - 厚锅中大火加油，羊肉分批煎到多面褐色。
  - 加入洋葱炒软，再加胡萝卜炒2分钟；加入盐、生抽、孜然。
  - 倒入水/高汤煮开，转小火先煮羊肉15–20分钟。
  - 把米均匀撒在表面，不搅到底；液体应略高于米面。
  - 盖盖最小火煮到米熟且水被吸收；关火焖10分钟。
  - 开盖从底部翻松，确认羊肉软熟、米无硬芯。
  - 完成提示：米饭熟而松、无游离水；羊肉软熟；胡萝卜软甜。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 米：1 cup
  - 羊肩肉块：450 g，切2.5 cm块
  - 胡萝卜：225 g，粗丝/条
  - 洋葱：1/2个，约100 g，切丝
  - 抓饭调味：水或低盐高汤 2 cups；盐 1 tsp；生抽 1 tsp；孜然粉 1/2 tsp；中性油 1.5 Tbsp

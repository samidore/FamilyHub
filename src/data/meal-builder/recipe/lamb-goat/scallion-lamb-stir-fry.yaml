steps:
  - 准备：羊肉薄片与短腌抓匀10–15分钟。；葱切5 cm段，葱白和葱绿分开；轻汁混匀。
  - 炒锅大火烧热，加1 Tbsp油；羊肉分批单层下锅，快速翻炒到边缘变色、约八成熟时盛出。
  - 原锅下葱白，大火炒20–30秒到开始出香，不炒焦。
  - 羊肉回锅，倒入葱爆轻汁，持续翻20–30秒。
  - 加入葱绿，再翻10–15秒；肉片无冷生中心、锅底汁基本被薄薄吸附时关火。
  - 孩子份先盛出并剪短肉片；成人可另加白胡椒/辣椒。
  - 完成提示：羊肉片嫩、葱仍有香气和形状；锅底只有薄薄汁。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅羊肉片：450 g
  - 羊肉短腌：生抽 1 Tbsp；绍兴酒 1 Tbsp；玉米淀粉 1 tsp；中性油 1 tsp
  - 葱爆轻汁：生抽 1 Tbsp；绍兴酒 1 Tbsp；糖 1/2 tsp；水 2 Tbsp

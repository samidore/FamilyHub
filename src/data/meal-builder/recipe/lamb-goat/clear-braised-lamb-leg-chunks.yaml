steps:
  - 羊腿肉块冷水下锅煮开2–3分钟，捞出用温水冲净浮沫。
  - Instant Pot 加入500–700 g羊腿肉、清水或低盐高汤6 cups、姜4–6片和葱2段；锁盖 High Pressure 30分钟，自然泄压15分钟。
  - 取一块用筷子测试；须柔软且可夹开。不够软时再加压6分钟并自然泄压10分钟；肉达到软度后分次加盐，撇掉明显浮油。
  - 孩子份去掉明显筋膜，剪小并加少量清汤保持湿润。
  - 完成提示：羊肉软嫩但仍成形，汤清亮可舀。
child_serving: 只取炖到容易夹断的软肉，剪小；本 Recipe 计入 Child Protein。
adult_finish: 成人可另加白胡椒、香菜或辣椒。
substitutions: []
cook_ingredients:
  - 羊腿肉块：500–700 g
  - 压力清汤底：水或低盐高汤6 cups；姜4–6片；葱白2段；盐最后分次加

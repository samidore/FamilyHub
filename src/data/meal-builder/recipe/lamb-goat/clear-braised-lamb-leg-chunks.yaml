steps:
  - 羊腿肉块冷水下锅，煮开2–3分钟，捞出用温水冲净浮沫。
  - 汤锅加入500–700 g羊腿肉、约2 L水、姜4–6片和葱2段；大火煮开后再次撇净浮沫。
  - 转小火保持零星小泡，盖盖约60分钟开始检查。
  - 取一块用筷子测试；不能轻松夹断时继续每次15–20分钟，水位过低只补热水。
  - 肉达到柔软后再加盐，煮5分钟；撇掉明显浮油。
  - 孩子份去掉明显筋膜，剪小并加少量清汤保持湿润。
child_serving: 只取炖到容易夹断的软肉，剪小；本 Recipe 计入 Child Protein。
adult_finish: 成人可另加白胡椒、香菜或辣椒。

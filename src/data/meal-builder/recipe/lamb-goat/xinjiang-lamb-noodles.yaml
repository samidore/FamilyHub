steps:
  - 准备：羊肉薄片与短腌抓匀10–15分钟。；葱切5 cm段，葱白和葱绿分开；轻汁混匀。
  - 羊腿肉切薄片/小条，与羊肉短腌拌10–15分钟；洋葱、甜椒切条。
  - 面条另锅煮到刚熟，沥干后分3碗。
  - 炒锅大火炒羊肉到约八成熟盛出；原锅炒洋葱和甜椒到边缘变软。
  - 加入番茄（如使用）和1/2 cup水，煮2–3分钟形成能拌面的薄汁；羊肉回锅，加孜然和葱爆轻汁。
  - 羊肉熟透、汁仍可流动时关火；连汁浇面，不收成干炒。
  - 孩子份剪短面条和羊肉，成人辣椒另加。
  - 完成提示：羊肉嫩、洋葱甜椒熟；有足够番茄/孜然薄汁拌面，面条不泡烂。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊腿肉块：900 g
  - 洋葱：300–450 g
  - 甜椒：300–450 g
  - 面条：450 g 鲜/熟面或3人份干面
  - 羊肉短腌：生抽 1 Tbsp；绍兴酒 1 Tbsp；玉米淀粉 1 tsp；中性油 1 tsp
  - 葱爆轻汁：生抽 1 Tbsp；绍兴酒 1 Tbsp；糖 1/2 tsp；水 2 Tbsp
  - 拌面番茄汁：番茄 2个，约300 g，若 Starter 有；水 1/2 cup；孜然粉 1 tsp

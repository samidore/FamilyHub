steps:
  - 羊蝎子冷水焯2–4分钟，温水冲去浮沫和碎骨；如加蔬菜，切成汤用大小并将易熟材料留到后放。
  - Instant Pot 加入羊蝎子900 g、清水或低盐高汤6 cups、姜5片和葱白2段；锁盖 High Pressure 42分钟，自然泄压20分钟。检查肉软嫩并仍能成形；不够软时再加压8分钟、自然泄压10分钟。
  - 开盖撇去明显浮油；加入无额外蔬菜，或按所选菜料硬度用 Sauté 小火煮：冬瓜/山药10–15分钟，萝卜/土豆15–25分钟，易熟菜最后10分钟加入。
  - 肉与配料达到各自软度后分次加盐；白胡椒可省。孩子份先取无骨肉和软配料，再加少量清汤。
  - 完成提示：汤保持清亮；羊蝎子软嫩；配料熟而仍保持完整。
  - 安全提示：孩子份去骨并检查碎骨。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊蝎子：900 g
  - 压力清汤底：水或低盐高汤6 cups；姜5片；葱白2段；盐1–1.5 tsp最后分次加；白胡椒1小撮可省
  - 可选汤料按原 Option 选择，泄压后加入

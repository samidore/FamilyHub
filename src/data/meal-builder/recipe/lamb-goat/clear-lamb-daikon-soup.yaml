steps:
  - 羊腿肉块或带骨山羊件冷水焯2–4分钟，温水冲去浮沫和碎骨；所选汤料切成一口大小，易熟材料后下。
  - Instant Pot 加入所选肉、清水或低盐高汤6 cups、姜5片和葱白2段；羊腿 High Pressure 32分钟、自然泄压15分钟；带骨山羊件 High Pressure 42分钟、自然泄压20分钟。
  - 检查肉明显软化；不够软时再加压8分钟并自然泄压10分钟。开盖撇浮沫与浮油，加入根茎或玉米，用 Sauté 小火煮至筷子可穿透；叶菜、番茄最后10–15分钟加入。
  - 肉与配料均软嫩后再分次加盐；白胡椒可省。孩子份先取无骨肉和软配料，再加少量清汤。
  - 完成提示：汤保持清亮；肉软嫩；配料可被筷子穿透但仍保持完整。
  - 安全提示：孩子份去骨并检查碎骨。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊腿肉块或带骨山羊件：900 g，任选一种
  - 所选汤料（可省略或按 Option 添加）：300–450 g，泄压后加入
  - 压力清汤底：水或低盐高汤6 cups；姜5片；葱白2段；盐1–1.5 tsp最后分次加；白胡椒1小撮可省

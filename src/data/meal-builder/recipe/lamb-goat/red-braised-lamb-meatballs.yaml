steps:
  - 羊肉末加入鸡蛋、玉米淀粉、生抽、绍兴酒和姜葱水，沿同一方向搅至发黏并静置5分钟；湿手分成约12个丸子。
  - Instant Pot Sauté 加1 tsp油，将肉丸分批轻煎至外层定型浅褐。加入水或低盐高汤1 cup、生抽、老抽、绍兴酒、糖、姜和葱，刮净锅底。
  - 锁盖 High Pressure 5分钟，自然泄压5分钟后快速泄压。最大肉丸中心须达到160°F/71°C；未达温时用 Sauté 小火煮并每2分钟复测。
  - 用 Instant Pot Sauté 收汁3–5分钟，轻推肉丸至薄亮挂汁且锅底仍留少量可流动汁。
  - 静置2–3分钟；孩子份取出后切小块或压开。
  - 完成提示：肉丸中心熟透，切开仍湿润柔软；外层不焦硬，红烧汁仍可流动。
  - 安全提示：绞肉中心达到160°F/71°C。
child_serving: 把丸子切开或压成小块后再给孩子；基础锅不加辣，孩子份少带汁。
adult_finish: 孩子份盛出后，成人可另加辣椒油、白胡椒或少量额外生抽。
substitutions: []
cook_ingredients:
  - 羊肉末：500 g
  - 丸子肉馅：鸡蛋1个；玉米淀粉1 Tbsp；生抽1 Tbsp；绍兴酒1 Tbsp；姜葱水3 Tbsp
  - 压力红烧汁：水或低盐高汤1 cup；生抽1.5 Tbsp；老抽1 tsp；绍兴酒1 Tbsp；糖1 tsp；姜3片；葱白2段
  - 煎制定型：食用油1 tsp

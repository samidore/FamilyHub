steps:
  - 羊肉末放大碗；加入鸡蛋、玉米淀粉、生抽、绍兴酒和姜葱水。沿同一方向搅2–3分钟，直到肉馅明显发黏、提起筷子时能抱团。静置5分钟让淀粉吸水。
  - 双手蘸水，把肉馅分成约12个小丸子；只需轻轻滚圆，不要反复挤压得太紧。
  - 铁锅或宽煎锅中火加1 tsp油。丸子单层放入，先静置约2分钟让底部定型，再轻轻翻面；共煎4–5分钟，只把外层煎到定型和浅褐，不要求此时中心熟透。
  - 沿锅边加入红烧汁，煮到轻沸后立刻转小火。盖盖焖12–15分钟，中途轻轻翻一次，让丸子均匀入味。
  - 从最大的一颗中心测温；达到160°F/71°C后即可进入收汁。未到温度则继续小火焖，并每2分钟复查一次。
  - 开盖转中火收汁3–5分钟，期间轻推丸子避免粘底；收到汁从水状变成能薄薄挂在丸子表面、锅底仍留少量可流动汁时关火，不要收到发黏发咸。
  - 静置2–3分钟。孩子份取出后切成小块或压开，少带一点汁；成人需要更重口味时再单独加辣椒油或白胡椒。
  - 完成提示：丸子中心熟透，切开仍湿润柔软；外层不焦硬；红烧汁能薄薄挂丸子但仍可流动。
child_serving: 把丸子切开或压成小块后再给孩子；基础锅不加辣，孩子份少带汁。
adult_finish: 孩子份盛出后，成人可另加辣椒油、白胡椒或少量额外生抽。
substitutions: []
cook_ingredients:
  - 羊肉末：500 g
  - 丸子肉馅：鸡蛋 1个；玉米淀粉 1 Tbsp；生抽 1 Tbsp；绍兴酒 1 Tbsp；姜葱水 3 Tbsp（姜片和葱段用温水浸泡后取水）
  - 家庭轻口红烧汁：水或低盐高汤 1.5 cups；生抽 1.5 Tbsp；老抽 1 tsp；绍兴酒 1 Tbsp；糖 1 tsp；姜 3片；葱白 2段
  - 煎制定型：食用油 1 tsp

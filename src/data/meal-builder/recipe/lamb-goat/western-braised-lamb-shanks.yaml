steps:
  - 羊腱擦干，用盐和黑胡椒均匀调味；洋葱、胡萝卜和西芹切细丁。Instant Pot Sauté 加油将羊腱各面煎褐后盛出。
  - 炒洋葱、蒜至香，再加入胡萝卜、西芹炒软；加入红酒、鸡汤、碎番茄、番茄膏、百里香和月桂叶搅匀，充分刮净锅底。
  - 放回羊腱；如液体不足以形成足量压力蒸汽，补水至1.5 cups总薄液体。锁盖 High Pressure 50分钟，自然泄压20分钟。用叉子检查肉极软且仍挂骨；不够软时再加压8分钟并自然泄压10分钟。
  - 盛出羊腱保温并取出香草；用 Instant Pot Sauté 单独浓缩酱汁至有光泽、能挂勺，再淋回。
  - 完成提示：羊腱肉极软、叉子一拨即可分开但仍挂骨；红酒番茄汁浓而可流动。
  - 安全提示：整块羊肉达到至少145°F/63°C并静置3分钟；炖至所需软烂质地。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊腱：2只，每只约350–400 g
  - 洋葱：1/2个细丁；胡萝卜1/2 cup细丁；西芹1/2 cup细丁
  - 压力红酒炖汁：盐1/2 tsp；黑胡椒1/2 tsp；橄榄油1–1.5 Tbsp；蒜末1–2瓣；干红酒1 1/4 cups；罐装碎番茄400 g；番茄膏1 Tbsp；低盐鸡汤1 cup；百里香2–3枝或干1 tsp；月桂叶1片；压力阶段总薄液体不足时补水至1.5 cups

steps:
  - 准备：腐竹提前泡到完全柔软，无硬芯后沥干。；羊肉冷水焯3–5分钟并冲净。
  - 厚锅中火加1 Tbsp油，下姜葱炒香；加入羊肉翻到表面略干。
  - 加入腐乳、柱候酱翻1分钟，再加绍兴酒、生抽老抽和冰糖。
  - 加热水至接近没过肉，煮开后转小火盖盖炖60分钟。
  - 羊肉开始软后加入泡软腐竹，再炖20–30分钟。
  - 肉筷子能轻松插入、腐竹吸汁软而不烂时开盖略收。
  - 汁能薄挂勺、锅底仍有可舀汁时关火。
  - 完成提示：羊肉软嫩、腐竹吸汁；煲汁浓香但仍可流动。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊肩肉块：1100 g
  - 腐竹：100 g干重，提前泡软切段
  - 枝竹羊腩煲汁：南乳/红腐乳 3块，压泥；柱候酱 1/4 cup；绍兴酒 3 Tbsp；老抽 1 tsp；生抽 2 Tbsp；冰糖 10 g；姜 15片；葱 6根；八角 1个，可省

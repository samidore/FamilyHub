steps:
  - 准备：羊肉与腌料拌匀30分钟。；孜然籽干锅小火炒到明显香、不要焦黑；辣椒/花椒不进基础锅。
  - 炒锅烧到很热，加1 Tbsp油；羊肉分两批平铺，大火快速煎炒。
  - 每批炒到边缘焦香、基本熟透即盛出，不让薄片长时间出水。
  - 原锅下葱段和炒香孜然籽10–15秒。
  - 羊肉全部回锅，加糖快速翻20–30秒。
  - 肉片无生中心且孜然均匀附着时立即关火；成人辣椒面在孩子份盛出后撒。
  - 完成提示：羊肉边缘有焦香、片仍嫩；孜然香明显且锅底干爽。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 可少量尝试；Meal Combo 默认另配蒸蛋/嫩豆腐等软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 火锅羊肉片：450 g
  - 羊肉腌料：孜然粉 1 Tbsp；玉米淀粉 1.5 tsp；中性油 1 Tbsp，可减半；生抽 1 Tbsp；绍兴酒 1 Tbsp
  - 出锅香料：孜然籽 2 Tbsp；糖 1/4 tsp；葱段 3根；香菜 1把，可选

steps:
  - 羊肋排900 g切成适合锅大小的段；若骨渣/血沫明显，冷水下锅煮开2–3分钟，捞出冲净并沥干。
  - 厚底锅中火加1 tsp油；羊肋排分批把2–3个面煎到浅褐色，盛出。
  - 原锅转中小火，下2 Tbsp糖；糖刚融化成浅琥珀色时加入姜葱，再把羊肋排回锅翻匀。
  - 加绍兴酒1/4 cup、生抽3 Tbsp、老抽1 Tbsp、水或低盐高汤3 cups；煮开撇沫，转小火盖盖。
  - 保持轻微咕嘟，90分钟开始检查；继续炖到肉能很容易从骨上分离，液体不足时只补热水。
  - 肉已软烂后开盖转中火，收至汁量约剩最初1/4、能薄挂肉且锅底仍有少量流动汁。
  - 孩子份在成人调重口前取出；成人完整拆骨并逐块检查碎骨和硬软骨后剪小。
child_serving: 只提供彻底拆骨、逐块检查后的软肉；本 Recipe 计入 Child Protein。
adult_finish: 成人可另加孜然、辣椒或黑胡椒。
substitutions: []
cook_ingredients:
  - 羊肋排：900 g
  - 家庭红烧汁：绍兴酒 1/4 cup；生抽 3 Tbsp；老抽 1 Tbsp；冰糖或白糖 2 Tbsp；水或低盐高汤 3 cups；姜 6片；葱白 3段；八角 1个可省；桂皮 1小段可省

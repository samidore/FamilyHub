steps:
  - 羊肋排900 g切成适合锅大小的段；若骨渣/血沫明显，冷水煮开2–3分钟后冲净沥干。Instant Pot Sauté 加1 tsp油分批煎至浅褐。
  - 加入糖炒至浅琥珀色，放入姜葱；加入绍兴酒1/4 cup、生抽3 Tbsp、老抽1 Tbsp和水或低盐高汤3 cups，刮净锅底。
  - 放回羊肋排，锁盖 High Pressure 35分钟，自然泄压15分钟；检查肉易从骨上分离；不够软时再加压8分钟并自然泄压10分钟。
  - 取出排骨；用 Instant Pot Sauté 将汁收到约原来1/4、薄挂肉且锅底仍有少量流动汁。孩子份由成人拆骨并逐块检查碎骨和硬软骨。
  - 完成提示：羊肋排软嫩、红亮挂汁但仍成形。
  - 安全提示：整块羊肉达到至少145°F/63°C并静置3分钟；孩子份去骨并检查碎骨。
child_serving: 只提供彻底拆骨、逐块检查后的软肉；本 Recipe 计入 Child Protein。
adult_finish: 成人可另加孜然、辣椒或黑胡椒。
substitutions: []
cook_ingredients:
  - 羊肋排：900 g
  - 压力红烧汁：绍兴酒1/4 cup；生抽3 Tbsp；老抽1 Tbsp；冰糖或白糖2 Tbsp；水或低盐高汤3 cups；姜6片；葱白3段；八角1个、桂皮1小段可省；煎肉用油1 tsp

steps:
  - 准备：羊排用厨房纸彻底擦干；厚薄不一致时尽量整理成接近一致厚度；下锅前均匀撒盐胡椒。
  - 厚底不粘锅或铁锅中大火预热；加油并转动锅面，油流动变快时放入羊排。
  - 第一面先不要移动，形成完整焦色；锅温过高冒浓烟则立即降一档。
  - 翻面后转中火；无骨羊排通常更快，提前开始测温。厚件可短暂加盖，但不要加大量水。
  - 最厚处测中心温度；达到145°F/63°C立即离火，静置至少3分钟。
  - 完成提示：两面有均匀焦色；内部达到安全温度且没有明显变柴。
child_serving: Meal Combo 另配软蛋白；本 Recipe 不计 Child Protein。
adult_finish: 可在上桌前另加黑胡椒、孜然或辣椒，不进入孩子 base。
substitutions: []
cook_ingredients:
  - 带骨羊排或无骨羊排：约600–800 g
  - 基础调味：盐 3/4 tsp；黑胡椒 1/2 tsp；中性油 2 tsp；蒜 2瓣，拍裂

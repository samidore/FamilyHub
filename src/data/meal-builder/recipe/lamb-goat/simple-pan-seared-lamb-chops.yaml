steps:
  - 准备：带骨羊排用厨房纸彻底擦干；厚薄不一致时尽量整理成接近一致厚度。；下锅前均匀撒基础盐胡椒；不要提前长时间盐腌薄片海鲜。
  - 厚底不粘锅或铁锅中大火预热；加油并转动锅面，油流动变快时放入带骨羊排。
  - 带骨羊排放下后先不要移动，让接触面形成完整焦色；锅温过高冒浓烟则立即降一档。
  - 翻面后转中火；厚件可加盖短暂焖熟，但不要加大量水把煎变成煮。
  - 从羊排最厚处避骨测中心温度；达到145°F/63°C立即离火。
  - 静置至少3分钟再切/上桌。
  - 完成提示：两面有均匀焦色；内部达到安全温度且没有因继续煎而明显出水变柴。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 若提供则逆纹切很小；Meal Combo 另配软蛋白。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 带骨羊排：4块，共约600–800 g
  - 基础调味：盐 3/4 tsp；黑胡椒 1/2 tsp；中性油 2 tsp；蒜 2瓣，拍裂

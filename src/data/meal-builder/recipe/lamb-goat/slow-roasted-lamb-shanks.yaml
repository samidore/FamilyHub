steps:
  - 准备：烤箱预热到325°F / 165°C，中层放烤架；羊腱擦干并单层放入烤盘。；把基础调味均匀涂在表面；需要腌制的菜按专用 recipe override，不使用此通用步骤。
  - 烤盘铺烘焙纸或薄薄抹油；主料之间留空隙，避免蒸汽把表面焖湿。
  - 送入已充分预热的325°F / 165°C烤箱；先烤到表面开始上色。
  - 中途只在需要均匀上色时翻面/转盘；不要反复开门。
  - 从最厚处测中心温度；达到安全温度即出炉，避免为了颜色继续烤干。
  - 需要酱汁的菜只在最后几分钟薄刷，避免含糖酱过早焦黑。
  - 出炉静置后再切；孩子份先去骨/剪小。
  - 完成提示：表面有轻度上色，中心达到安全温度，烤盘上没有大量未蒸发的生肉汁。
  - 安全提示：整块羊/山羊肉可测处达到145°F/63°C并静置3分钟；炖菜以更高温度达到软烂质地。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 羊腱：2只，约900–1200 g
  - 基础慢烤调味：盐 1.5 tsp；孜然 2 Tbsp；姜末 1 Tbsp；中性油 1 Tbsp

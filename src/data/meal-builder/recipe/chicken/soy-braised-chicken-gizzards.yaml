steps:
  - 鸡胗剪去明显筋膜、脂肪和硬黄皮残留，冲洗后沥干。
  - 约500 g鸡胗加生抽1.5 Tbsp、老抽1.5 Tbsp、绍兴酒1.5 Tbsp、十三香约1 tsp、水3/4 cup、姜和葱煮开。
  - 转小火盖盖，保持轻微沸腾90分钟后开始检查；来源允许煮到约2小时，最终以自己能接受的韧度为准。
  - 达到目标韧度后开盖略收汁；放凉5分钟，逆明显纤维切片。

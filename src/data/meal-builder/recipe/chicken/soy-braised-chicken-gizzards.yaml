steps:
  - 鸡胗剪去明显筋膜、脂肪和硬黄皮残留，冲洗后沥干。
  - Instant Pot 加入鸡胗、生抽1.5 Tbsp、老抽1.5 Tbsp、绍兴酒1.5 Tbsp、十三香约1 tsp、水1 cup、姜和葱；锁盖 High Pressure 25分钟，自然泄压15分钟。
  - 检查鸡胗达到可接受的柔韧度；若仍过韧，再 High Pressure 5分钟并自然泄压10分钟。
  - 取出鸡胗；用 Instant Pot Sauté 将卤汁略收浓，放凉5分钟后把鸡胗逆明显纤维切片，淋少量卤汁。
  - 完成提示：鸡胗熟透、软韧而仍有嚼感；卤汁收成可薄薄挂片的状态。
child_serving: 本 Recipe 不计 Child Protein。
adult_finish: 可另加辣椒、花椒或更多香料。
substitutions: []
cook_ingredients:
  - 鸡胗：500 g
  - 压力卤汁：水 1 cup；生抽 1.5 Tbsp；老抽 1.5 Tbsp；绍兴酒 1.5 Tbsp；十三香约1 tsp；姜 4片；葱 2段

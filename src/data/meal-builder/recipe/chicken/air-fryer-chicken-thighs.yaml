steps:
  - 准备：鸡腿擦干并与调味拌匀；空气炸锅预热400°F/205°C。
  - 鸡肉单层放篮中，不重叠。
  - 400°F/205°C炸8分钟后翻面。
  - 再炸5–8分钟，从最厚处开始测温。
  - 达到165°F/74°C立即取出；颜色不足可再1–2分钟，但不要牺牲内部多汁。
  - 静置2–3分钟；孩子份去骨/剪小。
  - 完成提示：表面干爽上色，中心165°F/74°C且仍有汁。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 无骨去皮鸡腿肉：340 g
  - 基础调味：中性油 2 tsp；盐 3/4 tsp；黑胡椒 1/4 tsp；蒜粉 1/2 tsp，可省

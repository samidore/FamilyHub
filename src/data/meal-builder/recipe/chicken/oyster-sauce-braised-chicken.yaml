finish_options:
  - id: red-braise
    label_zh: 红烧
    default: true
    cook_ingredients:
      - 绍兴酒 1 Tbsp；生抽 2 Tbsp；蚝油 2 Tbsp；老抽 1 tsp；糖 2 tsp；压力汤汁 1/3 cup
    steps:
      - 鸡肉已在共享 Instant Pot 基底中达到165°F/74°C且软嫩；加入绍兴酒、生抽、蚝油、老抽、糖及少量压力汤汁，用 Sauté 收至薄亮汁，Finish 不再炖熟生鸡肉。
  - id: teriyaki
    label_zh: 照烧
    default: false
    display_name_zh: 照烧鸡腿
    cook_ingredients:
      - 生抽 2 Tbsp；味醂 2 Tbsp；清酒 2 Tbsp；糖 1 Tbsp
    steps:
      - 鸡肉已在共享压力基底中熟透；加入生抽、味醂、清酒和糖，用 Sauté 收至薄亮挂肉。
  - id: adobo
    label_zh: 醋香
    default: false
    display_name_zh: 醋香焖鸡
    cook_ingredients:
      - 米醋 1/4 cup；月桂叶 2片；黑胡椒粒 1 tsp
    steps:
      - 鸡肉已在共享压力基底中熟透；加入米醋、月桂叶、黑胡椒和少量压力汤汁，Sauté 轻煮3–5分钟柔化酸香并薄薄收汁。
  - id: cola
    label_zh: 可乐
    default: false
    display_name_zh: 可乐鸡腿
    cook_ingredients:
      - 可乐 1罐，12 fl oz / 355 mL；生抽 1 Tbsp；老抽 1 tsp；绍兴酒 1 Tbsp
    steps:
      - 鸡肉已在共享 Instant Pot 基底中熟透；加入可乐、生抽、老抽和绍兴酒，用 Sauté 煮至薄亮汁并包裹鸡肉。
  - id: thirteen-spice
    label_zh: 十三香
    default: false
    display_name_zh: 十三香鸡腿
    cook_ingredients:
      - 十三香 1 tsp；生抽 1 Tbsp；鸡汤或压力汤汁 1/3 cup；糖 1 tsp
    steps:
      - 鸡肉已在共享 Instant Pot 基底中熟透；将十三香、生抽、汤汁和糖拌匀后加入，用 Sauté 煮至香料融合并薄薄挂肉。
steps:
  - 准备：鸡小腿或鸡腿擦干；有皮版本可先用 Instant Pot Sauté 煎至浅金黄，取出并倒去多余油。姜蒜备用。
  - 加入1 cup低盐鸡汤并刮净锅底；放回鸡肉和姜蒜。带骨鸡小腿或鸡腿 High Pressure 8分钟，无骨鸡腿6分钟；自然泄压5分钟后快速泄压。
  - 检查最厚处达到165°F/74°C且肉软嫩；未达温时用 Instant Pot Sauté 小火继续煮并逐块复查，不将未熟肉转入收汁阶段。
  - 取出鸡肉暂放；加入所选 Finish 调味料和少量压力汤汁，用 Instant Pot Sauté 煮至刚能薄挂勺。
  - 放回鸡肉轻轻翻裹1–2分钟；如选择顺手焖配料，泄压后单独煮至所需软度。汁保留可舀状态，不收成浓咸膏。
  - 孩子份带骨鸡彻底去骨、去软骨并剪小；无骨鸡腿直接剪小。
  - 完成提示：鸡肉熟透软嫩；共享压力基底先完成，Finish 只改变晚段风味和薄汁。
  - 安全提示：最厚处达到165°F/74°C；带骨件避开骨头测温。
child_serving: 带骨版本由成人彻底去骨并检查碎骨/硬软骨后剪小；无骨版本直接剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡腿 / 鸡小腿：约900–1100 g；鸡腿带骨或无骨均可
  - 共享压力液：低盐鸡汤 1 cup；姜 5片；蒜 3瓣；另预留最多1 cup低盐鸡汤供泄压后调整
  - 所选 Finish 调味料仅在压力完成后加入，按下方 Finish 选项表准备

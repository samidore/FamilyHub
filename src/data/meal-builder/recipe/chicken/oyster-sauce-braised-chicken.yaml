steps:
  - 准备：鸡肉擦干；若皮很多可剪去明显多余脂肪。；焖汁混匀。
  - 宽锅中火，鸡皮面朝下煎约3分钟到浅金黄；翻面再煎1–2分钟。
  - 加入姜蒜和焖汁，煮开后转小火盖盖15分钟。
  - 翻面，再盖盖15分钟；最厚处测到165°F/74°C。
  - 开盖转中火，把汁减少；每2–3分钟给鸡肉淋汁。
  - 汁从水状变成刚能薄挂勺时关火，不收到浓咸膏状。
  - 孩子份去骨、去软骨并剪小。
  - 完成提示：鸡肉熟透软嫩；汁能薄挂勺、锅底仍有可舀汁。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

steps:
  - 鸡心修去多余脂肪和血管，纵向深切但不完全切断，蝴蝶展开；冲掉残血后沥干。
  - 按来源把455 g鸡心与葱2根、姜约4 cm、花椒2 tsp、五香粉1/2 tsp、绍兴酒1 Tbsp、盐1 tsp和水1 cup冷藏腌1小时。
  - 捞出彻底沥干；炒锅/铁锅大火预热，加1 Tbsp油，鸡心展开面朝下单层煎。
  - 两面都煎到明显收紧并完全熟透；用温度计确认最厚处达到165°F/74°C。
  - 离火撒粗孜然约1/2 Tbsp；辣椒粉只加成人份。
child_serving: 本 Recipe 不计 Child Protein。
adult_finish: 成人可按来源加辣椒粉和芝麻。

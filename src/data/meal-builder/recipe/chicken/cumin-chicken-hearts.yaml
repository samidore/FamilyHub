cook_ingredients:
  - 鸡心：455 g，蝴蝶切
  - 腌料：葱2根；姜约4 cm；花椒2 tsp；五香粉1/2 tsp；绍兴酒1 Tbsp；盐1 tsp；水1 cup
  - 煎制：中性油1 Tbsp；粗孜然1/2 Tbsp；辣椒粉成人可选

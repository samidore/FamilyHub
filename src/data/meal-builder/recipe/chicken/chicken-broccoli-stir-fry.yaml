steps:
  - 准备：鸡肉逆纹切约5 mm薄片；先加水抓到基本吸收，再加淀粉、油、盐抓匀，静置15–20分钟。；蔬菜切成快炒大小；西兰花如茎粗，先焯30–60秒并彻底沥干。；炒汁与薄芡分别混匀；薄芡下锅前再次搅匀。
  - 炒锅大火预热，加1 Tbsp油；下鸡片摊开，快速翻炒到表面全部发白、中心仍略欠熟，约六七成熟时盛出。
  - 原锅下姜5 g、蒜2瓣炒10–15秒；加入西兰花，大火炒至颜色变亮、刚断生。
  - 鸡片回锅，倒入炒汁，翻炒至锅中重新沸腾。
  - 把薄芡分2次加入，每次都充分翻匀；看到汁刚能薄薄挂住鸡片和菜就停止加芡。
  - 继续翻炒到最厚鸡片完全熟，立即离火；不要为了更深焦色继续炒。
  - 孩子份先盛出、剪小；成人后味另加。
  - 完成提示：鸡片嫩、内部完全不透明；蔬菜刚熟；汁薄亮挂料、没有白浆感或锅底积汁。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡胸：340 g
  - 西兰花：300–450 g
  - 鸡片腌料：水 3 Tbsp；玉米淀粉 2 tsp；中性油 1 tsp；盐 1/4 tsp
  - 家庭轻盐鸡片炒汁：水或低盐高汤 3 Tbsp；蚝油 2 tsp；生抽 1 tsp；糖 1/2 tsp
  - 薄芡：玉米淀粉 1.5 tsp；水 1 Tbsp

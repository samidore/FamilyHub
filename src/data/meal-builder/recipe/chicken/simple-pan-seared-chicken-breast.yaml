steps:
  - 准备：鸡胸用厨房纸彻底擦干；厚薄不一致时尽量整理成接近一致厚度。；下锅前均匀撒基础盐胡椒；不要提前长时间盐腌薄片海鲜。
  - 厚底不粘锅或铁锅中大火预热；加油并转动锅面，油流动变快时放入鸡胸。
  - 鸡胸放下后先不要移动，让接触面形成完整焦色；锅温过高冒浓烟则立即降一档。
  - 翻面后转中火；厚件可加盖短暂焖熟，但不要加大量水把煎变成煮。
  - 从鸡胸最厚处测中心温度；达到165°F/74°C立即离火。
  - 离火静置2–3分钟再切，利用短暂静置减少切开时流汁。
  - 完成提示：两面有均匀焦色；内部达到安全温度且没有因继续煎而明显出水变柴。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡胸：340 g
  - 基础调味：盐 1/2 tsp；黑胡椒 1/4 tsp；中性油 2 tsp

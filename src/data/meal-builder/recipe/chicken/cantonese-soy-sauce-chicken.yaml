steps:
  - 准备：鸡提前约1小时从冰箱取出；去内脏并清理鸡皮。；使用能刚好容纳整鸡的高而窄的锅；锅过大会需要按比例增加master sauce。
  - 中小火锅中加油和姜，约30秒后加葱再炒30秒；加八角、玫瑰露和绍兴酒，煮到重新轻沸。
  - 加入生抽、老抽、糖、盐和水；重新煮到轻沸后转小火煮20分钟，让master sauce融合。
  - 调到slow boil，把鸡胸朝上缓慢浸入并确保鸡腔充满热卤汁；中高火约5分钟后提起鸡倒出腔内较冷液体，再放回。
  - 卤汁恢复lazy simmer后盖盖，约210°F/99°C附近轻煨25分钟；若没有完全淹没，中途浇汁或在约13分钟时翻面。
  - 关火仍盖盖，让鸡在卤汁中浸15–25分钟；大腿最厚处避骨测到165°F/74°C。
  - 取出静置10–15分钟再斩件；master sauce只少量淋盘，孩子份去骨去软骨、少带皮和浓汁。
  - 完成提示：鸡皮均匀酱色、肉多汁；master sauce保持液体状态，不需要再浓缩。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡：1只，约1.8 kg（4 lb）
  - 豉油鸡 master sauce（The Woks of Life 原方）：盐 1/4 cup（主要用于清洁鸡皮并进入master sauce；成品只少量带汁）；中性油 2 tsp；姜 7片；葱 2根，切约8 cm段并拍扁；八角 3个；玫瑰露酒 3/4 cup；绍兴酒 3/4 cup；生抽 2 cups；老抽 1/2 cup；糖 1 3/4 cups；水 12 cups

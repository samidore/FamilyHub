steps:
  - 准备：鸡去内脏并清理鸡皮；按原配方量好豉油鸡 master sauce。
  - Instant Pot 内加入1.5 cups水、姜、葱及八角；整鸡胸朝上放入，锁盖 High Pressure 18分钟，自然泄压15分钟后快速泄压。
  - 大腿最厚处避骨测温达到165°F/74°C；未达温时再 High Pressure 3分钟、自然泄压5分钟后复测。
  - 另锅将原配方 master sauce 加热至轻微冒泡后转低火；放入已熟整鸡浸润10分钟，中途翻面或浇汁。此步只上色入味，不继续炖软。
  - 取出静置10–15分钟再斩件；master sauce 只少量淋盘。孩子份去骨去软骨、少带皮和浓汁。
  - 完成提示：鸡肉熟透多汁、鸡皮均匀酱色；master sauce 保持液体状态。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处并避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡：1只，约1.8 kg（4 lb）
  - 压力阶段液体：水 1.5 cups；姜 7片；葱 2根；八角 1个
  - 豉油鸡 master sauce 原配方仍按原料清单准备；整鸡压力完成后才用 master sauce 短暂浸色

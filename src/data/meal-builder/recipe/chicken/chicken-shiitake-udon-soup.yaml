steps:
  - 准备：鸡片加短腌抓匀10分钟；香菇切片。；乌冬按包装焯散，沥干分3碗。
  - 汤锅把清汤乌冬底煮开，加入鲜香菇，中火煮3分钟到香菇软。
  - 转小火保持轻沸，把鸡片逐片拨散下锅。
  - 煮到鸡片全部变白，再从最厚片确认165°F/74°C；达到即关到最小火。
  - 汤尝味后只补必要盐；不要让鸡胸继续在汤里久滚。
  - 把热汤、香菇和鸡片浇入乌冬碗；孩子份剪短面条和鸡片。
  - 完成提示：鸡片刚熟嫩、香菇软；汤清而可直接喝，乌冬不久泡发胀。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡胸：340 g，切5 mm薄片
  - 鲜香菇：180 g，切5 mm片
  - 乌冬面：3人份，约600 g熟面
  - 鸡肉短腌：盐 1/4 tsp；玉米淀粉 1 tsp；水 1 Tbsp
  - 清汤乌冬底：低盐鸡汤或日式高汤 5 cups；生抽 1.5 Tbsp；味醂 1 Tbsp；姜 3片

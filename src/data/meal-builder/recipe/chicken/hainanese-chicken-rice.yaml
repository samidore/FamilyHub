steps:
  - 准备：鸡擦干并用1 Tbsp盐轻擦鸡皮；保留腹腔取下的鸡油。；Jasmine rice淘洗沥干；姜蒜汁和甜老抽汁材料分别量好。
  - 深锅把12–14 cups水、姜和葱煮开；鸡胸朝上缓慢放入。水再次将沸时提起鸡，倒出腔内较冷的水，再放回。
  - 水刚重新开始沸腾时立即转最小火，盖盖保持barely simmer；1.5 kg鸡约30–35分钟起检查，大腿最厚处避骨达到165°F/74°C即取出。
  - 把鸡放入冰水15分钟以停止余热，再彻底沥干；孩子份上桌前仍按卫生要求处理并彻底去骨。
  - 做饭：中火把鸡油和1/2 tsp油炼出约1/2 Tbsp脂肪，加入蒜末短炒；加入1.5 cups生米连续翻约2分钟。
  - 炉灶锅版本加入2 cups鸡汤和1 tsp盐，浸20分钟后盖盖煮开，立刻转最小火约15分钟至液体吸收，再关火焖10分钟；rice cooker版本用鸡汤加到对应米量刻度。
  - 姜蒜汁：姜蒜打碎后用1.5 Tbsp油小火炒到刚失去生辣味，加一小撮盐。甜老抽汁：水和糖煮到糖溶、略成糖浆，再拌入老抽。
  - 鸡斩件，与鸡饭、两种不辣蘸汁分开上桌；辣椒汁只给成人另做，不进入家庭基础锅。
  - 完成提示：鸡刚熟多汁；米饭吸尽鸡汤、颗粒熟透不湿烂；两种蘸汁独立控制盐甜度。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡：1只，约1.5 kg（3–3.5 lb）
  - Jasmine rice：1.5 US cups，淘洗沥干
  - 煮鸡：盐 1 Tbsp，用于轻擦鸡皮；水 12–14 cups，或足量使鸡胸仅略露出；姜 4–5片；葱 2根
  - 鸡饭（原方半量）：鸡油 约1 oz/28 g，可减少但不另补大量油；中性油 1/2 tsp；蒜末 2瓣；煮鸡汤 2 cups（炉灶锅做1.5 cups米时按原方半量）；用rice cooker则按1.5 cups米对应刻度；盐 1 tsp
  - 姜蒜汁（原方约半量）：姜 约2-inch piece；蒜 1瓣；中性油 1 1/2 Tbsp；盐 1小撮
  - 甜老抽汁（原方半量）：水 2 Tbsp；糖 1 Tbsp + 3/4 tsp；老抽 2 Tbsp

steps:
  - 准备：鸡擦干并用1 Tbsp盐轻擦鸡皮；保留腹腔取下的鸡油。Jasmine rice 淘洗沥干；姜蒜汁和甜老抽汁材料分别量好。
  - 整鸡放入 Instant Pot，加入1.5 cups水、姜4–5片和葱2根；锁盖 High Pressure 18分钟，自然泄压15分钟后快速泄压。
  - 大腿最厚处避骨达到165°F/74°C；未达温时再 High Pressure 3分钟、自然泄压5分钟后复测。鸡放入冰水15分钟停止余热，再彻底沥干。
  - 鸡饭按原步骤以鸡油和蒜炒香米；使用约2 cups熟鸡压力汁按米量煮饭，可用 rice cooker 或炉灶锅。
  - 姜蒜汁和甜老抽汁按原配方分别制作；鸡斩件，与鸡饭和两种不辣蘸汁分开上桌。辣椒汁只给成人另做。
  - 孩子份上桌前彻底去骨并检查碎骨。
  - 完成提示：鸡刚熟多汁；米饭吸尽鸡汤、颗粒熟透不湿烂；两种蘸汁独立控制盐甜度。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处并避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡：1只，约1.5 kg（3–3.5 lb）
  - Jasmine rice：1.5 US cups，淘洗沥干
  - 压力煮鸡：盐 1 Tbsp 用于轻擦鸡皮；水 1.5 cups；姜 4–5片；葱 2根
  - 鸡饭：鸡油约1 oz/28 g；中性油1/2 tsp；蒜末2瓣；熟鸡压力汁约2 cups，按米种与设备刻度调整；盐1 tsp
  - 姜蒜汁和甜老抽汁按原食材清单分别制作并独立上桌

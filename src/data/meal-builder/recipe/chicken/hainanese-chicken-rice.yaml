steps:
  - 整鸡清理后按 poached chicken + ginger-scallion sauces + chicken-flavored rice
    的传统路线入锅；保持整鸡结构。
  - 控制水温/火力让鸡均匀熟透；来源使用浸煮/焖浸时保留这一结构。
  - 确认最厚部位熟透后取出并静置；需要的酱油/葱姜汁另做。
  - 用鸡汤/鸡油风味液按引用来源另煮米饭；具体米水比按家庭常用米和锅具校准，不在未测试时写死。
  - 成人负责斩件、去骨；孩子份只给无骨软肉并剪小。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: Optional chili/chili oil or stronger seasoning only after the
  child portion is removed; omit if the dish does not benefit from it.

steps:
  - 准备：烤箱预热425°F/220°C；鸡翅/鸡小腿擦干。；刷汁搅匀，分成‘生肉刷汁’和‘最后干净刷汁’两份，避免交叉污染。
  - 鸡肉单层放铺纸烤盘，先不刷厚糖汁，烤15分钟。
  - 翻面，薄刷第一份蜂蜜酱油汁，再烤10分钟。
  - 最厚处接近165°F/74°C时用干净刷子刷第二份汁。
  - 再烤3–5分钟到表面发亮、边缘轻焦；糖变深太快就降温或提前出炉。
  - 确认165°F/74°C后出炉；孩子份去骨/软骨。
  - 完成提示：鸡肉熟透；表面亮、有轻焦边但蜂蜜不烧黑。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡翅 / 鸡小腿：900 g；任选一种；实际选中项使用同一批量
  - 蜂蜜酱油刷汁：蜂蜜 2 Tbsp；生抽 2 Tbsp；水 1 Tbsp；蒜末 1 tsp；姜末 1 tsp

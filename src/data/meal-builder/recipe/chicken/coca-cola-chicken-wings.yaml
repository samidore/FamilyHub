steps:
  - 准备：鸡翅擦干；关节处可不切。；酱汁量好。
  - 宽锅中大火加1 tsp油，鸡翅单层分批煎到两面浅金黄。
  - 全部鸡翅回锅，加入姜和可乐酱汁；大火煮开。
  - 转中火盖盖煮12–15分钟，中途翻一次。
  - 确认最厚鸡翅达到165°F/74°C；开盖转大火。
  - 持续翻动到汁量很少、气泡变大、每个鸡翅表面都裹一层亮汁；锅底仍有1–2 Tbsp可流动汁时关火。
  - 孩子份拆骨并去软骨后再给。
  - 完成提示：鸡翅熟透；可乐汁亮而薄黏，紧贴鸡翅但不焦糖硬化。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

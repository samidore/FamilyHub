steps:
  - 准备：鸡胸横片成约1.5 cm厚；轻拍到厚度一致。；烤箱预热425°F/220°C；Panko与1 Tbsp油拌匀，先在干锅中火炒到浅金黄可提高烤后颜色。
  - 鸡排撒盐胡椒；依次薄蘸面粉、蛋液、Panko，按压让面包糠黏牢。
  - 放在烤架/铺纸烤盘上，彼此留空。
  - 烤10分钟后翻面；继续烤5–8分钟。
  - 最厚处达到165°F/74°C立即出炉；不要为了更深颜色继续烤干。
  - 静置2分钟切条；孩子份不淋浓酱，成人猪排酱另蘸。
  - 完成提示：外层干爽酥脆、金黄；鸡胸中心熟透仍多汁。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡胸：450–550 g，切成3片薄鸡排
  - 基础调味：盐 1/2 tsp；黑胡椒 1/4 tsp
  - 裹层：面粉 1/3 cup；鸡蛋 1个，打散；Panko面包糠 1.5 cups；中性油 1 Tbsp，与Panko拌匀

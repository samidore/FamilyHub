steps:
  - 鸡肝去筋膜并分成大小接近的块，快速冲洗后彻底沥干。
  - 小锅加入水1 cup、生抽1 Tbsp、绍兴酒1 Tbsp、姜4片和葱2段，煮开后转小火。
  - 加入鸡肝，保持轻微小滚并加盖；按来源“最后约15分钟加入肝”的窗口烹调。
  - 约10分钟起测最厚处；达到165°F/74°C立即离火，避免继续久煮变粉硬。
  - 孩子份取柔软部分压碎/切小，少带汁。
child_serving: 只提供完全熟且柔软的部分；本 Recipe 计 Child Protein。
adult_finish: 成人可另加白胡椒或辣椒。
substitutions: []
cook_ingredients:

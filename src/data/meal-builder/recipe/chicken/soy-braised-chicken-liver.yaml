steps:
  - 鸡肝去筋膜并分成大小接近的块，快速冲洗后彻底沥干。
  - Instant Pot 加入水1 cup、生抽1 Tbsp、绍兴酒1 Tbsp、姜4片和葱2段，先煮至沸腾后取消 Sauté。
  - 鸡肝放入耐热浅碗并置于蒸架上；锁盖 High Pressure 1分钟，立即快速泄压。
  - 测最大块中心达到165°F/74°C；若未达温，将鸡肝连碗移至 Instant Pot Sauté 的热卤汁中短煮并逐块复测，达到温度立即离火，避免久煮变粉硬。
  - 孩子份取柔软部分压碎或切小，少带汁。
  - 完成提示：鸡肝中心达到安全温度并保持柔软，不继续久煮。
  - 安全提示：鸡肝达到165°F/74°C。
child_serving: 只提供完全熟且柔软的部分；本 Recipe 计 Child Protein。
adult_finish: 成人可另加白胡椒或辣椒。
substitutions: []
cook_ingredients:
  - 鸡肝：400 g
  - 压力蒸汽液：水 1 cup；生抽 1 Tbsp；绍兴酒 1 Tbsp；姜 4片；葱 2段

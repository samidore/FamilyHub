steps:
  - 准备：鸡胸横片到约1.5 cm厚，擦干；可轻撒1/4 tsp盐。；酱汁混匀。
  - 不粘锅中火加2 tsp油，鸡胸单层放入；第一面煎3分钟左右至有浅金色。
  - 翻面后转中小火，再煎到中心接近熟。
  - 倒入葱姜酱油汁，转中火；用勺把汁浇在鸡胸上。
  - 中心达到165°F/74°C后立即把鸡胸夹出；锅中汁继续煮30–60秒到薄挂勺。
  - 把汁淋回鸡胸；静置2分钟切片。
  - 完成提示：鸡胸中心熟透仍多汁；葱姜汁薄挂切面，不成咸稠酱。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡胸：450 g，切成2–3片等厚鸡排
  - 葱姜酱油汁：生抽 1.5 Tbsp；水 3 Tbsp；糖 1/2 tsp；姜末 1 Tbsp；葱花 2 Tbsp

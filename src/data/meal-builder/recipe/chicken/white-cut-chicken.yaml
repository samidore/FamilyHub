steps:
  - 准备：鸡内外清理并擦干；葱姜洗净。
  - 整鸡放入 Instant Pot，加入1.5 cups水、2根葱和5片姜；锁盖 High Pressure 18分钟。自然泄压15分钟后再快速泄压。
  - 大腿最厚处避骨测温；须达到165°F/74°C。未达温时再 High Pressure 3分钟、自然泄压5分钟后复测。
  - 取出鸡静置10–15分钟再斩件；姜葱蘸汁按原比例混合，生抽只放成人蘸碟，不淋整鸡。
  - 孩子份彻底去骨、检查碎骨和硬软骨后剪小。
  - 完成提示：鸡刚熟多汁，皮完整；蘸汁姜葱清香，整鸡不浸成高盐。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处并避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 整鸡：1只，约1.4–1.8 kg（3–4 lb）
  - 压力阶段：水 1.5 cups；葱 2根；姜 5片
  - 姜葱蘸汁：葱末 3 Tbsp；姜末 2 Tbsp；中性油 3 Tbsp；盐从1/4 tsp起分次调；生抽仅成人蘸碟可选

steps:
  - 准备：主料切成厚度尽量一致的片/小块；加入全部腌料抓匀，静置15–20分钟。；配菜切薄；把肉在浅盘中摊成尽量单层，较厚块不要堆在盘中心。；蒸锅加足水并先烧到持续沸腾，再把盘子上锅。
  - 水已大开后上锅，立刻盖严；保持中大火让蒸汽持续稳定。
  - 先蒸到主料表面完全变色；打开锅盖只做一次中心熟度检查，避免频繁放掉蒸汽。
  - 如盘中有配菜，看到配菜变软、肉汁由浑浊转清且中心达到安全温度即可关火。
  - 关火后等30秒再开盖，避免蒸汽烫伤；将盘中汁轻轻拌匀，不额外淋大量热油。
  - 孩子份先盛出并检查骨头、硬筋或大块香菇；剪成易咀嚼大小。
  - 完成提示：肉中心熟透但仍有汁；盘汁清亮、不见粉红肉汁；配菜软而不烂。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 无骨去皮鸡腿肉：340 g
  - 中式香肠：1根，约80–100 g
  - 蒸鸡腌料：蚝油 2 Tbsp；生抽 2 tsp；糖 1.5 tsp；盐 1/4 tsp；白胡椒 1小撮；绍兴酒 2 tsp；玉米淀粉 2 tsp；芝麻油 1 tsp

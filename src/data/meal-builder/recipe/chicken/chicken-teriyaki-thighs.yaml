steps:
  - 准备：鸡腿擦干；厚处轻划一刀或拍平，使厚度接近。；照烧汁完全混匀。
  - 不粘锅中火加2 tsp油，鸡腿较平的一面朝下单层放入；煎到能轻松翻面且呈金黄。
  - 翻面后转中小火，盖盖2–4分钟，让最厚处接近熟透。
  - 打开盖，倒掉锅中明显多余油脂；倒入照烧汁，转中大火。
  - 不断翻面让汁均匀裹肉；汁从稀水变成光亮、气泡变大时注意防焦。
  - 最厚处达到165°F/74°C，且汁只剩薄薄能挂肉的一层时立即关火。
  - 静置2分钟切条；孩子份先盛出，成人可加七味粉。
  - 完成提示：鸡肉熟透仍多汁；照烧汁呈薄亮膜，不在锅底积一滩也不焦黑。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

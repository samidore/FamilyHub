steps:
  - 准备：鸡腿切均匀块；洋葱切薄片。；鸡蛋只轻轻划散，保留少量蛋白蛋黄纹理。
  - 宽锅放丼汁和洋葱，中火煮开后转中小火，煮到洋葱软而仍有形。
  - 加入鸡肉单层铺开，盖盖中小火煮到鸡肉接近熟透；中途翻一次。
  - 确认鸡肉最厚处达到165°F/74°C；先把约2/3蛋液绕圈倒入，盖20–30秒。
  - 倒入剩余蛋液，关到小火再盖20–40秒，直到蛋液完全凝固但仍柔软。
  - 连汁一起分到3碗热饭上；汁应湿润米饭但不是汤泡饭。
  - 孩子份先确认鸡肉块大小并剪小。
  - 完成提示：鸡肉熟透、洋葱软甜；蛋完全凝固但仍嫩；锅内留足够丼汁湿润米饭。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 无骨去皮鸡腿肉：340 g，切2.5 cm块
  - 鸡蛋：4个，轻轻打散
  - 洋葱：1个，约200 g，薄切
  - 米饭：3碗熟饭
  - 亲子丼汁：日式高汤 3/4 cup；生抽 3 Tbsp；味醂 3 Tbsp；糖 1 Tbsp

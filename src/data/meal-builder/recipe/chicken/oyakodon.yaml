steps:
  - 鸡腿去骨后取约340 g净肉切2.5 cm块；洋葱切薄片。鸡蛋轻轻划散，保留少量蛋白蛋黄纹理。
  - Instant Pot 加入洋葱、日式高汤3/4 cup、生抽、味醂和糖，铺入鸡肉。锁盖 High Pressure 3分钟，快速泄压。
  - 检查鸡肉最厚处达到165°F/74°C；未达温时用 Instant Pot Sauté 小火继续煮并逐块复测。
  - 将约2/3蛋液绕圈倒入，用 Sauté 低档轻煮并盖上适配锅盖20–30秒；倒入剩余蛋液，再轻煮至蛋液完全凝固但仍柔软。
  - 连汁分到3碗热饭上；汁应湿润米饭但不是汤泡饭。孩子份确认鸡肉块大小并剪小。
  - 完成提示：鸡肉熟透、洋葱软甜；蛋完全凝固但仍嫩，锅内留足够丼汁。
  - 安全提示：鸡肉最厚处达到165°F/74°C。
child_serving: 取较嫩、较淡的部分，必要时剪成小块。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 鸡腿：去骨后净肉 340 g，切2.5 cm块；买到带骨的先去骨后称量
  - 鸡蛋：4个，轻轻打散
  - 洋葱：1个，约200 g，薄切
  - 米饭：3碗熟饭，另行烹好
  - 压力亲子丼汁：日式高汤 3/4 cup；生抽 3 Tbsp；味醂 3 Tbsp；糖 1 Tbsp

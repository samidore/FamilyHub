steps:
  - 准备：鸡肉擦干；卤汁全部量好。
  - 厚锅中火把鸡皮面向下干煎或加1 tsp油煎至浅褐，再翻面1–2分钟。
  - 加入醋、生抽、水、蒜、黑胡椒和月桂叶；煮开后转小火。
  - 盖盖留缝轻煨约25–35分钟，中途翻一次；最厚肉处避骨测到165°F/74°C。
  - 鸡肉熟后先盛出；酱汁中火煮几分钟，让醋味变柔、液体略收浓。
  - 鸡肉回锅翻裹1–2分钟；酱汁仍应可流动，不要收到糖浆状或死咸。
  - 孩子份彻底去骨去软骨、少带浓汁；成人可另加黑胡椒。
  - 完成提示：鸡肉熟透且软嫩；卤汁酸香、薄挂表面但仍能流动。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions: []
cook_ingredients:
  - 带骨鸡腿/鸡小腿：900 g
  - Adobo 卤汁（按约900 g鸡肉缩放）：米醋/甘蔗醋 1/3 cup；生抽 3 Tbsp；水 3 Tbsp；蒜 5瓣，拍裂；黑胡椒粒 2 tsp；月桂叶 2片；糖 1/2 tsp，可省

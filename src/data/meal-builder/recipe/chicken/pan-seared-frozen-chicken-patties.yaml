steps:
  - 先读包装，确认 raw / fully cooked、是否需要解冻以及是否允许平底锅加热；包装步骤优先。
  - 包装允许平底锅时按其火力和时间加热，途中按说明翻面；表面过快上色而中心仍冷时降低火力并加盖。
  - 生制或熟制状态不明确时，用温度计确认中心达到165°F/74°C；不要只靠外观判断。
  - 离火静置1–2分钟再切。

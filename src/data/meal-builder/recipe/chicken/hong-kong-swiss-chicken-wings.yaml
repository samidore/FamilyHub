steps:
  - 准备：鸡翅检查骨屑并擦干；瑞士汁材料全部量好。
  - 锅中放入瑞士汁全部材料，中火煮开并搅到冰糖溶解。
  - 加入鸡翅，液体重新沸腾后转中小火；保持轻滚，不猛烈翻腾。
  - 盖盖煮约10分钟，中途翻面，让两面均匀着色。
  - 开盖继续轻煮并检查最厚肉处；达到165°F/74°C即进入收尾。
  - 若汁仍很多，先把鸡翅盛出，再单独中火收汁到比水略稠、能薄挂勺；鸡翅回锅快速翻匀后关火。
  - 孩子份彻底拆骨并去硬软骨，少带浓汁。
  - 完成提示：鸡翅均匀深酱色、熟而不干；瑞士汁甜咸、薄挂鸡翅但仍能流动。
  - 安全提示：最厚处达到165°F/74°C；带骨件测最厚肉处，避开骨头。
child_serving: 成人彻底去骨并检查碎骨/硬软骨后剪小。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。

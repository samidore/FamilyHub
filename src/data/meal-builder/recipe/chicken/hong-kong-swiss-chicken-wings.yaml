cook_ingredients:
  - 整鸡翅/Party Wings：约870–900 g（约16只整翅）
  - 瑞士汁（Christine’s Recipes）：姜 2–3片；葱 2根，切段；生抽 125 ml（约1/2 cup）；老抽 125 ml（约1/2 cup）；水 250 ml（约1 cup）；绍兴酒 3 Tbsp；花椒 1 tsp；八角 3–4个；月桂叶 2片；冰糖 50 g

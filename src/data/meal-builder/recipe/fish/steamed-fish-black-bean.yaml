cook_ingredients:
  - 活淡水鲈鱼 / Branzino（欧洲海鲈） / 黑海鲈 / 石斑鱼 / 大比目鱼：1条，约650–800 g，去鳞去内脏；任选一种；实际选中项使用同一批量
  - 豉汁：发酵黑豆 1 Tbsp，冲洗粗切；蒜 2瓣，末；姜 10 g，丝；生抽 1 Tbsp；糖 1/2 tsp；水 2 Tbsp；芝麻油 1/2 tsp

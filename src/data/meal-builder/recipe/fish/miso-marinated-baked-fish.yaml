steps:
  - 准备：腌汁搅到味噌完全化开；鱼擦干。；鱼与腌汁冷藏腌：sablefish/黑鳕可较长，智利海鲈先从1–2小时起；不把不同鱼种的腌制时间机械等同。
  - 烤前把鱼从腌汁取出，用手/刮刀轻轻刮掉表面厚酱，避免糖和味噌先焦。
  - 烤箱预热425°F/220°C；鱼皮面（如有）朝下放铺纸烤盘。
  - 烤到表面开始焦糖化；约8分钟起根据厚度测中心。
  - 中心达到145°F/63°C即出炉；若需要更深颜色，只用上火/高温1分钟并全程看守。
  - 静置2分钟；孩子份去皮并检查鱼刺。
  - 完成提示：表面有浅褐味噌焦边而不黑；鱼肉中心熟透仍湿润、可分片。
  - 安全提示：鱼中心达到145°F/63°C，或肉完全不透明并能轻易分片；给孩子份再次检查鱼刺。
child_serving: 成人彻底去刺后压碎/撕小；Meal Combo 默认保留软蛋白备选。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - sablefish
cook_ingredients:
  - 智利海鲈 / Sablefish：450 g，2–3块
  - 味噌腌汁：味噌 1 Tbsp；糖 1 Tbsp；清酒 2 Tbsp；味醂 1 Tbsp；生抽 1.5 Tbsp

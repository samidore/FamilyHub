steps:
  - 腌汁搅到味噌完全化开；鱼擦干。Sablefish可较长腌，智利海鲈先从1–2小时起。
  - 烤前取出鱼，轻轻刮掉表面厚酱，避免糖和味噌先焦。
  - 烤箱预热425°F/220°C；鱼放铺纸烤盘。
  - 约8分钟起按厚度测中心；达到145°F/63°C即出炉。
  - 孩子份去掉表面较咸的酱层和鱼皮，成人检查鱼刺后压碎/撕小。
  - 完成提示：表面有浅褐味噌焦边而不黑；中心熟透仍湿润、可分片。
child_serving: 去掉表面厚味噌与鱼皮，彻底去刺后压碎/撕小；本 Recipe 计入 Child Protein。
adult_finish: 成人可另补味噌汁或辣味。
substitutions: [sablefish]
cook_ingredients:
  - 智利海鲈 / Sablefish：450 g，2–3块
  - 味噌腌汁：味噌 1 Tbsp；糖 1 Tbsp；清酒 2 Tbsp；味醂 1 Tbsp；生抽 1.5 Tbsp

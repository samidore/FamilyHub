steps:
  - 准备：三文鱼用厨房纸彻底擦干；厚薄不一致时尽量整理成接近一致厚度。；下锅前均匀撒基础盐胡椒；不要提前长时间盐腌薄片海鲜。
  - 厚底不粘锅或铁锅中大火预热；加油并转动锅面，油流动变快时放入三文鱼。
  - 三文鱼放下后先不要移动，让接触面形成完整焦色；锅温过高冒浓烟则立即降一档。
  - 翻面后转中火；厚件可加盖短暂焖熟，但不要加大量水把煎变成煮。
  - 从三文鱼最厚处测中心温度；达到145°F/63°C立即离火。
  - 静置1–2分钟；不要长时间留在热锅中让余温继续烤干。
  - 完成提示：两面有均匀焦色；内部达到安全温度且没有因继续煎而明显出水变柴。
  - 安全提示：鱼中心达到145°F/63°C，或肉完全不透明并能轻易分片；给孩子份再次检查鱼刺。
child_serving: 成人彻底去刺后压碎/撕小；Meal Combo 默认保留软蛋白备选。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - simple finish
  - teriyaki finish
  - miso-butter finish
cook_ingredients:
  - 三文鱼：450 g
  - 基础调味：盐 1/2 tsp；黑胡椒 1/4 tsp，可省；中性油 2 tsp

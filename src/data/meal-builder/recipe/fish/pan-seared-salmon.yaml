steps:
  - 三文鱼擦干，下锅前轻撒盐；不长时间盐腌。
  - 不粘锅中火预热，加2 tsp油；三文鱼放下后先不要移动，形成浅金色表面。
  - 翻面后转中小火；厚件可短暂加盖，让中心均匀熟透而不把外层煎硬。
  - 最厚处达到145°F/63°C后立即离火，静置1–2分钟。
  - 孩子份去皮、检查鱼刺，取内部柔软部分压碎/撕小。
  - 完成提示：表面有焦色，内部熟透仍湿润、轻压能分片。
child_serving: 去皮并彻底检查鱼刺后，取内部软肉压碎/撕小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加照烧、味噌黄油或辣味 finish。
substitutions: [simple finish, teriyaki finish, miso-butter finish]
cook_ingredients:
  - 三文鱼：450 g
  - 基础调味：盐 1/2 tsp；黑胡椒 1/4 tsp，可省；中性油 2 tsp

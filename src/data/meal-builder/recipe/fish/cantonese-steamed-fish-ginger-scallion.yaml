steps:
  - 准备：鱼擦干；整鱼两面各划2–3刀但不要切到骨断。；耐热盘下垫少量姜葱；蒸锅水必须先完全烧开。
  - 水大开后把鱼盘上锅，立刻盖严，保持中大火稳定蒸汽。
  - 约7分钟起根据鱼厚度检查；最厚处中心达到145°F/63°C，且鱼肉能轻易分片即可。
  - 立即出锅，倒掉盘中大部分腥水，不让鱼继续泡在蒸水里。
  - 铺上新鲜姜葱丝，淋清蒸豉油汁；把1 Tbsp油加热至流动变快后仅淋在姜葱上。
  - 孩子份从鱼背厚肉处取肉，逐指检查细刺后剪小。
  - 完成提示：鱼肉刚从半透明转不透明、能沿肌理分片；盘底只有少量清亮调味汁。
  - 安全提示：鱼中心达到145°F/63°C，或肉完全不透明并能轻易分片；给孩子份再次检查鱼刺。
child_serving: 成人彻底去刺后压碎/撕小；Meal Combo 默认保留软蛋白备选。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - branzino
  - black-sea-bass
  - grouper
  - halibut
  - whole-fish or compatible fillet path
cook_ingredients:
  - 活淡水鲈鱼 / Branzino（欧洲海鲈） / 黑海鲈 / 石斑鱼 / 大比目鱼：1条，约650–800 g，去鳞去内脏；任选一种；实际选中项使用同一批量
  - 清蒸豉油汁：生抽 1.5 Tbsp；热水 2 Tbsp；糖 1/8 tsp；盐 1/8 tsp
  - 香料：姜 15 g，细丝；葱 2根，细丝；中性油 1 Tbsp，家庭减油版

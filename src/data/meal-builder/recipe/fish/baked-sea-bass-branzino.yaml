steps:
  - 整鱼擦干，两面各划2–3刀；烤箱预热425°F/220°C。
  - 鱼表面薄抹1 Tbsp油和盐，放烤盘中层。
  - 烤约12分钟起按大小检查；最厚处达到145°F/63°C且鱼肉能沿骨轻松分离时出炉。
  - 静置2分钟；孩子份从背部厚肉处取肉并逐指检查鱼刺。
  - 成人可另淋柠檬或酱油，不把重口汁全部加到孩子份。
  - 完成提示：鱼皮干爽略上色，最厚处熟透且鱼肉仍湿润、易分片。
child_serving: 成人彻底去刺后压碎/撕小；本 Recipe 计入 Child Protein。
adult_finish: 孩子份盛出后，成人可另加柠檬、酱油或辣味。
substitutions: [black-sea-bass, live-freshwater-bass when suitable for baking, lemon-herb finish, soy-citrus finish]
cook_ingredients:
  - Branzino / 黑海鲈 / 活淡水鲈鱼：1条，约650–800 g；任选一种
  - 烤鱼基础调味：中性油/橄榄油 1 Tbsp；盐 1/2 tsp；柠檬片 4片，可选

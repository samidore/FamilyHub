steps:
  - 准备：整鱼擦干，两面各划2–3刀；烤箱预热425°F/220°C。；烤盘铺纸，鱼腹可放姜片/柠檬片，不塞得过满。
  - 鱼表面薄抹1 Tbsp油和盐，放烤盘中层。
  - 烤约12分钟起按鱼大小检查；整鱼眼白/鳍不是安全判断，仍以最厚肉中心温度为准。
  - 达到145°F/63°C、鱼肉能沿骨轻松分离时立即出炉。
  - 静置2分钟；孩子份从背部厚肉处取肉并逐指检查鱼刺。
  - 成人可另淋柠檬或酱油，不把酸咸汁全部加到孩子份。
  - 完成提示：鱼皮干爽略上色，最厚处熟透且鱼肉仍湿润、易分片。
  - 安全提示：鱼中心达到145°F/63°C，或肉完全不透明并能轻易分片；给孩子份再次检查鱼刺。
child_serving: 成人彻底去刺后压碎/撕小；Meal Combo 默认保留软蛋白备选。
adult_finish: 孩子份盛出后，成人可按菜式另加辣椒油、辣椒粉或更重调味；不需要则省略。
substitutions:
  - black-sea-bass
  - live-freshwater-bass when suitable for baking
  - lemon-herb finish
  - soy-citrus finish
cook_ingredients:
  - Branzino（欧洲海鲈） / 黑海鲈 / 活淡水鲈鱼：1条，约650–800 g，去鳞去内脏；任选一种；实际选中项使用同一批量
  - 烤鱼基础调味：中性油/橄榄油 1 Tbsp；盐 1/2 tsp；柠檬片 4片，可选

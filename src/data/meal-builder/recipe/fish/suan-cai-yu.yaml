steps:
  - 鱼片如在冷冻状态，提前放冷藏解冻；确认完全解冻后检查并去除明显鱼刺，沥干。鱼片加入玉米淀粉、少量盐和水轻轻抓匀，静置约10分钟，不用重盐腌制。
  - 酸菜切成短段；先尝酸咸程度。若过咸，快速冲洗并攥干；酸菜是本菜必备调味食材，需另行备好。
  - Instant Pot 开 Sauté，中档加入中性油、姜片和蒜末，炒约30秒；加入酸菜翻炒2–3分钟至香气明显，但不炒焦。
  - 加入清水或无盐高汤，烧开后保持温和沸腾约5分钟，尝汤后再决定是否补盐；鱼片下锅前把汤调整成清淡酸香，不放辣椒。
  - 将鱼片逐片放入汤中，调低 Sauté 火力使汤保持轻微沸腾，不搅碎鱼片、不盖压力盖。约3–5分钟开始检查最厚处中心温度，达到145°F/63°C且鱼肉不透明、易分片即可；较厚鱼片继续加热并复查。
  - 先盛出孩子份鱼肉，逐片仔细去刺，剪碎并配少量清淡汤汁；成人碗再按口味淋辣椒油或加辣椒粉。
  - 完成提示：汤汁酸香、鱼片保持完整且熟透；如果汤煮得过咸，可加少量热水调淡，避免久煮鱼片变老。
child_serving: 基础版不辣，鱼片彻底熟透并逐片去刺后剪小；本菜计入 Child Protein，不把酸菜计入蔬菜份额。
adult_finish: 孩子份先盛出；成人碗可另加辣椒油、花椒油或辣椒粉，避免整锅加辣。
substitutions: []
cook_ingredients:
  - 鱼片：450–500 g；冷冻的先冷藏解冻
  - 酸菜（酸芥菜）：约200–250 g，切短段；咸时冲洗并攥干
  - 清水或无盐高汤：800 mL
  - 姜：15 g切片；蒜：2瓣切末
  - 鱼片浆料：玉米淀粉 2 tsp；水 1 Tbsp；盐 1/4 tsp
  - 炒酸菜用中性油：2 tsp；汤的盐量最后尝味再定
  - 成人另加辣椒油或花椒油：可选，分别在碗里加

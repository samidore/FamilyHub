name: Day Trips drive audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/day-trip-drive-audit-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply audited drive-minute buckets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/data/day-trips.json';
          const trips = JSON.parse(fs.readFileSync(path, 'utf8'));
          const driveMinutes = {
            'ja-mcfaul-environmental-center': 15,
            'trailside-nature-science-center': 35,
            'flat-rock-brook-nature-center': 15,
            'flat-rock-brook-jones-road': 15,
            'essex-county-environmental-center': 20,
            'greenburgh-nature-center': 40,
            'teatown-nature-center-lakeside': 50,
            'teatown-cliffdale-farm': 50,
            'dunkerhook-saddle-river': 5,
            'glen-rock-duck-pond': 5,
            'bergen-county-zoo': 10,
            'thielke-arboretum': 5,
            'new-jersey-botanical-garden': 25,
            'frelinghuysen-arboretum': 30,
            'wave-hill': 25,
            'rockefeller-main-entrance-swan-lake': 40,
            'rockefeller-rockwood-hall': 40,
            'bear-mountain-hessian-lake': 50,
            'duke-farms': 70,
            'liberty-science-center': 25,
            nysci: 45,
            'morris-museum': 30,
            'american-museum-natural-history': 25,
            'intrepid-museum': 25,
            'new-jersey-state-museum': 85,
            'memorial-park-fair-lawn': 5,
            'berdan-grove-park': 5,
            'gregory-park': 5,
            'cresthill-park': 5,
            'wild-duck-pond-playground': 10,
            'saddle-river-otto-pehle-area': 10,
            'saddle-river-rochelle-park-area': 10,
            'irene-habernickel-family-park': 10,
            'ridgewood-ymca-community-playground': 10,
            'tenafly-nature-center': 15,
            'lorrimer-sanctuary': 10,
            'votee-park': 10,
            'dundee-island-park': 10,
            'newport-green': 25,
            'brookside-park-river-edge': 10,
            'overpeck-henry-hoebel-north': 15,
            'overpeck-ridgefield-park-area': 15,
            'abmas-farm-wyckoff-pyo': 10,
            'demarest-farms-pyo': 15,
            'dr-davies-farm-pyo': 30,
            'orchards-of-concklin-pyo': 30,
            'ochs-orchard-pyo': 50,
            'masker-orchards': 50,
            'alstede-farms-pyo': 50,
            'stony-hill-farms-pyo': 50,
            'sea-life-new-jersey-aquarium': 15,
            'turtle-back-zoo-world-of-water': 20,
            'maritime-aquarium-norwalk': 65,
            'new-york-aquarium': 50,
            'jenkinsons-aquarium': 85,
            'adventure-aquarium': 110,
          };

          const ids = trips.map((trip) => trip.id);
          const expectedIds = Object.keys(driveMinutes);
          const missing = ids.filter((id) => !(id in driveMinutes));
          const extra = expectedIds.filter((id) => !ids.includes(id));
          if (trips.length !== 56 || missing.length || extra.length) {
            throw new Error(`Day Trips set changed: count=${trips.length}, missing=${missing.join(',')}, extra=${extra.join(',')}`);
          }

          const changes = [];
          for (const trip of trips) {
            const next = driveMinutes[trip.id];
            if (trip.driveMinutes !== next) changes.push(`${trip.id}: ${trip.driveMinutes} -> ${next}`);
            trip.driveMinutes = next;
          }
          if (trips.some((trip) => trip.driveMinutes % 5 !== 0)) throw new Error('driveMinutes must use 5-minute buckets');
          fs.writeFileSync(path, JSON.stringify(trips));
          console.log(changes.join('\n'));
          NODE
      - name: Commit audited data and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/day-trip-drive-audit-once.yml
          git add src/data/day-trips.json
          git diff --cached --check
          git commit -m 'Audit Day Trips drive times'
          git push
